确报错、能力缺失，且已经向用户解释并获得同意时，才允许退回到其他方案。\n\n- 需要结构化解析结果时，优先增加 `--format json`。\n- 注意：`coze code message send --format json` 输出 NDJSON 事件流，必须按行解析，不能直接整段 `JSON.parse()`；应找 `finish: true` 的行获取最终结果。\n- 注意：`coze session message --wait --format json`、`coze session watch --format json`、`coze session progress watch --format json` 也会输出事件流，必须按行/事件解析，不能整段 `JSON.parse()`。\n- `coze session message --wait --format json` 的最终 reply 事件是 `reply_completed`，不是 `finish: true`。\n- 补充：`coze session message --wait --format json` 如果命中后台 `progress_id`，事件流后会额外给出一个稳定的 task 快照对象，至少包含 `task_id`、`progress_id`、`task_status`，后续优先改用 `coze session task *` 跟进。\n- `--format` 默认值为 `text`，text 模式下输出人类可读的格式化文本。\n- JSON 输出的顶层对象可能携带 `_notice` 字段（非业务数据）；两类子字段：`_notice.skill` 表示本机 skills 与 CLI 版本不一致，`_notice.update` 表示有 CLI 新版本可用。看到后在完成当前任务之余执行其 `command` 字段给出的修复命令（如 `coze self skill install` 或 `coze upgrade`），解析业务数据时忽略该字段即可。输出为数组时该提示会改走 stderr 单行文本。默认情况下 skill 不一致会被静默自动修复（`skill.mode=auto`），通常看不到 `_notice.skill`；仅当用户改为 `skill.mode=notify`、或自动同步失败时才会出现该提示。CI 环境（`CI` 环境变量为非 false/0 值）下不产生这两类提示；`COZE_CLI_NO_SKILL_NOTIFIER` 跳过本次 skill 检查（既不同步也不提示），`COZE_CLI_NO_UPDATE_NOTIFIER` 跳过本次升级检查。\n\n- 对 `coze session *`，`message sent`、`watching`、`progress started`、`task finished`、`已完成/耗时 xx s` 都只是过程状态，不是最终用户可见结果。\n- 短任务：拿到 `reply_completed.content/files` 后，必须把回复正文或产物链接整理回给用户。\n- 长任务前置回复：如果 `message --wait --format json` 在命中 `progress_id` / `task_id` 之前，已经出现了有语义的 `reply_update.content` 或 `reply_completed.content`，必须先把这段前置回复回给用户，再继续进入后台任务跟进。\n  - 典型场景：先回复“我先加载 PPT 技能/我先读一下风格参考”，随后才启动 `progre","previewTruncated":true,"bodyLength":18101,"steps":136,"codeBlocks":14,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"0.3.6","models":[]},{"name":"asset-allocation-risk-review","dir":"资产配置风险复盘（asset-allocation-risk-review）","category":"商业与财务","purpose":"从现金流、期限、集中度、流动性和风险承受能力角度复盘家庭或企业资产配置，不提供具体交易建议。","triggers":["资产配置复盘","现金流期限","集中度","风险承受能力"],"boundary":"不提供具体交易建议；不适用于企业经营财务（改走 finance-assistant / business-dashboard-analyst）","description":"从现金流、期限、集中度、流动性和风险承受能力角度复盘家庭或企业资产配置，不提供具体交易建议。触发词如\"资产配置复盘/现金流期限/集中度/风险承受能力\"。｜不提供具体交易建议；不适用于企业经营财务（改走 finance-assistant / business-dashboard-analyst）","lead":"把家庭、个人或小企业的资金安排做成风险复盘表，重点看现金流安全、资产集中度、负债压力、流动性和极端情况承受能力。这个 skill 不推荐具体证券或买卖操作。","headings":[{"level":1,"text":"资产配置风险复盘"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 收集资产负债轮廓"},{"level":3,"text":"Step 2: 识别结构性风险"},{"level":3,"text":"Step 3: 做压力测试"},{"level":3,"text":"Step 4: 输出复盘和动作"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把家庭、个人或小企业的资金安排做成风险复盘表，重点看现金流安全、资产集中度、负债压力、流动性和极端情况承受能力。这个 skill 不推荐具体证券或买卖操作。\n\n- 用户想复盘自己的资产结构，但不想进入炒股建议\n- 用户需要判断现金、应收、负债、保险、固定资产和长期投入是否失衡\n- 用户想做家庭年度财务体检或企业资金安全检查\n- 用户需要把复杂资产情况整理成一张风险表\n\n按大类收集，不要求用户暴露敏感细节。可以用区间和比例替代精确金额：\n\n```text\n现金/活期资金：\n短期应收或待收款：\n长期投入：\n固定资产：\n负债与月供：\n保险和保障：\n未来 6-12 个月大额支出：\n```\n\n检查五个维度：\n\n```text\n现金流：能否覆盖 6-12 个月必要支出\n集中度：是否过度依赖单一资产、客户、平台或收入来源\n期限错配：短钱是否投到长周期事项\n负债压力：固定还款是否挤压经营或生活安全垫\n保障缺口：重大风险发生时是否会拖垮现金流\n```\n\n设计 2-3 个极端但现实的场景，例如收入下降、客户延期付款、利率上升、突发医疗、项目回款失败。计算会先出问题的环节。\n\n只输出风险分级、调整原则和核查动作，不推荐具体股票、基金、币种或入场时点。\n\n```text\n复盘对象：个人 / 家庭 / 小企业\n隐私处理：本复盘可使用区间和比例，不需要精确账户信息\n资产负债摘要：...\n主要风险：\n1. ...\n2. ...\n压力测试：...\n优先修正项：...\n建议补充的数据：...\n边界声明：不提供具体证券买卖建议\n```\n\n1. **不要要求用户暴露隐私**\n   解释：优先使用区间、比例和匿名类别，不索要账号、身份证、家庭成员姓名等信息。\n\n2. **不要变成荐股工具**\n   解释：可以谈集中度、流动性和风险承受能力，不能给具体证券交易动作。\n\n3. **不要忽略负债**\n   解释：资产配置不是只看资产，固定还款、担保、应收账款和未来支出同样重要。","previewTruncated":false,"bodyLength":972,"steps":9,"codeBlocks":3,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"business-analysis","dir":"business-analysis","category":"商业与财务","purpose":"当用户要做商业、项目、市场、投资、竞品分析时使用。","triggers":["分析下这个行业","竞品分析","估值","商业模式","波特五力","SWOT","赛道分析","投资判断","项目可行性"],"boundary":"不适用于写正式报告文稿或汇报（改走 business-writing / work-report），也不适用于项目排期与风险登记（改走 project-management）","description":"当用户要做商业、项目、市场、投资、竞品分析时使用。触发词如\"分析下这个行业/竞品分析/估值/商业模式/波特五力/SWOT/赛道分析/投资判断/项目可行性\"。｜不适用于写正式报告文稿或汇报（改走 business-writing / work-report），也不适用于项目排期与风险登记（改走 project-management）","lead":"用成熟框架做结构化分析，结论可落地，不泛泛而谈。","headings":[{"level":1,"text":"商业分析（业界标准框架）"},{"level":2,"text":"框架选择（按场景，不堆砌）"},{"level":2,"text":"分析流程"},{"level":2,"text":"输出格式"},{"level":2,"text":"注意事项"}],"preview":"用成熟框架做结构化分析，结论可落地，不泛泛而谈。\n\n- 行业吸引力 → **波特五力**（现有竞争/新进入者/替代品/供应商/买方议价）\n- 内外部综合 → **SWOT**（优势/劣势/机会/威胁）\n- 商业模式 → **商业模式画布**（9 格：客户/价值主张/渠道/收入/成本/关键资源…）\n- 产品组合 → **BCG 矩阵**（明星/现金牛/问题/瘦狗）\n- 利润来源 → **价值链分析**\n- 结构化拆解 → **MECE**（相互独立、完全穷尽）\n\n1. **明确问题**：分析什么、给谁看、要做什么决策。\n2. **选框架**：选最贴的 1-2 个，不堆框架。\n3. **查数据**：联网（web_search）查最新数据，标注来源与时间。\n4. **结构化输出**：结论先行 + 分论点 + 数据支撑。\n5. **给行动建议**：可执行、排序、带风险提示。\n\n1. **一句话结论**\n2. **框架分析**（表格/分层呈现）\n3. **关键数据与来源**（可溯源）\n4. **风险与机会**\n5. **行动建议**（按优先级排序）\n\n- 数据必须有来源，不编造；拿不准的标\"待核实\"。\n- 结论要能落地，别只说\"有机会/有风险\"这种空话。\n- 涉及估值、投资，务必提示不确定性，不做拍脑袋结论。","previewTruncated":false,"bodyLength":619,"steps":19,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"business-dashboard-analyst","dir":"经营仪表盘分析（business-dashboard-analyst）","category":"商业与财务","purpose":"分析营收、线索、转化、交付、退款和现金流仪表盘，适合知识付费、小团队和内容业务经营复盘。","triggers":["经营仪表盘","营收线索转化","交付退款","经营复盘"],"boundary":"不适用于市场与竞品调研（改走 market-research-analyst），也不适用于个人资产配置（改走 asset-allocation-risk-review）","description":"分析营收、线索、转化、交付、退款和现金流仪表盘，适合知识付费、小团队和内容业务经营复盘。触发词如\"经营仪表盘/营收线索转化/交付退款/经营复盘\"。｜不适用于市场与竞品调研（改走 market-research-analyst），也不适用于个人资产配置（改走 asset-allocation-risk-review）","lead":"从指标变化里找经营问题，而不是只描述数据涨跌。","headings":[{"level":1,"text":"Business Dashboard Analyst"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"从指标变化里找经营问题，而不是只描述数据涨跌。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n指标诊断、瓶颈定位、异常解释、下周动作：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":759,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"business-writing","dir":"business-writing","category":"商业与财务","purpose":"当用户要写商务或行政文书时使用：工作报告、请示、通知、总结、方案、计划、函件、述职等。","triggers":["写个报告","请示","通知","总结","方案","公文","红头文件"],"boundary":"不适用于周报月报述职（改走 work-report）、邮件（改走 professional-email）、演示文稿文件（改走 dashi-ppt / office-docs）","description":"当用户要写商务或行政文书时使用：工作报告、请示、通知、总结、方案、计划、函件、述职等。触发词如\"写个报告/请示/通知/总结/方案/公文/红头文件\"。｜不适用于周报月报述职（改走 work-report）、邮件（改走 professional-email）、演示文稿文件（改走 dashi-ppt / office-docs）","lead":"先判断文种，再套对应结构；所有文书都要求：一事一议、结论先行、用词克制。","headings":[{"level":1,"text":"商务公文与行政文书写作"},{"level":2,"text":"1. 先问清 4 要素"},{"level":2,"text":"2. 各文种结构与要点"},{"level":2,"text":"3. 语言规范"},{"level":2,"text":"4. 输出格式"},{"level":2,"text":"注意事项"}],"preview":"先判断文种，再套对应结构；所有文书都要求：一事一议、结论先行、用词克制。\n\n- **文种**：报告 / 请示 / 通知 / 总结 / 方案 / 函 / 纪要\n- **受众**：上级 / 平级 / 下级 / 外部\n- **目的**：汇报 / 请求批准 / 部署 / 存档 / 沟通\n- **时限与格式**：是否需要正式红头格式、有无模板\n\n**请示**（请求批准，一文一事）：\n标题\"关于…的请示\" → 主送机关 → 请示缘由 → 请示事项（明确具体） → 结尾\"妥否，请批示\" → 落款日期。\n\n**报告**（汇报情况，不夹带请示）：\n标题\"关于…的报告\" → 基本情况 → 主要做法/进展 → 存在问题 → 下一步打算 → 结尾\"特此报告\"。\n\n**通知**（部署事项）：\n标题\"关于…的通知\" → 主送 → 通知缘由 → 通知事项（分条） → 执行要求 → 落款。\n\n**总结**（复盘经验）：\n总述成绩 → 主要做法与成效（数据支撑） → 存在问题与原因 → 经验体会 → 下一步。\n\n**方案/计划**：\n背景与目标 → 总体思路 → 重点任务（分条、可量化） → 实施步骤与时间 → 保障措施。\n\n- 用\"一是…二是…三是…\"分层，不写长难句。\n- 避免口语、\"大概/可能/差不多\"，用确定表述或明示\"据初步统计\"。\n- 数据说话：能写具体数字就写数字，不写\"显著提升\"这种空话。\n- 公文落款格式：单位全称 + 日期（中文数字或阿拉伯数字，保持一致）。\n\n先给结构大纲（一级/二级标题），确认方向后再写全文；用户要求\"直接写\"时才一次性出全文。\n全文交付时附：标题 + 正文 + 落款 + 一句话说明（这份文书的关键表述依据）。\n\n- 不虚构数据、不代替用户做未授权的承诺。\n- 请示/报告等正式文书保持\"单主题\"，不塞无关内容。","previewTruncated":false,"bodyLength":851,"steps":10,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"finance-assistant","dir":"财务分析助手（finance-assistant）","category":"商业与财务","purpose":"Financial analysis for knowledge payment and online education businesses covering revenue, costs, CAC, LTV, channel ROI, and P&L with benchmarks.","triggers":["Analyze knowledge-payment / online-education finances: CAC, LTV, channel ROI, P&L"],"boundary":"不适用于个人投资建议（改走 asset-allocation-risk-review / financial-risk-literacy），也不适用于市场调研（改走 market-research-analyst）","description":"Financial analysis for knowledge payment and online education businesses covering revenue, costs, CAC, LTV, channel ROI, and P&L with benchmarks. Use when: \"Analyze knowledge-payment / online-education finances: CAC, LTV, channel ROI, P&L\".｜不适用于个人投资建议（改走 asset-allocation-risk-review / financial-risk-literacy），也不适用于市场调研（改走 market-research-analyst）","lead":"专为知识付费 / 在线教育业务设计的财务分析工具。核心任务是把原始收支数据转化为可操作的经营洞察：哪个渠道 ROI 最高、获客成本是否合理、利润结构是否健康，以及与同类业务的基准对比。","headings":[{"level":1,"text":"核心定位"},{"level":1,"text":"触发场景"},{"level":1,"text":"知识付费业务财务特殊性"},{"level":1,"text":"工作流"},{"level":2,"text":"Step 1: 数据收集"},{"level":3,"text":"收入端（必填）"},{"level":3,"text":"成本端（必填）"},{"level":3,"text":"用户数据（计算 CAC/LTV 必需）"},{"level":2,"text":"Step 2: 数据清洗与口径统一"},{"level":2,"text":"Step 3: 核心指标计算"},{"level":3,"text":"收入层"},{"level":3,"text":"CAC（用户获取成本）"},{"level":3,"text":"LTV（用户生命周期价值）"},{"level":3,"text":"LTV:CAC 比率与回收期"},{"level":3,"text":"渠道 ROI"},{"level":3,"text":"完整 P&L"},{"level":2,"text":"Step 4: 对比分析"},{"level":2,"text":"Step 5: 渠道 ROI 表与建议"},{"level":1,"text":"输出格式"},{"level":1,"text":"Gotchas"}],"preview":"专为知识付费 / 在线教育业务设计的财务分析工具。核心任务是把原始收支数据转化为可操作的经营洞察：哪个渠道 ROI 最高、获客成本是否合理、利润结构是否健康，以及与同类业务的基准对比。\n\n---\n\n- 用户提供月度/季度收支数据，需要整理分析\n- 用户问\"我的获客成本合理吗\"、\"哪个投放渠道最划算\"\n- 用户需要生成财务报告给投资人或合伙人\n- 用户不确定某笔费用应该怎么归类\n\n---\n\n与传统电商/SaaS 的关键区别：\n- 收入确认：预收款（课程费用收到）不等于已实现收入（需按授课进度确认）\n- 高退款率：7日无理由退款是标配，必须从收入中扣除\n- 平台抽成：微信/抖音/小红书等各平台有不同抽成比例，影响净收入\n- 分销佣金：私域/KOL 分销的佣金支出应计入 CAC，不能漏\n- 内容资产摊销：课程录制成本属于资本性支出，不应全部计入当期费用\n\n---\n\n向用户索取或让用户填写以下数据表。必填项缺失则暂停分析并明确说明原因。\n\n```\n毛收款（Gross Revenue）：[金额]  ← 平台显示的销售总额\n退款金额：[金额]\n平台手续费/技术服务费：[金额]   ← 微信支付约0.6%，第三方平台更高\n分销佣金支出：[金额]\n```\n\n```\n广告投放费用（按渠道分列）：\n  · 抖音投流：[金额]\n  · 朋友圈广告：[金额]\n  · 小红书投放：[金额]\n  · 百度/SEM：[金额]\n  · KOL/KOC 合作费：[金额]\n  · 其他渠道：[金额]\n\n内容/交付成本：\n  · 讲师课酬：[金额]（内部员工薪资按比例分摊）\n  · 内容制作（录音/剪辑/设计）：[金额]\n  · 直播技术/设备折旧：[金额]\n\n运营成本：\n  · 工具订阅（企业微信服务商/CRM/数据工具等）：[金额]\n  · 客服人力（按比例分摊）：[金额]\n  · 社群运营人力：[金额]\n\n管理费用（可选，用于完整P&L）：\n  · 办公室租金分摊：[金额]\n  · 管理层薪资分摊：[金额]\n```\n\n```\n本期新增付费用户数：[人数]\n本期复购用户数：[人数]\n总付费用户基数：[人数]\n平均客单价：[金额]（或分产品线提供）\n用户平均生命周期内购买次数（若有历史数据）：[X次]\n退款率（退款人数/付款人数）：[X%]\n```\n\n**必须在计算前完成以下检查：**\n\n```\n检查1：确认\"毛收款\"是否包含了退款中的金额\n        → 净收入 = 毛收款 - 退款 - 平台手续费\n\n检查2：分销佣金是否已从收入端扣除？\n        → 建议：佣金计入 CAC（成本），不从收入扣减\n        → 避免同时扣减导致双重计算\n\n检查3：内容制作费是一次性还是可复用？\n        → 可复用内容（录播课）= 资本性支出，建议按12-24个月摊销\n        → 直播/活动性内容 = 当期费用，全额计入\n\n检查4：人力成本是否混入了多个业务线？\n        → 若团队同时服务多个产品，按收入占比分摊\n\n检查5：广告投放数据的时间口径\n        → 投放费用发生时间 vs 转化订单时间可能跨期\n        → 建议：以付款时间对齐，若有明显跨期则说明\n```\n\n```\n净收入（Net Revenue）= 毛收款 - 退款 - 平台手续费\n净收入率 = 净收入 / 毛收款\n\n毛利润 = 净收入 - 内容/交付成本\n毛利率 = 毛利润 / 净收入\n```\n\n**知识付费毛利率基准：**\n```\n录播课为主：毛利率 60-80%（内容边际成本低）\n直播课为主：毛利率 40-65%（讲师成本高）\n1v1辅导：  毛利率 20-45%（人力密集）\n```\n\n```\n总获客费用 = 广告投放费用总和 + KOL合作费 + 分销佣金\nCAC = 总获客费用 / 本期新增付费用户数\n\n按渠道 CAC：\n  渠道A CAC = 渠道A投放费用 / 渠道A带来的新增付费用户数\n```\n\n分销佣金必须计入 CAC，不能遗漏。\n\n```\n方法一（有历史数据）：\n  LTV = 平均客单价 × 平均购买次数 × 毛利率\n\n方法二（无历史数据，估算）：\n  LTV = 平均客单价 × (1 + 复购率估算) × 毛利率\n  → 复购率参考：私域运营强的业务 30-50%，纯广告流量 10-20%\n\n方法三（简化版，适合初创）：\n  LTV = 当前平均客单价 × 毛利率\n  → 保守估算，忽略复购，适合无历史数据时\n```\n\n```\nLTV:CAC = LTV / CAC\n\nCAC 回收期（月）= CAC / (平均客单价 × 毛利率)\n```\n\n**知识付费行业基准：**\n```\nLTV:CAC ≥ 3x         → 合格\nLTV:CAC ≥ 5x         → 良好，可加大投放\nLTV:CAC < 2x         → 警戒，需优化\nLTV:CAC < 1x         → 危险，每新增一个用户都在亏损\n\nCAC 回收期 ≤ 3个月   → 优秀，现金流健康\nCAC 回收期 4-6个月   → 可接受，需监控\nCAC 回收期 > 6个月   → 资金压力大，谨慎扩张\n```\n\n```\n渠道 ROI  = 渠道带来的净收入 / 渠道投放费用\n渠道 ROAS = 渠道带来的毛收款 / 渠道广告费用\n\nROI 用净收入（已扣成本），评估实际盈利性\nROAS 用毛收款（评估广告本身效率用）\n```\n\n```\n毛收款\n- 退款\n- 平台手续费\n= 净收入（Net Revenue）\n\n- 内容/交付成本\n= 毛利润（Gross Profit）\n\n- 市场推广费（广告+KOL+分销佣金）\n- 运营人力费\n- 工具订阅费\n= 经营利润（Operating Profit / EBIT）\n\n- 管理费用\n= 净利润（Net Profit）\n```\n\n**和上期对比（若有历史数据）：**\n```\n对比维度：净收入、毛利率、CAC、LTV:CAC、各渠道ROI\n计算环比变化（%）\n重点标注：毛利率下降 / CAC上升 / 某渠道ROI大幅变化\n```\n\n**和目标对比（若有目标）：**\n```\n达成率 = 实际值 / ","previewTruncated":true,"bodyLength":4837,"steps":36,"codeBlocks":15,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"financial-risk-literacy","dir":"金融风险识别（financial-risk-literacy）","category":"商业与财务","purpose":"识别常见金融产品、贷款、保险、投资宣传和现金流决策中的风险点，输出面向普通人的风险说明与核查清单。","triggers":["金融风险","贷款保险","投资宣传","防坑核查"],"boundary":"不提供具体投资与产品推荐；不适用于企业经营财务（改走 finance-assistant）","description":"识别常见金融产品、贷款、保险、投资宣传和现金流决策中的风险点，输出面向普通人的风险说明与核查清单。触发词如\"金融风险/贷款保险/投资宣传/防坑核查\"。｜不提供具体投资与产品推荐；不适用于企业经营财务（改走 finance-assistant）","lead":"帮助用户理解金融信息背后的成本、风险、约束和不确定性。这个 skill 不推荐具体股票、基金、币种或买卖时点，只做金融常识解释、风险拆解和决策前核查。","headings":[{"level":1,"text":"金融风险识别"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确对象和边界"},{"level":3,"text":"Step 2: 拆出关键信息"},{"level":3,"text":"Step 3: 风险分层"},{"level":3,"text":"Step 4: 生成核查清单"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"帮助用户理解金融信息背后的成本、风险、约束和不确定性。这个 skill 不推荐具体股票、基金、币种或买卖时点，只做金融常识解释、风险拆解和决策前核查。\n\n- 用户看到某个理财、保险、贷款、分期、加盟或投资宣传，想判断风险\n- 用户需要把复杂金融术语翻译成普通人能理解的话\n- 用户想比较不同方案的成本、流动性、违约风险和最坏情况\n- 用户需要一份给家人、团队或学员看的风险提示清单\n\n先确认分析对象是什么：产品、合同、广告、贷款方案、保险条款、现金流决策或投资宣传。标注本次输出只做教育和风险识别，不构成投资建议。\n\n把材料拆成收益承诺、费用结构、锁定期、退出条件、违约责任、资金去向、信息缺口和对方激励。缺少关键数据时直接列为待确认，不用猜。\n\n按四层拆解：\n\n```text\n认知风险：用户可能误解了什么\n现金流风险：最坏情况下要付出什么\n流动性风险：什么时候不能退出或变现\n对手方风险：谁收钱、谁兜底、谁可能失约\n```\n\n输出普通人可执行的问题清单，例如要看哪些合同条款、问对方哪些问题、哪些数字必须算清楚、哪些承诺不能只听口头说法。\n\n```text\n结论摘要：...\n这不是投资建议：本输出只做金融风险识别和教育说明\n对象：...\n已知事实：...\n关键风险：\n1. ...\n2. ...\n成本与最坏情况：...\n必须追问的问题：...\n不建议继续推进的红旗：...\n下一步核查清单：...\n```\n\n1. **不要给买卖建议**\n   解释：不输出买入、卖出、持有、目标价、仓位、短线机会等内容。\n\n2. **不要用收益率盖过风险**\n   解释：先讲本金、现金流、锁定期和退出条件，再讲可能收益。\n\n3. **不要假装看过合同**\n   解释：用户没给原文时，只能输出待核查问题，不能替合同下结论。","previewTruncated":false,"bodyLength":893,"steps":9,"codeBlocks":2,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"lead-followup-automation","dir":"线索跟进自动化（lead-followup-automation）","category":"商业与财务","purpose":"自动整理销售线索、生成跟进话术和下一步动作，适合私域、课程咨询、企业服务和合作机会跟进。","triggers":["销售线索","跟进话术","私域跟进","课程咨询跟进"],"boundary":"不适用于市场调研（改走 market-research-analyst），也不适用于邮件文书成稿（改走 professional-email）","description":"自动整理销售线索、生成跟进话术和下一步动作，适合私域、课程咨询、企业服务和合作机会跟进。触发词如\"销售线索/跟进话术/私域跟进/课程咨询跟进\"。｜不适用于市场调研（改走 market-research-analyst），也不适用于邮件文书成稿（改走 professional-email）","lead":"把客户状态、意图、阻塞点和下一步动作分清楚，减少漏跟。","headings":[{"level":1,"text":"Lead Followup Automation"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把客户状态、意图、阻塞点和下一步动作分清楚，减少漏跟。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n线索分层、跟进话术、任务列表、风险提醒：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":761,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"market-research-analyst","dir":"市场调研分析（market-research-analyst）","category":"商业与财务","purpose":"对行业、竞品、用户、价格和渠道进行结构化市场调研，适合新项目判断、课程选题和产品定位。","triggers":["市场调研","竞品分析","用户调研","定价渠道"],"boundary":"不适用于财务与经营数据复盘（改走 business-dashboard-analyst），也不适用于正式报告成稿（改走 docx-report-builder）","description":"对行业、竞品、用户、价格和渠道进行结构化市场调研，适合新项目判断、课程选题和产品定位。触发词如\"市场调研/竞品分析/用户调研/定价渠道\"。｜不适用于财务与经营数据复盘（改走 business-dashboard-analyst），也不适用于正式报告成稿（改走 docx-report-builder）","lead":"把碎片信息整理成市场规模、竞争格局和进入策略。","headings":[{"level":1,"text":"Market Research Analyst"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把碎片信息整理成市场规模、竞争格局和进入策略。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n调研框架、竞品表、机会判断、风险假设：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":755,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"project-management","dir":"project-management","category":"商业与财务","purpose":"当用户要管理项目、制定计划、拆解任务、排期、做风险管理时使用（PMP/PMBOK 方法论）。","triggers":["项目计划","WBS","甘特图","里程碑","风险管理","干系人","关键路径","进度跟踪"],"boundary":"不适用于个人日程与提醒（改走 scheduling），也不适用于内容更新排期（改走 content-calendar）","description":"当用户要管理项目、制定计划、拆解任务、排期、做风险管理时使用（PMP/PMBOK 方法论）。触发词如\"项目计划/WBS/甘特图/里程碑/风险管理/干系人/关键路径/进度跟踪\"。｜不适用于个人日程与提醒（改走 scheduling），也不适用于内容更新排期（改走 content-calendar）","lead":"按 PMP/PMBOK 标准做项目管理，产出可配合飞书表格/Excel 使用。","headings":[{"level":1,"text":"项目管理（PMBOK 方法论）"},{"level":2,"text":"核心工具"},{"level":2,"text":"流程"},{"level":2,"text":"输出格式"},{"level":2,"text":"注意事项"}],"preview":"按 PMP/PMBOK 标准做项目管理，产出可配合飞书表格/Excel 使用。\n\n- **WBS**：工作分解结构（按**可交付物**拆，不是按活动列清单）。\n- **排期 + 甘特图**：任务 + 负责人 + 起止 + 依赖关系。\n- **关键路径 CPM**：决定项目最短工期的那条依赖链。\n- **里程碑**：关键节点（不是每个任务都算里程碑）。\n- **风险登记册**：风险 + 概率 + 影响 + 应对策略。\n- **干系人矩阵**：按权力/利益分类，定管理策略。\n\n1. 明确目标 + 范围 + 可交付物 + 验收标准。\n2. 拆 WBS（可交付物导向）。\n3. 排期（依赖 + 关键路径 + 里程碑）。\n4. 识别风险（登记册）+ 干系人（矩阵）。\n5. 输出计划文档（Markdown，或转飞书表格/Excel）。\n\n- **项目章程**：目标 / 范围 / 干系人 / 里程碑\n- **WBS 清单**\n- **排期表**（任务 | 负责人 | 起止 | 依赖）\n- **风险登记册**（表格：风险 | 概率 | 影响 | 应对）\n- **每周进度状态**（完成 / 进行中 / 风险）\n\n- 计划要**可执行、可跟踪**，不写空话。\n- 范围变更走变更流程，不随意加需求。\n- 里程碑要能验证；风险要量化（概率×影响）。","previewTruncated":false,"bodyLength":623,"steps":19,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"spreadsheet-analyst","dir":"表格分析助手（spreadsheet-analyst）","category":"商业与财务","purpose":"清洗 Excel/CSV 表格，生成透视、指标、异常点和经营解释，适合销售、投放、财务和运营数据。","triggers":["清洗Excel","透视表","异常点","销售投放数据"],"boundary":"不适用于文档与演示产出（改走 office-docs / yizhou-ppt），也不适用于财务建模（改走 finance-assistant）","description":"清洗 Excel/CSV 表格，生成透视、指标、异常点和经营解释，适合销售、投放、财务和运营数据。触发词如\"清洗Excel/透视表/异常点/销售投放数据\"。｜不适用于文档与演示产出（改走 office-docs / yizhou-ppt），也不适用于财务建模（改走 finance-assistant）","lead":"让表格分析直接服务决策，而不是只算平均值和排序。","headings":[{"level":1,"text":"Spreadsheet Analyst"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"让表格分析直接服务决策，而不是只算平均值和排序。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n数据清洗记录、指标表、异常解释、行动建议：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":754,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"work-report","dir":"work-report","category":"商业与财务","purpose":"当用户要写工作汇报时使用：周报、月报、季度总结、述职报告、项目进展汇报、向上汇报。","triggers":["周报","月报","述职","汇报","总结一下这周","进展"],"boundary":"不适用于公文/方案/通知（改走 business-writing）、会议纪要（改走 meeting-notes）、邮件（改走 professional-email）","description":"当用户要写工作汇报时使用：周报、月报、季度总结、述职报告、项目进展汇报、向上汇报。触发词如\"周报/月报/述职/汇报/总结一下这周/进展\"。｜不适用于公文/方案/通知（改走 business-writing）、会议纪要（改走 meeting-notes）、邮件（改走 professional-email）","lead":"汇报的核心是\"让上级 30 秒看懂你做了什么、有什么价值、需要什么支持\"，不是流水账。","headings":[{"level":1,"text":"工作汇报（周报 / 月报 / 述职）"},{"level":2,"text":"1. 通用结构"},{"level":2,"text":"2. 写法规则"},{"level":2,"text":"3. 不同文种的侧重"},{"level":2,"text":"4. 输出格式"},{"level":2,"text":"注意事项"}],"preview":"汇报的核心是\"让上级 30 秒看懂你做了什么、有什么价值、需要什么支持\"，不是流水账。\n\n1. **结论先行**：一句话总述本期结果（达标/超预期/有风险）。\n2. **关键成果**：2-4 条，每条「成果 + 量化数据 + 影响」。\n3. **进行中事项**：进度 + 预计完成时间 + 有无风险。\n4. **问题与风险**：暴露问题并附\"我打算怎么解决/需要什么支持\"。\n5. **下期计划**：3 条以内，可量化、有优先级。\n\n- **量化优先**：把\"推进了 XX 工作\"改成\"完成 3 项任务，其中 A 提效 40%\"。\n- **用 STAR/结果导向**：背景一句话 → 做了什么 → 结果如何（数据）。\n- **问题要带方案**：不说\"遇到困难\"，说\"遇到 X，拟用 Y 方案，需要 Z 支持\"。\n- **计划要可验收**：不说\"继续推进\"，说\"完成 X，交付 Y\"。\n\n- **周报**：简短，重点\"这周完成 + 下周计划\"，问题只写需要上级介入的。\n- **月报**：在周报基础上加\"目标达成率 + 复盘 + 下月重点\"。\n- **述职/季度**：加\"能力成长 + 对团队/业务的贡献 + 未来规划\"，体现思考深度。\n\n默认输出一份可直接粘贴的汇报（标题 + 分节正文 + 关键数据加粗），控制在：周报 ≤300 字、月报 ≤600 字、述职可扩展。\n同时附一句\"还可补充的亮点数据\"，提示用户填数。\n\n- 不夸大、不把未完成写成完成；数据留空处用【填数据】占位。\n- 汇报对象是上级时，语气客观、不邀功、不抱怨。","previewTruncated":false,"bodyLength":748,"steps":14,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"digital-human","dir":"digital-human","category":"视频与音频","purpose":"当用户要生成数字人口播视频、对口型视频、让图片说话时使用。","triggers":["数字人","口播","对口型","让图片说话","用我的形象介绍","唱歌视频"],"boundary":"不适用于只写口播脚本（改走 short-video-script），也不适用于纯文生视频/图生视频（改走 seedance-video）","description":"当用户要生成数字人口播视频、对口型视频、让图片说话时使用。触发词如\"数字人/口播/对口型/让图片说话/用我的形象介绍/唱歌视频\"。｜不适用于只写口播脚本（改走 short-video-script），也不适用于纯文生视频/图生视频（改走 seedance-video）","lead":"调用火山引擎即梦 CV API（OmniHuman），根据人像图片 + 音频生成数字人说话/对口型视频。","headings":[{"level":1,"text":"数字人口播（OmniHuman 1.5，火山即梦 CV API）"},{"level":2,"text":"API（已解码的确切信息）"},{"level":2,"text":"关键门槛：图片和音频必须是公网 URL"},{"level":2,"text":"签名（火山 V4，HMAC-SHA256）"},{"level":2,"text":"两种用法"},{"level":2,"text":"工作流"},{"level":2,"text":"注意事项"}],"preview":"调用火山引擎即梦 CV API（OmniHuman），根据人像图片 + 音频生成数字人说话/对口型视频。\n\n- Endpoint：`https://visual.volcengineapi.com`\n- Service：`cv`，Region：`cn-north-1`\n- 鉴权：火山签名 V4（HMAC-SHA256），用 AK/SK（凭据里 `VOLC_ACCESS_KEY_ID` / `VOLC_SECRET_ACCESS_KEY`）\n- 三个 Action（Version `2022-08-31`）：\n  1. `CVProcess` — 主体检测（可选，识别人物 + mask）\n  2. `CVSubmitTask` — 提交生成任务（body 含 `req_key` + `image_url` + `audio_url` + `prompt`）\n  3. `CVGetResult` — 轮询结果（返回 `data.video_url`）\n\n- 本地文件先传**火山 TOS 对象存储**（同样用 AK/SK）拿公网 URL。\n- 或用公网文件服务/图床。\n\n- SignedHeaders：`content-type;host;x-content-sha256;x-date`\n- credential_scope：`datestamp/cn-north-1/cv/request`\n- Authorization：`HMAC-SHA256 Credential=AK/scope, SignedHeaders=..., Signature=...`\n\n- **类型 A（形象+介绍）**：人像图 + TTS 介绍音频 → 数字人口播。\n- **类型 B（音频+首图对口型唱歌）**：用户提供音频（≤60 秒）+ 首图 → 对口型视频。\n\n1. 拿到图片 + 音频（用户提供，或 TTS 生成音频）。\n2. 上传 TOS → 拿公网 URL。\n3. 签名调 `CVSubmitTask` → 拿 task_id。\n4. 轮询 `CVGetResult` → 拿 `video_url`。\n5. 下载保存。\n\n- 音频 ≤ 60 秒；图片需清晰正脸。\n- 报错重点查：AK/SK 是否正确、URL 是否公网可访问、文件格式是否对。\n- 视频生成 60-120 秒，需轮询。","previewTruncated":false,"bodyLength":1126,"steps":22,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"Seedream","scene":"文生图（火山方舟）"},{"name":"Seedance","scene":"文生视频（火山方舟）"}]},{"name":"embedded-captions","dir":"embedded-captions","category":"视频与音频","purpose":"Add captions or subtitles to an existing single-subject talking-head video without editing the footage. Route by visual identity, not by backend engine. The quiet `anchor` rail is the default; embed every word only when the user explicitly wants a fully cinematic treatment. The workflow runs locally end to end, including transcription and subject matting; split multi-shot footage before applying it.","triggers":["plain verbatim captions","VFX captions","特效","酷炫字幕"],"boundary":"","description":"Add captions or subtitles to an existing single-subject talking-head video without editing the footage. Use for plain verbatim captions, cinematic captions embedded behind the subject, VFX captions, “炸/特效/酷炫字幕,” or a named identity from the 35-style catalog. Route by visual identity, not by backend engine. The quiet `anchor` rail is the default; embed every word only when the user explicitly wants a fully cinematic treatment. The workflow runs locally end to end, including transcription and subject matting; split multi-shot footage before applying it.","lead":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update embedded-captions`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.","headings":[{"level":1,"text":"Embedded Captions"},{"level":2,"text":"Operational flow (TL;DR)"},{"level":2,"text":"Caption model — rail + embed"},{"level":2,"text":"Step 0 — pick ONE identity from the CATALOG"},{"level":2,"text":"Decision gate — RUN FIRST"},{"level":3,"text":"Pre-flight probes (cost nothing, prevent the worst failures)"},{"level":2,"text":"Pipeline — 5 steps"},{"level":3,"text":"Step 3 — Cinematic mode (pure embed)"},{"level":3,"text":"Step 3 — Theme mode (themed constitution)"},{"level":2,"text":"Visual QA — preview BEFORE you render"},{"level":2,"text":"The DNA registry — ten visual languages (replaces the template catalog)"},{"level":2,"text":"Aesthetic decision — tone × shot × platform (input to the catalog shortlist, NOT a second router)"},{"level":2,"text":"Composition craft (embed track) — read before embedding"},{"level":2,"text":"Shared knowledge"},{"level":2,"text":"Non-negotiables"},{"level":2,"text":"Dependencies"}],"preview":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update embedded-captions`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\n**One catalog, picked up front** ([CATALOG.md](CATALOG.md) — 35 identities; the engines behind it are backend detail). **Standard** (default) builds a clean verbatim **rail** (lower-third subtitle carrying most text) + an **embed** climax composited _into_ the scene behind the subject at the peak. **Cinematic** is pure embed — no rail, every caption composited behind the subject (hero typography, accumulation, occlusion as the effect). **Theme** is a complete themed constitution — body paradigm × hero setpiece × front fx × plate reaction, composed from registries ([themes/README.md](themes/README.md)): `ordnance` `terminal` `neonsign` `stardust` `stomp`. Most explainer / voiceover is **Standard**; **embed is the scarce, earned peak** — embedding every word is the common mistake; Theme is for VFX-grade asks (\"炸\", \"特效\", \"像 AE 做的\").\n\n---\n\nRouted through `/hyperframes`, the intent layer confirms only the input (which clip) and **announces** the identity pick as a deferred ask — the shortlist needs the probed clip, so it stays at step 1 below; the layer's run-shape questions don't apply (the footage is untouched, there is no storyboard to review). A `BRIEF.md`, when present, carries the confirmed input and any user notes — read it first.\n\nThe craft prose below is long; the **pipeline itself is short** — and everything deterministic is computed or compiled, never hand-written:\n\n1. **Decision gate** (refuse bad clips) → **pick ONE identity from [CATALOG.md](CATALOG.md)** (35 identities; engine/compiler derived by lookup — never surface a mode/category question)\n2. `hyperframes init` (skip it if the project dir already exists with the video inside — `matte.cjs`/`transcribe.cjs` adopt any video in the dir as source.mp4) → **`bash scripts/prepare.sh <project>`** (matte ∥ transcribe ∥ audio-envelope in parallel, then safe-zones v2 with scene palette/optics/lighting — one command, nothing forgotten)\n3. **author a small JSON of creative choices** (read `safe-zones.json` first): Cinematic → `plan.json` → `fill-timings.cjs` → `fit-fonts.cjs` → `make-composition.cjs`; Theme → `theme.json` → `make-theme.cjs` (rail/panel/poem/takeover paradigms; `anchor` is the quiet rail default)\n4. **Visual QA**: `node scripts/preview-frames.cjs <project>` → faithful composite previews in ~2s/frame (no render). Check § Vis","previewTruncated":true,"bodyLength":31482,"steps":62,"codeBlocks":2,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"依赖已解决(2026-09-11)：hyperframes CLI 0.8.34 已装；whisper.cpp 引擎(b4938 预编译)已装并应用 Windows 兼容补丁(无扩展名副本，绕开上游漏 .exe 的缺陷)；多语言模型 ggml-small 已就位。已用视频号真实音频端到端转写成功。注意：scripts/transcribe.cjs 另需源码布局 packages/cli/dist/cli.js，直接用 hyperframes transcribe 命令即可","version":"","models":[{"name":"whisper","scene":"本机语音转写"},{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"faceless-explainer","dir":"faceless-explainer","category":"视频与音频","purpose":"\"Turn arbitrary text — an article, notes, a topic, a brief — into a faceless explainer video: there is no site or footage to capture, so the visuals are invented per scene (typography, abstract graphics, diagrams, data-viz). Not a video built from a website (/product-launch-video — promo or tour). Unclear → /hyperframes.\"","triggers":["topic explainers, concept breakdowns, how-tos, listicles"],"boundary":"","description":"\"Turn arbitrary text — an article, notes, a topic, a brief — into a faceless explainer video: there is no site or footage to capture, so the visuals are invented per scene (typography, abstract graphics, diagrams, data-viz). Use for topic explainers, concept breakdowns, how-tos, listicles. Not a video built from a website (/product-launch-video — promo or tour). Unclear → /hyperframes.\"","lead":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update faceless-explainer`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.","headings":[{"level":1,"text":"Faceless Explainer to HyperFrames"},{"level":2,"text":"Step 0: Setup"},{"level":2,"text":"Step 1: Brief (no capture)"},{"level":2,"text":"Step 2: Design System"},{"level":2,"text":"Step 3: Storyboard and Script"},{"level":2,"text":"Step 3.1: Audio"},{"level":2,"text":"Step 4: Frame Visual Design"},{"level":2,"text":"Step 5: Build Frames"},{"level":2,"text":"Step 6: Finalize"},{"level":2,"text":"Quick Reference"}],"preview":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update faceless-explainer`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\n> **media-use**: Before sourcing audio/images/logos, call `/media-use` to resolve BGM/SFX/images from the HeyGen catalog and brand logos from their official sources. Run `--adopt` first to register existing assets. See `/media-use` skill.\n\nUse this skill to turn a body of text into an explainer video: pick a design system, plan a teaching story, and build it frame by frame in HyperFrames. **Faceless** means every visual is invented downstream — there is no capture step and no real asset inventory.\n\n> **The front door is `/hyperframes`.** You are the orchestrator. Run each step, verify its gate, and only then continue. This skill is for **explaining a topic from text, with no product and no website to capture**. Any other intent, a bare \"make a video\", or any uncertainty → read `/hyperframes` first — the intent layer owns every route decision, and a fresh creation arriving here without `BRIEF.md` goes through it anyway (Setup's opening rule).\n\nYou are the orchestrator. Work in `videos/<project>/`. Run steps in order and pass each gate before continuing. User-gated steps are Step 0, Step 3, and Step 6. Read `../hyperframes-core/references/brief-contract.md` before Step 0 — it defines the gate types and how `BRIEF.md`'s `flow`/`storyboard` derive the mode that governs the Step 3/4/6 gates. Do every step yourself except Step 5, where you dispatch one sub-agent per frame. Do not put design or motion rules here; those live in the frame-worker sub-agent, this skill's local `../hyperframes-animation/rules/` + `../hyperframes-animation/blueprints/`, and `hyperframes-creative`.\n\nWorkflow: Step 0 setup → `hyperframes.json`; Step 1 brief → `capture/extracted/`; Step 2 design system → `frame.md`; Step 3 storyboard/script → `STORYBOARD.md` and `SCRIPT.md`; Step 3.1 audio → `audio_meta.json`; Step 4 visual design → enriched `STORYBOARD.md`; Step 5 frames → `compositions/frames/NN-*.html` and `index.html`; Step 6 final render → `renders/video.mp4`.\n\n---\n\nGoal: Enter with a confirmed brief, create the HyperFrames project, and make the brief durable.\n\n**The brief is confirmed by the intent layer, not by questions asked here.** Opening rule, in order: **(1)** `BRIEF.md` exists → read it and ask nothing — the brief is settled, and its `flow`/`storyboard` derive the mode (brief contract § 1). **(2)** No `BRIEF","previewTruncated":true,"bodyLength":28242,"steps":4,"codeBlocks":1,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"general-video","dir":"general-video","category":"视频与音频","purpose":"Author or edit a custom HyperFrames composition when no specialized workflow fits, or when BRIEF.md sets flow: companion. Use motion-graphics instead for a short unnarrated motion-first unit, including an animated title. Route fresh creation through hyperframes before using this skill.","triggers":["longer or multi-scene pieces, brand and sizzle reels, montages, static loops, static title…"],"boundary":"","description":"Author or edit a custom HyperFrames composition when no specialized workflow fits, or when BRIEF.md sets flow: companion. Use for longer or multi-scene pieces, brand and sizzle reels, montages, static loops, static title cards, footage remixes, and freeform builds. Use motion-graphics instead for a short unnarrated motion-first unit, including an animated title. Route fresh creation through hyperframes before using this skill.","lead":"Before relying on this workflow, run:","headings":[{"level":1,"text":"General video"},{"level":2,"text":"1. Apply cross-cutting source adapters"},{"level":2,"text":"2. Start from project state"},{"level":2,"text":"3. Interpret the run shape"},{"level":3,"text":"Companion flow"},{"level":2,"text":"4. Load required knowledge before each stage"},{"level":2,"text":"5. Execute the composition"},{"level":2,"text":"6. Gates that always apply"},{"level":3,"text":"Keep scope exact"},{"level":3,"text":"Establish design before HTML"},{"level":3,"text":"Preserve the composition contract"},{"level":3,"text":"Borrow workflows safely"},{"level":2,"text":"7. Done"}],"preview":"Before relying on this workflow, run:\n\n```bash\nnpx hyperframes skills update general-video\n```\n\nA successful no-op means the skill is current. Surface an update failure instead of continuing from memory.\n\n- **Media:** For any audio, image, icon, logo, voice, grade, LUT, treatment/effect, caption, or media-operation need, load `/media-use` and follow `../media-use/references/resolve.md` (resolve, adopt, reuse) and `../media-use/references/setup-providers.md` (providers, auth). Vague footage feedback and named styles use `../media-use/references/media-treatments.md` before editing; do not improvise supported media effects with CSS/SVG/opacity. Before the first authenticated provider action, run `npx hyperframes auth status` and relay its output verbatim. If signed out, apply the gate in `../hyperframes-core/references/brief-contract.md`: collaborative waits for sign-in or an explicit offline choice; autonomous states the status and continues through an available offline provider. Surface a blocker when no offline provider can satisfy a required capability. Local adoption alone does not require an auth gate.\n- **Figma:** If any input is a `figma.com` URL, run `/figma` first. Build from its exported assets, tokens, components, or storyboard frames. Do not use raw Figma connector calls because they skip SVG sanitization, media provenance, and brand-token binding.\n\nThese adapters do not change the workflow selected by `/hyperframes`.\n\nApply the first matching row; do not evaluate lower state rows:\n\n| State                                                      | Action                                                                                                         |\n| ---------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------- |\n| Specific edit                                              | Make the edit, preserve existing project decisions, then rerun affected checks. Do not reopen discovery.       |\n| `BRIEF.md` exists                                          | Read it. If `workflow` names another workflow and `flow` is not `companion`, hand off. Ask no brief questions. |\n| No brief, but `hyperframes.json` or `STORYBOARD.md` exists | Resume from files and recorded preferences. Backfill `BRIEF.md` only from known facts.                         |\n| Fresh creation                                             | Run `/hyperframes` and its intent layer. Return here only for `workflow: general-video` or `flow: companion`.  |\n\nFor a new project, choose","previewTruncated":true,"bodyLength":19399,"steps":33,"codeBlocks":2,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"hyperframes","dir":"hyperframes","category":"视频与音频","purpose":"Mandatory entry point: read this first for any request to make, create, edit, animate, or render a video, animation, or motion graphic, including a promo, explainer, captioned clip, title card, overlay, slideshow or interactive deck, Remotion port, or any HyperFrames HTML composition. Also use it to inspect, diagnose, validate, preview, publish, or batch-render an existing HyperFrames project. Inputs may be a website URL, GitHub PR, Figma design or URL, text or brief, existing footage, or music. It resumes project state, captures intent when applicable, selects and installs the owning workflow, and routes domain capabilities. HyperFrames is the default output framework unless the user explicitly chooses another framework for the deliverable or asks only to record a browser session.","triggers":[],"boundary":"","description":"Mandatory entry point: read this first for any request to make, create, edit, animate, or render a video, animation, or motion graphic, including a promo, explainer, captioned clip, title card, overlay, slideshow or interactive deck, Remotion port, or any HyperFrames HTML composition. Also use it to inspect, diagnose, validate, preview, publish, or batch-render an existing HyperFrames project. Inputs may be a website URL, GitHub PR, Figma design or URL, text or brief, existing footage, or music. It resumes project state, captures intent when applicable, selects and installs the owning workflow, and routes domain capabilities. HyperFrames is the default output framework unless the user explicitly chooses another framework for the deliverable or asks only to record a browser session.","lead":"HyperFrames **renders video from HTML** — a composition is an HTML file whose DOM declares timing with `data-*` attributes, whose animation runtime is seekable, and whose media playback is owned by the framework. The full authoring contract lives in `/hyperframes-core`; read it before writing composition HTML.","headings":[{"level":1,"text":"HyperFrames entry point"},{"level":2,"text":"1. Start from project state"},{"level":3,"text":"Keep the project's CLI current"},{"level":2,"text":"2. Route fresh creation"},{"level":3,"text":"Resolve common ambiguities"},{"level":2,"text":"3. Route once, then leave"},{"level":2,"text":"4. Install and enter the workflow"},{"level":2,"text":"5. Load domain skills on demand"}],"preview":"HyperFrames **renders video from HTML** — a composition is an HTML file whose DOM declares timing with `data-*` attributes, whose animation runtime is seekable, and whose media playback is owned by the framework. The full authoring contract lives in `/hyperframes-core`; read it before writing composition HTML.\n\nApply the first matching row; do not evaluate lower state rows:\n\n| State                                                                                                                         | Action                                                                                                                                                                                                      |\n| ----------------------------------------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Explicit port of existing Remotion source to HyperFrames                                                                      | Read `references/routes/remotion-to-hyperframes.md`, then route directly to that workflow. Skip the intent layer.                                                                                           |\n| Specific operation on an existing HyperFrames project: inspect, diagnose, validate, preview, render, publish, or batch-render | Perform only that operation. Skip intent and workflow routing; load `/hyperframes-cli` and any required domain skills.                                                                                      |\n| Specific edit to an existing project                                                                                          | Make the edit. Do not run the intent layer.                                                                                                                                                                 |\n| `BRIEF.md` exists                                                                                                             | Read `workflow` and `flow`. Execute that workflow; `flow: companion` always executes in `/general-video`. Ask no brief questions.                                                                           |\n| No brief, but `hyperframes.json` or `STORYBOARD.md` exists                                                                    | Resume from project files and recorded preferences. Infer the owning workflo","previewTruncated":true,"bodyLength":14761,"steps":6,"codeBlocks":2,"hasScripts":false,"missingBins":[],"source":"hyperframes 官方仓库 (heygen-com/hyperframes)","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"hyperframes-animation","dir":"hyperframes-animation","category":"视频与音频","purpose":"\"All animation knowledge for HyperFrames — atomic motion rules, multi-phase scene blueprints, scene transitions, broader motion-design techniques, AND the seven runtime adapters (GSAP default, plus Lottie, Three.js, Anime.js, CSS keyframes, Web Animations API, TypeGPU). g. GSAP eases / Lottie player / Three.js mixer). Also covers auditing an existing composition's choreography (animation map) and 24 named text-animation effects. HyperFrames-native: single paused timeline, seek-safe, deterministic.\"","triggers":["any motion or animation task: pick 2-4 rules and compose, or load a blueprint, or look up …"],"boundary":"","description":"\"All animation knowledge for HyperFrames — atomic motion rules, multi-phase scene blueprints, scene transitions, broader motion-design techniques, AND the seven runtime adapters (GSAP default, plus Lottie, Three.js, Anime.js, CSS keyframes, Web Animations API, TypeGPU). Use for any motion or animation task: pick 2-4 rules and compose, or load a blueprint, or look up runtime-specific API (e.g. GSAP eases / Lottie player / Three.js mixer). Also covers auditing an existing composition's choreography (animation map) and 24 named text-animation effects. HyperFrames-native: single paused timeline, seek-safe, deterministic.\"","lead":"All motion knowledge in one skill: **rules** (atomic recipes), **blueprints** (multi-phase scene templates), **transitions** (scene-to-scene), **techniques** (broader motion-design patterns), and **adapters** (per-runtime APIs).","headings":[{"level":1,"text":"HyperFrames Animation"},{"level":2,"text":"Default: compose atomic rules"},{"level":2,"text":"Load a blueprint when"},{"level":2,"text":"Routing"},{"level":2,"text":"Picking a runtime"},{"level":2,"text":"Critical Constraints"},{"level":2,"text":"Scripts"},{"level":2,"text":"See Also"}],"preview":"All motion knowledge in one skill: **rules** (atomic recipes), **blueprints** (multi-phase scene templates), **transitions** (scene-to-scene), **techniques** (broader motion-design patterns), and **adapters** (per-runtime APIs).\n\nFor the composition contract (data attributes, sub-compositions, determinism) see `hyperframes-core`.\n\nPick 2-4 rules from `rules-index.md`, glue them together with a single paused GSAP timeline, done. This is faster and produces less code than starting from a blueprint.\n\n- The scene matches an existing pre-designed multi-phase template (brand-reveal, social-proof, etc.) and reusing its phase pipeline saves real authoring time\n- You want runnable ground-truth code for a complex 4-5 phase choreography\n\nBlueprints live in `blueprints-index.md`. Each entry points to `blueprints/<id>.md` (recipe). Do not read it speculatively; load it when you've already decided you need scene-level orchestration.\n\n| Want to…                                                                       | Read                                                |\n| ------------------------------------------------------------------------------ | --------------------------------------------------- |\n| Pick an atomic motion pattern by trigger / tag                                 | `rules-index.md`                                    |\n| Read one rule's full HTML / CSS / GSAP recipe                                  | `rules/<name>.md`                                   |\n| Pick a multi-phase scene template                                              | `blueprints-index.md`                               |\n| Read one blueprint's full recipe                                               | `blueprints/<id>.md`                                |\n| Author a scene transition (CSS-driven, between two clips)                      | `transitions/overview.md`, `transitions/catalog.md` |\n| Look up a broader motion-design technique                                      | `techniques.md`                                     |\n| Analyze an existing composition's animation map                                | `scripts/animation-map.mjs`                         |\n| GSAP API — timeline / tweens / position parameters                             | `adapters/gsap.md`                                  |\n| GSAP — drop-in effect recipes                                                  | `rules/gsap-effects.md`                             |\n| GSAP — transforms / perf                                                       | `adapters/gsap-transforms-and-perf.md`              |\n| GSAP — eases / stagg","previewTruncated":true,"bodyLength":7078,"steps":14,"codeBlocks":1,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"hyperframes-audio","dir":"hyperframes-audio","category":"视频与音频","purpose":"Don't Don't","triggers":["audio already placed in a HyperFrames composition needs to be mixed: fade-in/fade-out, cro…"],"boundary":"","description":"Use when audio already placed in a HyperFrames composition needs to be mixed: fade-in/fade-out, crossfade, track gain or volume, volume automation, ducking, a music bed that fights a voiceover (voiceover carve), effects on a track (EQ, compressor, limiter, gate, saturation, delay, reverb, chorus, phaser, bitcrush), automation envelopes drawn on a track's volume or any effect parameter, or one submix bus carrying a chain, a fader and an automation clock for several tracks at once (`<hf-audio-group>`). Don't use for sourcing or generating audio — finding BGM, SFX, or making a voiceover is `/media-use`. Don't use for clip timing or track layout, which is `/hyperframes-core`.","lead":"A mix is a set of relationships, not a stack of processors. Two tracks that each","headings":[{"level":1,"text":"HyperFrames Audio"},{"level":2,"text":"How it fits together"},{"level":2,"text":"First, work out what is wrong"},{"level":2,"text":"Start from the symptom"},{"level":2,"text":"Reach for a family by the problem, not the name"},{"level":2,"text":"Voiceover carve"},{"level":3,"text":"One bus for many tracks"},{"level":2,"text":"Automation"},{"level":2,"text":"Verify"}],"preview":"A mix is a set of relationships, not a stack of processors. Two tracks that each\nsound right alone can be unlistenable together, and the fix is almost never \"turn\none down\" — it is finding what they are fighting over and giving it to whichever\none needs it. Every tool here exists to express one of those relationships.\n\nEffects live on the element as `data-fx-chain`, and preview and render run the\nsame Web Audio graph — the studio in a live context, the engine in an offline one\ninside the browser it already drives. There is one implementation of each effect,\nso what you hear while scrubbing is what gets written. You never tune twice.\n\nClip timing remains `/hyperframes-core`: audio/video trims and source ranges use\n`data-start`, `data-duration`, and `data-media-start`, and crossfades overlap\nclips on different tracks. This skill owns placed-track fade-in/fade-out,\ncrossfade envelopes, track gain/track volume, volume and effect automation,\nducking/voiceover carve, and the effect chain. `/media-use` owns sourcing,\ngeneration, and preprocessing.\n\nConstant `data-playback-rate` (`0.1..5`) is render-safe for picture and\npitch-preserved sound when matching audio/video elements use the same timing,\nsource offset, and rate. Source speed ramps are not supported because there is\nno rate envelope; preprocess a derived synchronized asset. HyperFrames does not\nprovide automatic waveform sync or drift correction.\nFor copyable cut/crossfade/retime recipes, use `/hyperframes-core` → `references/creator-editing-recipes.md`.\n\nThree attributes carry everything, on the audio/video element itself — or, for\nthe first two, on an `<hf-audio-group>` bus (see \"One bus for many tracks\"):\n\n| Attribute         | Holds                                                     |\n| ----------------- | --------------------------------------------------------- |\n| `data-fx-chain`   | the effects, in signal order                              |\n| `data-automation` | envelopes on this track's volume or its effect parameters |\n| `data-fx-carve`   | the carve's own settings, so it can be re-derived         |\n\nThe shipped effect families are gain, EQ (highpass, lowpass, peaking, shelves),\ncompressor, limiter, gate, saturate, delay, reverb, chorus, phaser, and bitcrush.\n\nExact JSON for each, and the rules a lane must satisfy: `references/attributes.md`.\nEvery effect with its parameters, ranges and units: `references/fx-registry.md`.\nHow to work out what is wrong with a file you cannot hear:\n`references/diagnosis.md`.\n**Presets, named jobs and one-knob profiles, plus a symptom-to-fix table:\n`references/p","previewTruncated":true,"bodyLength":23852,"steps":2,"codeBlocks":6,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"hyperframes-cli","dir":"hyperframes-cli","category":"视频与音频","purpose":"Use the HyperFrames CLI development loop: init, add, catalog, capture, lint, check, snapshot, compare, grade-compare, preview, play, present, beats, keyframes, single or batch render, publish, cloud, cloudrun, feedback, lambda, doctor, browser, info, upgrade, skills, compositions, docs, benchmark, telemetry, transcribe, auth, tts, and remove-background. Also validate, inspect, and layout are deprecated aliases; use check. Covers local, HeyGen-hosted cloud, AWS Lambda, and Google Cloud Run rendering.","triggers":["diagnosing build or render failures"],"boundary":"","description":"Use the HyperFrames CLI development loop: init, add, catalog, capture, lint, check, snapshot, compare, grade-compare, preview, play, present, beats, keyframes, single or batch render, publish, cloud, cloudrun, feedback, lambda, doctor, browser, info, upgrade, skills, compositions, docs, benchmark, telemetry, transcribe, auth, tts, and remove-background. Also use when diagnosing build or render failures. validate, inspect, and layout are deprecated aliases; use check. Covers local, HeyGen-hosted cloud, AWS Lambda, and Google Cloud Run rendering.","lead":"Run commands as `npx hyperframes ...` unless project instructions provide a wrapper. Obey the wrapper when present. The CLI requires Node.js 22 or newer and FFmpeg.","headings":[{"level":1,"text":"HyperFrames CLI"},{"level":2,"text":"Development loop"},{"level":2,"text":"Mandatory creator-edit cross-references"},{"level":1,"text":"Fast iteration check; repeat while authoring as needed."},{"level":1,"text":"Required final gate; includes lint."},{"level":2,"text":"Two different preview surfaces"},{"level":2,"text":"Sub-composition smoke test"},{"level":2,"text":"Agent conventions"},{"level":2,"text":"Studio-directed edits"},{"level":2,"text":"Render choices"},{"level":2,"text":"Read the matching reference before running a command"},{"level":2,"text":"Commands you should not run"}],"preview":"Run commands as `npx hyperframes ...` unless project instructions provide a wrapper. Obey the wrapper when present. The CLI requires Node.js 22 or newer and FFmpeg.\n\n1. **Scaffold:** `npx hyperframes init <project>` or capture a site. In non-TTY mode, pass `--non-interactive --example=<name>`.\n2. **Find the move:** before authoring motion by hand, search for a primitive that already does it: `npx hyperframes catalog --query \"reveal a headline one line at a time\"`. Ask for the effect you want rather than the mechanism you have in mind. Install with `npx hyperframes add <name>` (see `/hyperframes-registry`). Author by hand only once nothing fits.\n3. **Author:** write the composition using `/hyperframes-core`.\n4. **Get fast feedback while editing:** run `npx hyperframes lint` after the first HTML pass and after structural changes.\n5. **Run the final gate:** run `npx hyperframes check`; it reruns lint before opening the browser. Do not prepend a redundant standalone lint invocation. Add `--snapshots` for annotated overview frames and finding crops.\n6. **Inspect sub-compositions:** when `index.html` mounts `data-composition-src`, capture midpoint snapshots and inspect each mounted scene.\n7. **Open the final Studio preview:** run `npx hyperframes preview --background`, verify the URL returns HTTP 200, hand the timeline project URL to the user, and ask whether to revise or render. Keep it alive until review ends.\n8. **Render only after approval:** use draft quality for iteration and high quality for delivery.\n9. **Verify the output:** confirm the file exists, is non-empty, and has a plausible duration.\n\n- Before authoring or diagnosing a zoom, punch-in/punch-out, reframe, camera\n  move, or any keyframe motion, read `/hyperframes-keyframes` first.\n- Before `hyperframes keyframes`, read `/hyperframes-keyframes`; the command\n  surfaces animation trajectories and does not diagnose clip cuts.\n- For a cut, trim, splice, reorder, or source timing edit, read\n  `/hyperframes-core` and use its clip/timeline contract.\n- For fade-in/fade-out, crossfade, track gain, volume automation, ducking,\n  voiceover carve, or FX on placed audio, read `/hyperframes-audio`. Load core\n  alongside it when clip placement or picture timing also changes.\n- Use `/media-use` only to source/generate media or preprocess a derived asset.\n  Copy creator edit markup from `/hyperframes-core` → `references/creator-editing-recipes.md`.\n\n```bash\nnpx hyperframes lint\n\nnpx hyperframes check\nnpx hyperframes preview --background\nnpx hyperframes render --quality high --output out.mp4\ntest -s out.mp4\nffprobe","previewTruncated":true,"bodyLength":17657,"steps":30,"codeBlocks":6,"hasScripts":false,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"hyperframes-core","dir":"hyperframes-core","category":"视频与音频","purpose":"The HyperFrames composition contract — build one renderable project. Also covers Tailwind projects and the STORYBOARD.md / SCRIPT.md plan formats. Read before writing composition HTML.","triggers":["composition structure, the `data-*` timing attributes, `class=\"clip\"`, tracks, sub-composi…"],"boundary":"","description":"The HyperFrames composition contract — build one renderable project. Use for composition structure, the `data-*` timing attributes, `class=\"clip\"`, tracks, sub-compositions, variables, framework-owned media playback, deterministic-render rules, and validation. Also covers Tailwind projects and the STORYBOARD.md / SCRIPT.md plan formats. Read before writing composition HTML.","lead":"HyperFrames renders video from HTML. A composition is an HTML file whose DOM declares timing with `data-*` attributes, whose animation runtime is seekable, and whose media playback is owned by the framework.","headings":[{"level":1,"text":"HyperFrames Core"},{"level":2,"text":"References"},{"level":2,"text":"Building a composition"},{"level":3,"text":"Two root forms (not interchangeable)"},{"level":3,"text":"Root must be sized (silent layout bug)"},{"level":3,"text":"One paused timeline"},{"level":3,"text":"First-pass lint gotchas (a guaranteed first build failure)"},{"level":3,"text":"Non-negotiable rules (silent bugs automated gates may miss)"},{"level":2,"text":"Editing existing compositions"},{"level":2,"text":"Validation"}],"preview":"HyperFrames renders video from HTML. A composition is an HTML file whose DOM declares timing with `data-*` attributes, whose animation runtime is seekable, and whose media playback is owned by the framework.\n\nThis skill is the **technical contract** — how to build one hyperframes project. The body below is the build guide; per-topic detail lives in `references/` (index next), read on demand. Other concerns live in the sibling domain skills — `hyperframes-animation`, `hyperframes-creative`, `media-use`, `hyperframes-cli`, `hyperframes-registry`. The capability map in `/hyperframes` says what each one covers.\n\n| File                                    | Read it to…                                                                                                                                                                        |\n| --------------------------------------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `references/minimal-composition.md`     | start from the smallest renderable composition skeleton                                                                                                                            |\n| `references/composition-patterns.md`    | choose monolithic vs modular; structure a modular `index.html`; pick a sub-comp archetype                                                                                          |\n| `references/data-attributes.md`         | look up any `data-*` (root / clip / sub-comp host / legacy aliases); use `class=\"clip\"`                                                                                            |\n| `references/tracks-and-clips.md`        | understand what `data-track-index` does (and does not) control, z-index, time a clip relative to another                                                                           |\n| `references/creator-editing-recipes.md` | copy truthful cut/trim/reorder/retime/freeze/camera/mask/crossfade/audio editing recipes and their limits                                                                          |\n| `references/sub-compositions.md`        | wire a sub-composition (host attrs, `<template>`, per-instance vars) and animate inside it                                                                                         |\n| `references/variables-and-media.md`     | declare variables; place `<video>`/`<audio>`, set volume, trim                                                                              ","previewTruncated":true,"bodyLength":12589,"steps":21,"codeBlocks":0,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"hyperframes-creative","dir":"hyperframes-creative","category":"视频与音频","purpose":"Non-animation creative direction for HyperFrames videos. md / design.md) handling, palettes, typography, narration, beat planning, audio-reactive visuals, composition patterns, and brand / style decisions. For atomic motion patterns and scene blueprints, use `hyperframes-animation`.","triggers":["design spec (frame"],"boundary":"","description":"Non-animation creative direction for HyperFrames videos. Use for design spec (frame.md / design.md) handling, palettes, typography, narration, beat planning, audio-reactive visuals, composition patterns, and brand / style decisions. For atomic motion patterns and scene blueprints, use `hyperframes-animation`.","lead":"Brand, pacing, style, narration, and composition direction. Use after the technical contract from `hyperframes-core` is in place.","headings":[{"level":1,"text":"HyperFrames Creative"},{"level":2,"text":"Workflow"},{"level":2,"text":"Routing"},{"level":2,"text":"Scripts"},{"level":2,"text":"Boundaries"}],"preview":"Brand, pacing, style, narration, and composition direction. Use after the technical contract from `hyperframes-core` is in place.\n\nFor motion patterns, scene blueprints, transitions, and CSS marker effects, use `hyperframes-animation` — this skill is intentionally non-animation.\n\n> **Read these two FIRST for any non-trivial composition — they override web instincts:**\n>\n> - `references/house-style.md` — \"interpret the prompt, generate real content,\" the lazy-default list, and the background/foreground layer recipe. This is what turns a literal restyle into a _concept_.\n> - `references/video-composition.md` — video-medium scale, depth, and foreground detail. It explains how to avoid empty web-page layouts without imposing a universal element count.\n>\n> Skipping these is the single biggest cause of generic, web-page-looking output. They are not optional rows in the routing table below — for anything beyond a one-line edit, open both before you choose colors or write HTML.\n\n1. If a project has a design spec, **read it first** and treat its frontmatter tokens as brand truth (colors, fonts, spacing, tone, constraints). Which file to read (precedence `frame.md` → `design.md` → `DESIGN.md`) and how to parse it (frontmatter = normative, prose = context) are defined once in [`references/design-spec.md`](references/design-spec.md) — resolve and load per that doc.\n2. If no design spec exists and the user asks for visual direction, choose a route:\n   - Ready-made frame-preset (optional) → `frame-presets/` (adopt a `FRAME.md` as `frame.md`; see `references/design-spec.md`)\n   - Named style or mood → `references/visual-styles.md`\n   - Fast defaults → `references/house-style.md`\n   - Interactive selection → `references/design-picker.md`\n3. For multi-scene work, plan beats and rhythm before writing HTML → `references/beat-direction.md`. For scene transitions, jump to `hyperframes-animation/transitions/`.\n4. For motion-heavy work, read `references/motion-principles.md` (high-level guardrails), then go to `hyperframes-animation` for atomic rules.\n\n| Topic                                                                                                   | Read                                           |\n| ------------------------------------------------------------------------------------------------------- | ---------------------------------------------- |\n| Adopt a ready-made frame-preset as `frame.md` (optional)                                                | `frame-presets/` · `references/design-spec.md` |\n| Default palettes, motion, typography, lazy defaults to questi","previewTruncated":true,"bodyLength":5956,"steps":15,"codeBlocks":1,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"hyperframes-keyframes","dir":"hyperframes-keyframes","category":"视频与音频","purpose":"js, WAAPI, FLIP, paths, masks, SVG morph/draw, text trails, 3D depth, or `hyperframes keyframes` diagnostics. Don't","triggers":["a HyperFrames composition needs a punch-in, punch-out, zoom, reframe, Ken Burns treatment,…"],"boundary":"","description":"Use when a HyperFrames composition needs a punch-in, punch-out, zoom, reframe, Ken Burns treatment, camera move, visual match/whip handoff, or other seek-safe 2D/3D keyframes; also for GSAP, CSS keyframes, Anime.js, WAAPI, FLIP, paths, masks, SVG morph/draw, text trails, 3D depth, or `hyperframes keyframes` diagnostics. Don't use for broad scene strategy, brand design, media sourcing, captions, or general video planning.","lead":"Keyframes are a pose contract: visible states, continuous subject identity, seek-safe runtime, verified pixels.","headings":[{"level":1,"text":"HyperFrames Keyframes"},{"level":2,"text":"Creator editing boundary"},{"level":2,"text":"Procedure"},{"level":2,"text":"Contract"},{"level":2,"text":"Runtime Rules"},{"level":2,"text":"GSAP Skeleton"},{"level":2,"text":"Keyframe Forms"},{"level":2,"text":"Channels"},{"level":2,"text":"Mechanism Choice"},{"level":2,"text":"Timing"},{"level":2,"text":"Text"},{"level":2,"text":"SVG"},{"level":2,"text":"3D"},{"level":2,"text":"Canvas / WebGL"},{"level":2,"text":"CLI Proof"},{"level":2,"text":"Diagnostic Reading"},{"level":2,"text":"Error Handling"},{"level":2,"text":"Done"}],"preview":"Keyframes are a pose contract: visible states, continuous subject identity, seek-safe runtime, verified pixels.\n\nUse `hyperframes-animation` for broad scene recipes. Use `hyperframes-cli` for full command docs. Use `references/keyframe-patterns.md` only when choosing implementation mechanisms, not visual style.\n\nKeyframes own visual motion, not clip assembly. Source-range hard cuts, trim,\nsplice, and reorder belong to `/hyperframes-core`: author one media element per\nkept range, place it with `data-start` and `data-duration`, and select its source\noffset with `data-media-start`. Adjacent ranges make a hard cut. A crossfade\nuses overlapping clips on different tracks plus visual opacity keyframes; sound\nfades use `/hyperframes-audio`.\n\n| Creator request                         | Truthful mechanism                                                                                                                                                                                                          |\n| --------------------------------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Punch-in / punch-out                    | Keyframe `scale` with `x`/`y` or percentage translation on a non-timed visual/crop wrapper inside the clip. Use a set/short tween for a hard punch and a tween for a smooth move.                                           |\n| Smooth multi-state zoom or reframe      | Keep one subject wrapper alive and author multiple zoom/reframe states as a pose ladder with per-segment easing.                                                                                                            |\n| Pan, reframe, or Ken Burns camera move  | Animate wrapper translation plus scale. Geometry is authored; this is not face tracking or automatic semantic reframing.                                                                                                    |\n| Chained camera moves                    | Chain labeled transform beats on one registered seek-safe timeline.                                                                                                                                                         |\n| Match cut or whip pan                   | `/hyperframes-animation` owns the visual handoff; `/hyperframes-registry` supplies primitives; keyframes preserve authored geometry, direction, and velocity. There is no automatic matching-frame discovery.           ","previewTruncated":true,"bodyLength":15409,"steps":63,"codeBlocks":2,"hasScripts":false,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"hyperframes-registry","dir":"hyperframes-registry","category":"视频与音频","purpose":"Install, discover, and wire registry blocks and components into HyperFrames compositions. html, or working with hyperframes.json. Covers discovery, install locations, block sub-composition wiring, component snippet merging, and authoring a new block or component to contribute upstream (idea → scaffold → validate → PR).","triggers":["running hyperframes add or hyperframes catalog, installing one item or every block matchin…"],"boundary":"","description":"Install, discover, and wire registry blocks and components into HyperFrames compositions. Use when running hyperframes add or hyperframes catalog, installing one item or every block matching a tag, wiring an installed item into index.html, or working with hyperframes.json. Covers discovery, install locations, block sub-composition wiring, component snippet merging, and authoring a new block or component to contribute upstream (idea → scaffold → validate → PR).","lead":"The registry provides reusable blocks and components installable via `hyperframes add <name>`.","headings":[{"level":1,"text":"HyperFrames Registry"},{"level":2,"text":"Quick reference"},{"level":2,"text":"Install locations"},{"level":2,"text":"Wiring blocks"},{"level":2,"text":"Wiring components"},{"level":2,"text":"Discovery"},{"level":1,"text":"Rank the whole catalog against what the beat should do"},{"level":3,"text":"Report what the catalog does not have"},{"level":2,"text":"Contributing a new block or component"}],"preview":"The registry provides reusable blocks and components installable via `hyperframes add <name>`.\n\n- **Blocks** — standalone sub-compositions (own dimensions, duration, timeline). Included via `data-composition-src` in a host composition.\n- **Components** — effect snippets (no own dimensions). Pasted directly into a host composition's HTML.\n\n```bash\nhyperframes add data-chart              # install a block\nhyperframes add grain-overlay           # install a component\nhyperframes add captions                # install every block tagged captions\nhyperframes add shimmer-sweep --dir .   # target a specific project\nhyperframes add data-chart --json       # machine-readable output\nhyperframes add data-chart --no-clipboard  # skip clipboard (CI/headless)\n```\n\nAfter install, the CLI prints which files were written and a snippet to paste into your host composition. The snippet is a starting point — you'll need to add `data-composition-id` (must match the block's internal composition ID), `data-start`, and `data-track-index` attributes when wiring blocks.\n\nThe positional value is resolved as an exact item name first. If no item matches and the value is a tag, the command installs every block with that tag. Registry dependencies are installed before the requested item. `hyperframes add` works only for blocks and components; for examples, use `hyperframes init <dir> --example <name>` instead.\n\nBlocks install to `compositions/<name>.html` by default. Components install to `compositions/components/<name>.html` by default.\n\nThese paths are configurable in `hyperframes.json`:\n\n```json\n{\n  \"registry\": \"https://raw.githubusercontent.com/heygen-com/hyperframes/main/registry\",\n  \"paths\": {\n    \"blocks\": \"compositions\",\n    \"components\": \"compositions/components\",\n    \"assets\": \"assets\"\n  }\n}\n```\n\nSee [install-locations.md](./references/install-locations.md) for full details.\n\nBlocks are standalone compositions — include them via `data-composition-src` in your host `index.html`:\n\n```html\n<div\n  data-composition-id=\"data-chart\"\n  data-composition-src=\"compositions/data-chart.html\"\n  data-start=\"2\"\n  data-duration=\"15\"\n  data-track-index=\"1\"\n  data-width=\"1920\"\n  data-height=\"1080\"\n></div>\n```\n\nKey attributes:\n\n- `data-composition-src` — path to the block HTML file\n- `data-composition-id` — must match the block's internal ID\n- `data-start` — when the block appears in the host timeline (seconds)\n- `data-duration` — how long the block plays\n- `data-width` / `data-height` — block canvas dimensions\n- `data-track-index` — layer ordering (higher = in front)\n\nSee [wiring-blocks.md](./re","previewTruncated":true,"bodyLength":8652,"steps":13,"codeBlocks":7,"hasScripts":false,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"media-use","dir":"media-use","category":"视频与音频","purpose":"Agent Media OS, the single skill for every media need in a HyperFrames project. Resolve BGM, SFX, image, icon, brand logo, voice, color grade, or LUT into a frozen local file or paste-ready block + ledger record (one verb, `resolve`); generate via TTS / music / image models when the catalog misses; produce voiceover, transcription, captions, and background removal through one shared audio engine; operate on media (cut / reframe / transform); and reuse assets across projects. Also","triggers":["vague feedback that real footage looks dark, flat, boring, should feel retro/camcorder/pri…"],"boundary":"","description":"Agent Media OS, the single skill for every media need in a HyperFrames project. Resolve BGM, SFX, image, icon, brand logo, voice, color grade, or LUT into a frozen local file or paste-ready block + ledger record (one verb, `resolve`); generate via TTS / music / image models when the catalog misses; produce voiceover, transcription, captions, and background removal through one shared audio engine; operate on media (cut / refr
