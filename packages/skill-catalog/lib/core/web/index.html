odex SKILL.md files through a structured interview when user wants to package a workflow or capability as a reusable skill for AI agents.md through a structured interview to package a workflow\".","triggers":["Create a new SKILL"],"boundary":"不适用于把已有材料蒸馏成技能（改走 skill-distillation），也不适用于寻找现成技能（改走 skill-finder）","description":"Creates new Codex SKILL.md files through a structured interview when user wants to package a workflow or capability as a reusable skill for AI agents.Use when: \"Create a new SKILL.md through a structured interview to package a workflow\".｜不适用于把已有材料蒸馏成技能（改走 skill-distillation），也不适用于寻找现成技能（改走 skill-finder）","lead":"通过结构化访谈收集需求，验证该能力不是 Codex 内置功能，设计触发描述和工作流，从失败模式中提炼 Gotchas，生成符合规范的 SKILL.md 文件，并通过质量自检确保文件可用。","headings":[{"level":1,"text":"技能创建器（Skill Creator）"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1：需求访谈"},{"level":3,"text":"Step 2：验证非内置能力"},{"level":3,"text":"Step 3：设计技能元素"},{"level":3,"text":"Step 4：生成 SKILL.md"},{"level":1,"text":"{中文标题}（{English Title}）"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1：{步骤名}"},{"level":3,"text":"Step 2：{步骤名}"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"},{"level":3,"text":"Step 5：质量自检"},{"level":3,"text":"Step 6：确认路径并写入"},{"level":2,"text":"输出格式"},{"level":2,"text":"技能创建完成"},{"level":2,"text":"Gotchas"}],"preview":"通过结构化访谈收集需求，验证该能力不是 Codex 内置功能，设计触发描述和工作流，从失败模式中提炼 Gotchas，生成符合规范的 SKILL.md 文件，并通过质量自检确保文件可用。\n\n---\n\n- 用户说\"帮我创建一个新技能\"或\"帮我写一个 SKILL.md\"\n- 用户描述了重复性工作流程，希望封装为可复用单元\n- 用户想优化现有 SKILL.md 的触发描述或工作流\n- 用户说\"我想让 Codex 记住怎么做 X\"\n\n---\n\n**按顺序提问，每问等待回答后再继续。不要一次性列出所有问题。**\n\n```\n必问（按顺序）：\n\nQ1：这个技能要解决什么问题？\n    期望：用一两句话描述核心痛点\n\nQ2：什么情况下会触发这个技能？\n    追问：请给我 2-3 个具体的触发例子。\n\nQ3：这个技能的输出是什么？\n    追问：能给我看一个理想输出的例子吗？\n\nQ4：这个技能需要哪些外部工具或服务？\n    期望：浏览器、API、本地命令、数据库等\n\nQ5：这个技能最容易在哪里出错？你之前手动做这件事时遇到过什么坑？\n```\n\n根据回答补充追问（非必问）：\n```\nQ6：需要用户提供哪些输入参数？\nQ7：有没有明确不应该触发的场景？\nQ8：执行过程中是否需要用户中途确认？\n```\n\n在设计技能前，判断用户描述的能力是否已是 Codex 内置能力：\n\n**这些不需要创建技能（内置功能）：**\n- 写代码、解释代码、debug\n- 翻译、摘要、改写、润色文本\n- 数学计算和推导\n- 格式转换（JSON/Markdown/CSV/YAML）\n- 回答知识性问题\n\n**需要技能的场景：**\n- 访问特定外部服务（需要认证的 API、特定网站）\n- 执行特定工具链（多步命令行操作组合）\n- 强制遵循特定输出模板（标准化报告格式）\n- 处理平台特有内容格式（XHS 截断、Notion 块结构）\n- 组合多个工具的复杂工作流\n\n如判断为内置能力，告知用户：\n```\n这个能力是 Codex 的内置功能，不需要专门的技能。\n直接说\"{具体指令示例}\"即可使用。\n\n如果你有特殊要求（固定输出格式、特定处理流程），告诉我，\n我们可以创建针对你需求的专属版本。\n```\n\n**名称设计规则：**\n- 格式：`lowercase-hyphen`，2-4 个单词，无空格无大写\n- 反映动作而非主题：`analyze-sentiment` 而非 `sentiment`\n- 示例：`github-pr-reviewer`, `meeting-notes-formatter`, `sql-query-builder`\n\n**触发描述（description）设计规则：**\n- 50-150 个字符（中英文混合时按字符计，不按字数）\n- 第一个词是动词：Analyzes / Creates / Extracts / Converts / Generates\n- 包含触发条件：\"when user wants to...\" 或 \"当用户需要...\"\n- 测试方法：仅凭描述，能否判断何时该触发、何时不该触发？\n\n**工作流设计规则：**\n- 步骤数 3-8 个（更少意味着不够具体；更多则应拆分为子技能）\n- 每步说明：做什么、怎么做（具体工具/方法）、遇到什么情况怎么处理\n- 必须包含错误路径，不只有 happy path\n- 每步输入输出明确，不出现\"处理数据\"这种模糊描述\n\n**Gotchas 来源（从多角度挖掘）：**\n- 用户访谈 Q5 中提到的失败经历\n- 外部服务的已知限制（限流、认证、格式）\n- 边界条件（空输入、超大输入、特殊字符）\n- 与其他技能的依赖/冲突\n\n使用以下模板：\n\n```markdown\n---\nname: {name}\ndescription: {description，50-150字符}\n---\n\n{2-4 句话：核心价值、适用范围、不适用范围}\n\n---\n\n- {触发条件 1}\n- {触发条件 2}\n- {触发条件 3}\n\n---\n\n{详细说明，含具体操作方法和错误处理}\n\n{详细说明}\n\n（3-8 步）\n\n---\n\n{具体格式，含示例，不只是描述}\n\n---\n\n{至少 4 条，每条具体可操作，不是泛泛的警告}\n```\n\n生成后逐项检查，全部通过才能输出文件：\n\n```\n质量检查清单（13 项）：\n\n格式检查：\n[ ] name：lowercase-hyphen，无空格无大写无中文\n[ ] description：50-150 字符范围内\n[ ] description：以动词开头\n[ ] description：包含触发条件（何时/为何触发）\n\n结构检查：\n[ ] 五个必要章节全部存在：核心定位/触发场景/工作流/输出格式/Gotchas\n[ ] 工作流步骤数 3-8 个\n[ ] 总行数 ≤ 500 行\n\n内容质量检查：\n[ ] 每个工作流步骤有具体操作说明（非模糊描述）\n[ ] 工作流包含至少一个错误处理路径\n[ ] 输出格式含具体示例（非仅描述）\n[ ] Gotchas 至少 4 条，每条具体可操作\n\n完整性检查：\n[ ] 无未填充的占位符（{待填写} 等）\n[ ] 无 README 风格的介绍段落（\"这个技能是为了...\"）\n```\n\n未通过任何一项，修正后重新检查，直到全部通过。\n\n展示完整 SKILL.md 内容，说明写入路径，等待用户确认后写入。\n\n默认路径推断逻辑：\n- 浏览器相关 → `04-浏览器自动化/{技能名}/`\n- 开发工具类 → `03-开发工具/{技能名}/`\n- 其他类别 → 询问用户应放入哪个分类目录\n\n---\n\n```\n\n名称：{name}\n写入路径：{绝对路径}/SKILL.md\n描述：{description}（{字符数} 字符）\n\n质量检查：通过 {n}/13 项\n{如有未通过项，列出并说明已修复或需要用户补充}\n\n---\n\n{SKILL.md 完整内容预览}\n\n---\n\n文件已写入。\n```\n\n---\n\n**用户描述太抽象时不要开始设计**\n- \"帮我自动化工作流\" → 追问：具体是哪个步骤最烦？\n- \"处理数据\" → 追问：什么格式的数据？处理完变成什么？\n","previewTruncated":true,"bodyLength":3391,"steps":49,"codeBlocks":6,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"skill-discovery","dir":"skill-discovery","category":"技能治理","purpose":"当用户要找、搜索、发现可用的 skill/插件、想装新 skill、或问\"有没有做 X 的 skill\"时使用。","triggers":["找skill","有什么skill能做X","搜skill","有没有这个skill","技能市场","还能装什么"],"boundary":"不适用于审核已装 skill 的质量与验证状态（走 skill-registry 审计流程），也不适用于把材料做成 skill（改走 skill-distillation）","description":"当用户要找、搜索、发现可用的 skill/插件、想装新 skill、或问\"有没有做 X 的 skill\"时使用。触发词如\"找skill/有什么skill能做X/搜skill/有没有这个skill/技能市场/还能装什么\"。｜不适用于审核已装 skill 的质量与验证状态（走 skill-registry 审计流程），也不适用于把材料做成 skill（改走 skill-distillation）","lead":"帮用户找到现有可用的 skill，从本地目录和网上社区搜，并验证能不能安全装。","headings":[{"level":1,"text":"发现 Skill（找 skill）"},{"level":2,"text":"来源（按顺序查）"},{"level":2,"text":"流程"},{"level":2,"text":"注意事项"}],"preview":"帮用户找到现有可用的 skill，从本地目录和网上社区搜，并验证能不能安全装。\n\n1. **本地已装**：`~/.agents/skills/` 目录（glob 列出，看是否已有）。\n2. **网上社区**：\n   - awesome-dsh-plugin（DSH 插件精选列表）\n   - ClawHub / SkillsMP（skill 市场）\n   - npm 包（`dsh-*`、`*-skill`）\n   - GitHub topic（`dsh-plugin`、`dsh-skill`）\n\n1. **明确需求**：用户想做什么（功能/场景）。\n2. **先查本地**：glob `~/.agents/skills/`，看是否已有对应 skill，避免重复。\n3. **再搜网上**：web_search 找社区 skill/插件，记录来源。\n4. **验证兼容性**：查包的 peer 依赖——\n   - `>=0.1.1-rc.2` 或 `*` 或 `none` → ✅ 安全\n   - `^0.1.0-rc.x` 等旧核心 → ⚠️ 别装（会引入版本错位）\n   - `dsh.bundle` 未声明 → 不是真插件\n5. **推荐**：给用户清单（名称 + 用途 + 是否安全 + 来源），只装安全的。\n\n- **兼容性优先**：旧核心 peer 依赖的一律不装（之前 harness down 的教训）。\n- 优先本地已有，避免重复装。\n- 社区插件质量参差，只推荐来源可信、无旧核心的。\n- 纯 skill（SKILL.md）比插件更安全，能 skill 化就不装插件。","previewTruncated":false,"bodyLength":745,"steps":18,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"skill-distillation","dir":"skill-distillation","category":"技能治理","purpose":"当用户要把某份知识、材料、流程、经验蒸馏成可复用的 skill（SKILL.md）时使用。","triggers":["把这个做成skill","沉淀成技能","总结成可复用流程","固化下来","以后能自动调用"],"boundary":"不适用于提炼书籍/文章要点（改走 book-distillation），也不适用于寻找现成 skill（改走 skill-discovery）","description":"当用户要把某份知识、材料、流程、经验蒸馏成可复用的 skill（SKILL.md）时使用。触发词如\"把这个做成skill/沉淀成技能/总结成可复用流程/固化下来/以后能自动调用\"。｜不适用于提炼书籍/文章要点（改走 book-distillation），也不适用于寻找现成 skill（改走 skill-discovery）","lead":"把任意知识/流程/经验，蒸馏成标准 SKILL.md，让以后自动调用。这是\"自我进化\"的核心能力。","headings":[{"level":1,"text":"蒸馏 Skill（元能力）"},{"level":2,"text":"SKILL.md 标准格式"},{"level":1,"text":"标题"},{"level":2,"text":"触发场景（什么时候用、什么不用）"},{"level":2,"text":"工作流程（步骤 1..N，可执行）"},{"level":2,"text":"关键规则/框架（参考最佳实践，不发明）"},{"level":2,"text":"输出格式"},{"level":2,"text":"注意事项（边界/禁忌）"},{"level":2,"text":"蒸馏流程"},{"level":2,"text":"原则"},{"level":2,"text":"判断：值不值得蒸馏成 skill？"},{"level":2,"text":"注意事项"}],"preview":"把任意知识/流程/经验，蒸馏成标准 SKILL.md，让以后自动调用。这是\"自我进化\"的核心能力。\n\n```markdown\n---\nname: 技能名（小写 kebab-case）\ndescription: 何时使用（场景 + 触发词），一句话说清。\n---\n\n```\n\n1. **明确**：这个 skill 解决什么问题、何时触发、给谁用。\n2. **提炼**：从材料中抽出**可复用的步骤和规则**（不是照抄原文）。\n3. **结构化**：套上面的 SKILL.md 模板。\n4. **校验**：触发词准不准、步骤能不能照着执行、有无边界。\n5. **安装**：写入 `~/.agents/skills/<name>/SKILL.md`。\n\n- 一个 skill **只做一件事**（单一职责），别塞大杂烩。\n- 步骤用**动词开头**、可执行，不写\"要重视/要注意\"这种空话。\n- **参考最佳实践**，不发明新方法。\n- 写清**边界**：什么情况不适用、不能做什么。\n\n- 高频、可复用 → 值得沉淀成 skill。\n- 一次性、临时 → 直接做，不沉淀。\n- 复杂流程 → 拆成多个单一职责的 skill。\n\n- 装好后，让用户\"重新加载\"或重启，系统才会识别新 skill。\n- 描述(description)写准触发词，否则自动触发不到。","previewTruncated":false,"bodyLength":753,"steps":14,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"skill-finder","dir":"技能发现与选型（skill-finder）","category":"技能治理","purpose":"根据任务目标筛选、比较和安装合适的 Agent Skill，适合面对大量技能仓库、插件市场和本地技能库时做选择。","triggers":["找skill","该用哪个skill","比较技能","装个技能"],"boundary":"不适用于把材料做成技能（改走 skill-distillation），也不适用于安全审查（改走 skill-vetter）","description":"根据任务目标筛选、比较和安装合适的 Agent Skill，适合面对大量技能仓库、插件市场和本地技能库时做选择。触发词如\"找skill/该用哪个skill/比较技能/装个技能\"。｜不适用于把材料做成技能（改走 skill-distillation），也不适用于安全审查（改走 skill-vetter）","lead":"把“我该用哪个 skill”变成一套任务-能力-风险匹配流程。","headings":[{"level":1,"text":"Skill Finder"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把“我该用哪个 skill”变成一套任务-能力-风险匹配流程。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n候选技能榜单、适配理由、风险提示、安装建议：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":755,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"skill-vetter","dir":"技能安全审查（skill-vetter）","category":"技能治理","purpose":"Audits a SKILL.md and its scripts for security risks before installation.","triggers":["user wants to install or trust a skill from an external or unknown source"],"boundary":"不适用于技能检索与安装（改走 skill-finder），也不适用于本机自建技能的常规审计（走 skill-registry 流程）","description":"Audits a SKILL.md and its scripts for security risks before installation. Triggers when user wants to install or trust a skill from an external or unknown source.｜不适用于技能检索与安装（改走 skill-finder），也不适用于本机自建技能的常规审计（走 skill-registry 流程）","lead":"在安装任何来自外部来源的技能前，对 SKILL.md 和 scripts/ 目录执行系统性安全审查。输出结构化风险报告和明确的安装决策（安装 / 谨慎安装 / 拒绝）。","headings":[{"level":1,"text":"技能安全审查（Skill Vetter）"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1：定位并读取技能文件"},{"level":3,"text":"Step 2：SKILL.md 内容扫描"},{"level":1,"text":"读取凭证（可接受，看去向）"},{"level":1,"text":"访问 macOS Keychain（高风险）"},{"level":1,"text":"读取浏览器数据（极高风险）"},{"level":1,"text":"Python 执行"},{"level":1,"text":"JavaScript 执行"},{"level":1,"text":"Shell 注入风险（变量直接拼入命令）"},{"level":1,"text":"Base64 解码后执行"},{"level":1,"text":"十六进制 shellcode 特征"},{"level":1,"text":"URL 编码执行"},{"level":1,"text":"将本地数据发送到外部"},{"level":3,"text":"Step 3：脚本文件深度扫描"},{"level":3,"text":"Step 4：综合风险评级"},{"level":2,"text":"输出格式"},{"level":2,"text":"技能安全审查报告"},{"level":3,"text":"总体评级：{Low / Medium / High / Critical}"},{"level":3,"text":"安装建议：{安装 / 谨慎安装 / 拒绝安装}"},{"level":3,"text":"发现的风险项"},{"level":3,"text":"通过检查项"},{"level":3,"text":"结论"},{"level":2,"text":"Gotchas"}],"preview":"在安装任何来自外部来源的技能前，对 SKILL.md 和 scripts/ 目录执行系统性安全审查。输出结构化风险报告和明确的安装决策（安装 / 谨慎安装 / 拒绝）。\n\n不审查用户自己创建的技能，除非明确请求。\n\n---\n\n- 用户说\"帮我审查这个技能是否安全\"\n- 用户想安装来自 GitHub、聊天分享、第三方网站的技能\n- 用户粘贴了一个 SKILL.md，请求安全检查\n- 用户提供了技能文件目录路径\n\n---\n\n接受输入方式：\n- 文件路径 → 直接读取\n- 粘贴的文本内容 → 作为临时内容分析\n- GitHub URL → 通过 browser-automation 获取原始内容\n\n读取 SKILL.md 后，检查同级目录是否存在以下文件并全部读取：\n```\nscripts/       高风险，执行脚本目录\nhooks/         高风险，Hook 脚本\n*.sh           高风险，Shell 脚本\n*.py           中风险，Python 脚本\n*.js / *.ts    中风险，JavaScript 脚本\nconfig/        中风险，配置文件\n```\n\n**检查 A：外部 URL 声明完整性**\n\n扫描所有 URL 模式：\n```regex\nhttps?://[^\\s'\")\\]]+\ncurl\\s+[^\\s]+\nwget\\s+[^\\s]+\nfetch\\(['\"](https?://)[^'\"]+\nrequests\\.(get|post|put|delete)\\(['\"](https?://)\naxios\\.(get|post)\\(['\"](https?://)\n```\n\n判断标准：\n- URL 在工作流中明确说明用途且目标是知名服务 → Low\n- URL 存在于脚本但 SKILL.md 未提及 → High\n- URL 使用 IP 地址而非域名 → High\n- URL 指向非知名域名 → Medium，需用户确认\n\n**检查 B：敏感文件路径访问**\n```regex\n~/\\.ssh/\n~/\\.aws/credentials\n~/\\.config/\n~\\/\\.netrc\n\\/etc\\/passwd\n\\/etc\\/shadow\n\\.env$\n\\.env\\.local$\ncredentials\\.json\nsecrets\\.json\nLibrary/Keychains\nLibrary/Application Support/Google/Chrome\n```\n\n**检查 C：凭证访问与传输**\n```regex\nos\\.environ\\[['\"](?:PASSWORD|SECRET|TOKEN|KEY|API_KEY)['\"]\\]\nprocess\\.env\\.(?:PASSWORD|SECRET|TOKEN|KEY|API_KEY)\n\\$(?:PASSWORD|SECRET|TOKEN|API_KEY|PRIVATE_KEY)\\b\n\nsecurity\\s+find-internet-password\nsecurity\\s+find-generic-password\n\nLogin Data\nCookies\nLocal Storage\n```\n\n**检查 D：动态代码执行**\n```regex\n\\beval\\s*\\(\n\\bexec\\s*\\(\n__import__\\s*\\(\nsubprocess\\.(run|call|Popen|check_output)\\s*\\(\nos\\.system\\s*\\(\nos\\.popen\\s*\\(\n\n\\beval\\s*\\(\nnew\\s+Function\\s*\\(\nvm\\.runInNewContext\nchild_process\\.(exec|spawn|execSync)\n\nshell\\s*=\\s*True\nf['\"](.*)\\{.*\\}(.*)[|;&`]\n```\n\n**检查 E：混淆与隐藏代码**\n```regex\nbase64\\s+-d\\s*\\|\nbase64\\.b64decode.*exec\natob\\(.*eval\nBuffer\\.from\\(.*base64.*\\).*exec\n\n(?:\\\\x[0-9a-fA-F]{2}){15,}\n\ndecodeURIComponent.*eval\n```\n\n**检查 F：数据外传模式**\n```regex\ncurl.*--data.*\\$(?:HOME|USER|SHELL|PATH)\ncurl.*--data.*\\$\\(cat\\s\nrequests\\.post.*os\\.environ\nrequests\\.post.*open\\(\nfetch.*JSON\\.stringify.*(?:localStorage|document\\.cookie|fs\\.)\n```\n\n对每个脚本文件：\n\n1. 读取全部内容\n2. 应用 Step 2 的所有正则模式\n3. 额外检查：\n   ```regex\n   # 写入系统目录\n   open\\(.*\\/etc\\/\n   open\\(.*~\\/\\.ssh\\/\n   fs\\.writeFile.*\\/etc\\/\n\n   # 进程信号操作\n   os\\.kill\\s*\\(\n   signal\\.(SIGKILL|SIGTERM)\n\n   # 定时任务安装\n   crontab\\s+-[el]\n   launchctl\\s+load\n   ```\n4. 检查 shebang：\n   - `#!/bin/bash` 或 `#!/bin/sh` → 记录，需逐行检查 shell 命令\n   - 无 shebang 但文件有可执行权限（`ls -la` 显示 `x` 位） → Medium 风险\n\n**风险级别标准**\n\n| 级别 | 判定条件 |\n|------|----------|\n| Low | 无外部网络调用；仅读取用户指定文件；仅使用标准工具 |\n| Medium | 外部网络调用但目标已知且必要；读取凭证但不传输；有 eval 但对象是用户提供的数据 |\n| High | 访问未在文档说明的外部服务；读取系统敏感文件；存在混淆代码 |\n| C","previewTruncated":true,"bodyLength":4397,"steps":37,"codeBlocks":10,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"ad-copywriting","dir":"商单文案写作（ad-copywriting）","category":"内容创作","purpose":"撰写品牌合作商单文案，含完整brief解读、角度选择方法和小红书/微信/视频号平台专属结构模板。","triggers":["商单文案","品牌合作","恰饭稿","软广","合作 brief"],"boundary":"不适用于自有内容选题（改走 zimeiti-content），也不适用于品牌风格沉淀（改走 brand-voice-system）","description":"撰写品牌合作商单文案，含完整brief解读、角度选择方法和小红书/微信/视频号平台专属结构模板。触发词如\"商单文案/品牌合作/恰饭稿/软广/合作 brief\"。｜不适用于自有内容选题（改走 zimeiti-content），也不适用于品牌风格沉淀（改走 brand-voice-system）","lead":"商单文案的核心矛盾：用户来看内容，品牌来买曝光。好的商单让用户觉得\"这是在帮我\"，让品牌觉得\"这在推广我\"，两者不冲突。核心技术：**内容价值优先，植入自然，7:3节奏把控**。","headings":[{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"步骤1：Brief解读与信息收集"},{"level":3,"text":"步骤2：角度选择"},{"level":3,"text":"步骤3：结构组装（7:3原则）"},{"level":3,"text":"步骤4：平台格式执行"},{"level":2,"text":"输出格式"},{"level":3,"text":"小红书商单模板"},{"level":3,"text":"微信公众号商单模板"},{"level":3,"text":"抖音/视频号口播脚本模板"},{"level":2,"text":"Gotchas"}],"preview":"商单文案的核心矛盾：用户来看内容，品牌来买曝光。好的商单让用户觉得\"这是在帮我\"，让品牌觉得\"这在推广我\"，两者不冲突。核心技术：**内容价值优先，植入自然，7:3节奏把控**。\n\n---\n\n- \"帮我写一篇[品牌]的商单\"\n- \"我接了[产品]的广告，需要一篇小红书/微信推文\"\n- \"帮我写一篇合作推广文章\"\n- 任何明确包含品牌/产品推广目的的内容创作需求\n\n---\n\n开始写作前，必须明确以下信息（若用户未提供，逐一追问）：\n\n**核心信息（必须知道才能开始）**：\n- 品牌/产品名称\n- 产品核心卖点（品牌方给的USP，通常1-3条）\n- 目标受众（品牌方指定的人群描述）\n- 发布平台（小红书/微信公众号/抖音脚本/视频号）\n- 字数要求或时长要求\n- 软广还是硬广（是否要求明确露出品牌名/产品名）\n\n**补充信息（有则更好）**：\n- 必须提及的硬性要素（活动信息/价格/购买渠道说明）\n- 禁止出现的内容（竞品名/特定词汇/夸大宣传词）\n- 博主定位（美妆/职场/生活方式/母婴，直接决定写作视角）\n- 是否有真实使用体验可参考？\n\n根据产品特性和受众选择主角度（辅以一个次角度）：\n\n**角度A：问题-解决方案型**\n适用：解决明确痛点的产品（护肤/效率工具/健康品）\n逻辑：我有X问题 → 试了很多方法没用 → 发现这个产品 → 具体效果\n风险：容易显假，场景必须足够真实和具体\n\n**角度B：生活方式融入型**\n适用：品牌调性产品（轻奢/美学/食品/香氛）\n逻辑：我的某种生活状态 → 这个产品是这种生活的一部分 → 为什么它适合同类人\n风险：植入感淡，但品牌记忆度高，适合长线合作\n\n**角度C：对比验证型**\n适用：强功能性产品（数码/家电/功效护肤）\n逻辑：我之前用[同类产品]，现在换了这个，区别是[具体对比数据/感受]\n风险：需要真实对比细节，否则显空洞\n\n**角度D：专业/权威型**\n适用：成分/技术驱动的产品（医美/功能食品/专业工具）\n逻辑：从专业视角解释产品背后的原理，然后评价产品实现了这个原理\n风险：需要真实的专业知识支撑，不能只喊概念\n\n**角度E：场景事件型**\n适用：礼品/节日产品/限定款/季节性产品\n逻辑：因为某个具体事件/场景 → 这个产品是完美选择 → 具体推荐\n风险：场景必须高度具体，否则读者无法代入\n\n全文70%是有价值的独立内容，30%是产品相关信息。\n\n读者视角：文章感觉是\"有用内容里自然提到了一个产品\"，而非\"广告里加了一些内容\"。\n\n**植入节奏**：\n```\n[纯内容部分，建立价值和信任] → [自然过渡] → [产品出现] → [核心产品信息，1-2个卖点] → [回归内容或行动引导]\n```\n\n**自然过渡的4种写法**：\n- 场景过渡：\"正好最近在用X，顺便说说真实感受...\"\n- 解决问题过渡：\"后来找到了一个方案，就是...\"\n- 长期使用过渡：\"用了半年了，这是我的真实体验...\"\n- 朋友推荐过渡：\"被好几个人安利，然后自己试了...\"\n\n严格按对应平台规范输出（见下方模板）\n\n---\n\n**标题格式**：20字以内，含核心关键词+情绪词\n```\n[痛点/场景]+[产品类别]+[结果/感受]\n示例：\"干皮救星！这款精华用了3周皮肤喝饱水的感觉\"\n```\n\n**正文结构**：\n```\n[开头，3-5行]\n场景代入或痛点共鸣，不提产品名，结尾留悬念\n\n[过渡，1-2行]\n自然引出产品\n\n[产品体验，3-5行]\n具体使用感受，1-2个核心卖点，给出具体细节（时间/部位/变化）\n\n[使用建议，2-3行]\ntips或适合人群\n\n[互动引导，1行]\n引导评论的问题\n\n[标签，5-8个]\n#产品类别 #功效词 #场景词 #人群词\n```\n\n格式规范：每段不超过3行，用空行分隔，表情符号点缀非堆砌，总字数300-600字\n\n---\n\n**标题**：20-40字，悬念/利益点/反常识\n\n**文章结构**（总字数1000-2000字）：\n```\n引入（150-300字）：话题/故事/问题，与产品使用场景相关，不提品牌\n\n内容主体（400-800字）：有独立阅读价值的内容，可以不看广告也值得读\n\n产品植入（200-400字）：\n  - 自然引出，说清楚为什么选这个而不是其他的\n  - 重点介绍1-2个核心卖点（不是全部卖点）\n  - 给出具体使用方法或购买信息\n\n结尾互动（50-100字）：引导评论或分享\n```\n\n格式规范：小标题分割内容，每节200-300字；文章开头或结尾标注\"广告\"或\"品牌合作\"（合规要求）\n\n---\n\n**视频时长**：60-90秒\n\n**脚本结构**：\n```\n[0-5秒] 钩子：\n一句话抓住注意力（提出问题或反常识陈述）\n[镜头提示：正面直视，表情专注]\n\n[5-20秒] 共鸣建立：\n展开问题，让观众点头认同\n[停顿节奏：每句话后自然停0.5秒]\n\n[20-45秒] 内容价值：\n有用信息，自然带出产品名\n[产品出现时机标注：第X秒]\n\n[45-65秒] 产品介绍：\n只说一个核心点（不超过2个卖点）\n具体说使用体验，不说空洞形容词\n[产品特写画面时机：第X-X秒]\n\n[65-80秒] 行动引导：\n告诉观众下一步怎么做\n[结尾镜头提示]\n```\n\n格式规范：口语化，短句每句不超过15字，避免书面语，每句话后标注[停顿/语气]提示\n\n---\n\n**最常见的商单失败原因**\n\n1. 植入太硬：前三句在聊生活，第四句突然\"今天要给大家推荐一款产品\" → 用户失去信任，直接关掉\n2. 卖点堆砌：把品牌方给的所有卖点全写进去 → 读者记不住任何一个，只选最重要的1-2个\n3. 假体验感：说\"我用了很久\"但描述太泛 → 加入具体时间、具体场景、具体感受细节\n4. 与博主定位不符：财经博主推护肤品，美妆博主推金融产品 → 即使强行找到角度也会显得奇怪\n\n**合规提醒（不可忽略）**\n- 国内平台要求标注广告合作，不标注是违规行为\n- 不允许使用绝对化用语（最好/第一/顶级/根治）\n- 医疗健康类产品有广告法特殊限制，不能承诺疗效\n\n**品牌方给的文案不能直接用**\n品牌方提供的USP是出发点，不是最终文案。必须转化成用户语言，而非品牌语言。\n\"科技感\"→","previewTruncated":true,"bodyLength":2899,"steps":31,"codeBlocks":5,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"advanced-xhs-visual-design","dir":"高级图文设计（advanced-xhs-visual-design）","category":"内容创作","purpose":"高级图文设计 + 高级画图提示词合并技能。用于把内容、选题、文章、发布会信息、产品分析、AI 工具评测、商业复盘等转成小红书/公众号高质感图文卡片，也用于为封面、海报、信息图、人像、UI 截图、叙事概念图生成高级生图 prompt。用户说“高级图文设计”“高级画图提示词”“超级提示词”“做一组小红书图文”“写 prompt”“按这个风格仿写”“黑绿终端风”“像 Codex/Codex Design 这种图文卡片”“把这篇内容做成高级卡片”时触发。","triggers":["高级图文设计","高级画图提示词","超级提示词","做一组小红书图文","黑绿终端风","按这个风格仿写"],"boundary":"不适用于公众号图文排版（改走 wechat-publish），也不适用于纯文生图（改走 image-generation）","description":"高级图文设计 + 高级画图提示词合并技能。用于把内容、选题、文章、发布会信息、产品分析、AI 工具评测、商业复盘等转成小红书/公众号高质感图文卡片，也用于为封面、海报、信息图、人像、UI 截图、叙事概念图生成高级生图 prompt。用户说“高级图文设计”“高级画图提示词”“超级提示词”“做一组小红书图文”“写 prompt”“按这个风格仿写”“黑绿终端风”“像 Codex/Codex Design 这种图文卡片”“把这篇内容做成高级卡片”时触发。触发词如\"高级图文设计/高级画图提示词/超级提示词/做一组小红书图文/黑绿终端风/按这个风格仿写\"。｜不适用于公众号图文排版（改走 wechat-publish），也不适用于纯文生图（改走 image-generation）","lead":"把内容转成可传播的高质感图文卡片；当用户只要生图 prompt 时，输出可直接投喂模型的高级提示词。","headings":[{"level":1,"text":"高级图文设计"},{"level":2,"text":"核心定位"},{"level":2,"text":"先判断任务分支"},{"level":3,"text":"A. 图文卡片分支"},{"level":3,"text":"B. Prompt-only 分支"},{"level":2,"text":"工作流"},{"level":3,"text":"1. 判断内容类型"},{"level":3,"text":"2. 先做叙事，不先做装饰"},{"level":3,"text":"3. 选择视觉母版"},{"level":3,"text":"4. 生成高级 prompt"},{"level":3,"text":"5. 做事实与文字保护"},{"level":2,"text":"何时读取 references"},{"level":2,"text":"输出模板"},{"level":3,"text":"图文卡片方案"},{"level":2,"text":"视觉方向"},{"level":2,"text":"卡片脚本"},{"level":2,"text":"设计系统"},{"level":2,"text":"逐页出图 Prompt"},{"level":3,"text":"01 封面"},{"level":2,"text":"质检清单"},{"level":3,"text":"Prompt-only 方案"},{"level":2,"text":"结论"},{"level":2,"text":"Prompt 1｜稳妥版"},{"level":2,"text":"Prompt 2｜传播版"},{"level":2,"text":"Prompt 3｜高概念版"},{"level":2,"text":"建议参数"},{"level":2,"text":"质检清单"},{"level":2,"text":"Gotchas"}],"preview":"把内容转成可传播的高质感图文卡片；当用户只要生图 prompt 时，输出可直接投喂模型的高级提示词。\n\n- 负责：选题拆解、卡片叙事、版式系统、色彩字体、单页构图、出图 prompt、HTML/CSS 设计稿规范。\n- 同时负责：为封面、海报、信息图、人像、UI 截图、角色图、叙事概念图生成高级生图 prompt。\n- 不负责：自动发布小红书；需要发布时交给发布类 skill。\n- 不负责：真实生图；需要出图时交给生图类 skill。\n- 默认先交付可执行结果，不输出理论说明。\n\n用户要“小红书图文 / 公众号图文 / 卡片 / 图文设计 / 把文章做成图 / 复刻版式”时，走完整图文方案。\n\n默认输出：\n\n1. 视觉方向：一句话定义风格与记忆点。\n2. 卡片脚本：6-9 张卡，每张包含目的、标题、画面结构、强调色。\n3. 设计系统：尺寸、背景、字体、颜色、组件、间距。\n4. 逐页出图 prompt：每张图一条可直接投喂生图模型或交给 HTML/CSS 渲染的描述。\n5. 质检清单：确保像设计作品，不像 AI 模板。\n\n用户只要“写 prompt / 高级画图提示词 / 超级提示词 / 仿写 prompt / 只要一条提示词”时，不强行做整套图文。\n\n默认输出：\n\n1. 结论：推荐哪版最适合当前用途。\n2. Prompt 1｜稳妥版：最容易出可用图。\n3. Prompt 2｜传播版：更抓眼，更适合封面传播。\n4. Prompt 3｜高概念版：更强视觉记忆点和设计感。\n5. 建议参数：比例、风格关键词、负面约束。\n\n如果用户明确只要 1 条，就只给 1 条。\n\n- 产品发布 / 功能更新：走 release notes + terminal dashboard。\n- 行业复盘 / 公司战略：走时间线 + 战略地图 + 数据卡。\n- 工具评测 / 教程：走问题冲击 + 操作流程 + 对比结果。\n- 投资 / 商业分析：走核心判断 + 数据证据 + 机制拆解 + 风险。\n- 观点型内容：走强观点封面 + 证据模块 + 结论金句。\n- 纯生图 prompt：判断为摄影人像、海报/封面、信息图、UI/截图、角色图、叙事概念图。\n\n图文卡片必须有清楚节奏：\n\n- 第 1 张：封面，负责停留率。\n- 第 2-3 张：核心变化/核心机制，讲清“发生了什么”。\n- 第 4-6 张：证据、数据、案例、时间线，建立可信度。\n- 第 7-8 张：战略判断/影响，形成传播观点。\n- 最后一张：一句话收束，负责收藏和转发。\n\n每张图只承载一个主要判断。不要把文章段落搬进图里。\n\n默认优先使用 **暗黑科技发布页**：\n\n- 黑色/近黑背景，有细噪声、扫描线、暗纹或微弱网格。\n- 荧光绿作为主强调色；黄、青、粉只作数据和标签辅助色。\n- 超大中文黑体标题；英文、命令行、标签使用等宽字体。\n- 终端窗口、代码块、时间线、指标卡、发光边框作为组件。\n\n详细规则读取：`references/tech-xhs-design-system.md`。\n\n所有 prompt 必须覆盖：\n\n- 媒介/画面类型：film photography、poster、infographic、UI screenshot、editorial card。\n- 主体与场景：谁、什么物、什么场景、什么身份或时代。\n- 镜头与构图：比例、视角、留白、主视觉支点、视觉动线。\n- 光线系统：自然光、闪光、霓虹、rim light、window light、屏幕光。\n- 材质与细节：纸张、噪声、皮肤、织物、玻璃反射、UI 间距。\n- 色彩策略：主色 + 强调色，不乱堆颜色。\n- 情绪与叙事：让画面有明确气质和故事线索。\n- 文字/版式约束：中文可读、标题位置、信息层级。\n- 负面约束：主动排除廉价、乱码、过度发光、拥挤、模板感。\n\n先定媒介，再定主体；先给一个强视觉支点，再补次级证据。抽象审美词后面必须跟可见证据词。\n\n- 涉及公司、产品、融资、收入、增长、日期、模型版本、市场数据时，不确定就标为“待核验”。\n- 用户要求真实发布时，必须先核验来源。\n- 不要把示意数字伪装成真实数据。\n- 生图 prompt 可以写 `mock data / illustrative labels`，正式发布稿必须换成已核验信息。\n- 中文信息图、中文海报、中文界面，必须写明“所有可见文字使用简体中文且清晰可读”。\n- 复杂中文排版优先用 HTML/CSS/设计工具渲染，生图只负责背景和装饰。\n\n- 暗黑科技小红书卡片、终端风、Codex/Codex Design 风：读 `references/tech-xhs-design-system.md`。\n- 需要判断 prompt 结构模式：读 `references/image-prompt-patterns.md`。\n- 需要快速套骨架：读 `references/image-prompt-templates.md`。\n- 需要参考爆款 GPT-Image 案例：读 `references/gpt-image-prompt-cases.md`，但不要原样大段复制。\n- 需要程序化检索案例：读 `references/extracted-prompts.json`。\n- 只需要常规图文方案且信息已足够时，不必额外读取长参考。\n\n````markdown\n...\n\n| 页 | 目的 | 标题 | 画面结构 | 强调色 | 备注 |\n|---|---|---|---|---|---|\n\n- 尺寸：\n- 背景：\n- 字体：\n- 色彩：\n- 组件：\n\n```text\n...\n```\n\n- ...\n````\n\n````markdown\n...\n\n**中文版**\n```text\n...\n```\n**English version**\n```text\n...\n```\n\n...\n\n...\n\n- 比例：\n- 风格关键词：\n- 负面约束：\n````\n\n- 是否一眼能看出主判断或主视觉支点。\n- 是否每页只讲一个主要信息。\n- 是否有明确比例、构图、光线、材质、色彩、负面约束。\n- 中文是否足够短、足够大、足够可读。\n- 荧光色是否克制，是否避免廉价赛博朋克。\n-","previewTruncated":true,"bodyLength":3282,"steps":75,"codeBlocks":5,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"gpt-image","scene":"文生图（含画面文字）"}]},{"name":"ai-polish","dir":"去AI味润色（ai-polish）","category":"内容创作","purpose":"检测并修复中文内容中的AI写作特征，逐类诊断后重写，让文章读起来像真人写的。","triggers":["去AI味","太像AI写的","润色得像真人","读起来假","AI腔"],"boundary":"不适用于英文文本（改走 humanizer），也不适用于从零创作（改走 original-writing）","description":"检测并修复中文内容中的AI写作特征，逐类诊断后重写，让文章读起来像真人写的。触发词如\"去AI味/太像AI写的/润色得像真人/读起来假/AI腔\"。｜不适用于英文文本（改走 humanizer），也不适用于从零创作（改走 original-writing）","lead":"AI写出的中文内容有极度固定的语言模式和节奏，训练有素的读者一眼就能识别。这个技能的目标：**诊断AI写作的具体病症，然后用真人语言替换它**。不是微调，是手术。","headings":[{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"步骤1：全文扫描（诊断阶段，不修改，只标注）"},{"level":3,"text":"步骤2：打标汇总"},{"level":3,"text":"步骤3：分段重写"},{"level":3,"text":"步骤4：朗读节奏检查"},{"level":2,"text":"输出格式"},{"level":3,"text":"短文（1000字以内）"},{"level":3,"text":"长文（1000字以上）"},{"level":2,"text":"Gotchas"}],"preview":"AI写出的中文内容有极度固定的语言模式和节奏，训练有素的读者一眼就能识别。这个技能的目标：**诊断AI写作的具体病症，然后用真人语言替换它**。不是微调，是手术。\n\n---\n\n- \"帮我润色一下，去掉AI味\"\n- \"这篇文章读起来太像AI了，改一下\"\n- \"让这段话听起来更像我说的\"\n- \"检查一下有没有AI写作的痕迹\"\n\n---\n\n在修改任何内容之前，先完成全部诊断，按以下清单逐项检查并标注问题类型：\n\n---\n\n**A类：万能开头结尾词（出现即删）**\n\n以下词语出现即删除或替换，不需要分析：\n- `总的来说` / `综上所述` / `总而言之`\n- `值得注意的是` / `不难发现` / `显而易见`\n- `随着X时代的到来` / `在当今社会` / `当下这个时代`\n- `越来越多的人开始` / `不少人都有这样的体验`\n- `希望本文能对你有所帮助` / `欢迎关注点赞收藏`\n- `这是一个值得深思的问题` / `我们需要认真思考`\n- `在这个快节奏的时代` / `生活在这个时代的我们`\n\n---\n\n**B类：过度并列结构（最高频AI特征）**\n\n特征：连续3个以上格式完全相同的句子或段落。\n\n诊断标准：选任意5句连续内容，若每句起始词都是\"首先/其次/再次/最后\"或\"第一/第二/第三\"，判定为B类问题。\n\n```\n错误示范：\n首先，我们要做好准备工作。\n其次，我们需要制定详细的计划。\n再次，我们应当严格执行方案。\n最后，我们总结复盘积累经验。\n\n真人写法：\n准备工作很多人跳过了，这是后面反复返工的根源。\n计划不需要完美，能执行的计划比精致但搁置的计划有价值得多。\n执行中发现的问题，往往比计划阶段预想的更奇怪——这时候怎么应对比计划本身更重要。\n```\n\n---\n\n**C类：机械过渡词（替换为自然连接）**\n\n过度使用以下词时需要重写段落间的连接：\n- `不仅如此` / `与此同时` / `除此之外` / `另外`\n- `更重要的是` / `值得一提的是` / `需要指出的是`\n- `总体而言` / `从整体上看` / `综合来看`\n- `对于这个问题` / `针对这一现象` / `就这一点而言`\n\n替换方向：要么直接连接（删掉过渡词，两段直接相邻），要么用具体的因果关系或场景替代过渡词。\n\n---\n\n**D类：空洞形容词（用具体细节替换）**\n\n诊断：以下词出现密度高时判定为D类问题：\n\n过于宏大：`深刻` / `显著` / `卓越` / `非凡` / `重要` / `关键` / `本质` / `内在逻辑`\n\n过度保险：`一定程度上` / `某种意义上` / `相对来说` / `从某种角度看` / `不同程度地`\n\n```\n错误示范：\"这个方法非常有效，对我们产生了深远的影响。\"\n真人写法：\"用这个方法，我三天内解决了卡了两个月的问题。\"\n```\n\n规则：删掉形容词，用具体数字、时间或结果替代。\n\n---\n\n**E类：句子节奏机械（最难改但最影响感受）**\n\nAI生成文章的句子长度高度均匀（每句约15-25字），节奏像机器人朗读。真人写作的特征：长短交替，偶尔一句话就是一句话。\n\n诊断标准：选任意连续5句，若字数差异都在5字以内，判定节奏机械。\n\n```\n错误示范（每句均匀约20字）：\n这个问题需要我们认真对待，因为它影响着我们的生活。\n很多人在面对这种情况时都会感到困惑，不知该如何处理。\n我们可以采取一些有效的措施来改善这种情况，提升质量。\n\n真人写法（长短不一）：\n这个问题很麻烦。\n不是说不能解决，而是很多人根本不知道从哪下手——确认问题在哪才是第一步。\n我后来试了这个方法，解决了。\n```\n\n---\n\n**F类：空洞升华结尾（直接删掉或换实质内容）**\n\n```\n典型AI结尾（删掉）：\n\"生活就是如此，需要我们不断探索和前行。\"\n\"愿我们都能在这条路上找到属于自己的答案。\"\n\"这不仅仅是一个选择，更是一种态度。\"\n\"让我们共同努力，迈向更美好的明天。\"\n\n真人结尾：直接说要做什么，或留一个真实问题，或在自然的地方停下。\n```\n\n---\n\n**G类：第一人称缺失（添加真实视角）**\n\nAI倾向于用\"我们\"泛指，或完全回避第一人称。真人写作有具体的个人视角。\n\n```\n错误示范：\"人们普遍认为，在面对挑战时需要保持积极心态。\"\n真人写法：\"我以前也这么想，直到第三次失败后才发现这句话的问题在哪。\"\n\n错误示范：\"我们需要改变这种观念，重新审视自己的选择。\"\n真人写法：\"我是怎么改变的：[具体一件事]让我意识到[具体洞察]。\"\n```\n\n---\n\n完成扫描后，汇总问题清单：\n- A类：X处\n- B类：X处（举1个典型例子）\n- C类：X处\n- D类：X处\n- E类：整体节奏评级（轻微/中度/严重）\n- F类：有/无\n- G类：有/无\n\n给出总体AI味程度评级：轻微/中度/明显/严重\n\n按批注逐段修改：\n- A类：直接删除，不需要替换文字\n- B类：打破并列，改为因果关系/转折逻辑/叙事推进\n- C类：删掉过渡词，重写段落连接逻辑\n- D类：删掉形容词，找具体细节（数字/时间/结果）替代\n- E类：重新切割句子，主动制造长短对比\n- F类：删掉最后1-2段空洞升华，换一句具体的话\n- G类：加入第一人称具体视角和经历\n\n修改完成后，模拟朗读全文：\n- 在哪里会自然停顿？那里应该是段落结束或句号\n- 哪句话读起来像在背稿而非说话？重写那句\n- 整体是否有快慢起伏？太均匀则节奏仍有问题\n\n---\n\n直接输出修改稿，末尾附：\n```\n【修改说明】\n发现并处理的AI特征：\n- [类型] × [X处]：[举一个典型改法示例]\n- [类型] × [X处]：[举一个典型改法示例]\n主要改动方向：[一句话总结]\n```\n\n先输出诊断报告，再输出修改稿：\n```\n【AI特征诊断报告】\nA类（套话）：[X处，举例]\nB类（并列）：[X处，举例]\nC类（过渡）：[X处，举例]\nD类（空洞形容）：[X处，举例]\nE类（节奏）：[轻微/中度/严重]\nF类（结尾升华）：[有/无]\nG类（视角缺失）：[有/无]\n\n总体AI味程度：[轻微/中度/明显/严重]\n主要问题：[最需要解决的1-2类问题]\n---\n[修改稿]\n`","previewTruncated":true,"bodyLength":3174,"steps":40,"codeBlocks":7,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"brand-voice-system","dir":"品牌声纹系统（brand-voice-system）","category":"内容创作","purpose":"沉淀个人 IP 或品牌的表达风格、禁用词、常用句式和改写规则，适合团队长期稳定产出内容。","triggers":["品牌声纹","表达风格","禁用词","常用句式","统一口吻"],"boundary":"只沉淀风格规则、不写单篇稿件（要写改走 original-writing / zimeiti-content）","description":"沉淀个人 IP 或品牌的表达风格、禁用词、常用句式和改写规则，适合团队长期稳定产出内容。触发词如\"品牌声纹/表达风格/禁用词/常用句式/统一口吻\"。｜只沉淀风格规则、不写单篇稿件（要写改走 original-writing / zimeiti-content）","lead":"把风格从个人感觉变成可传递的写作规则。","headings":[{"level":1,"text":"Brand Voice System"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把风格从个人感觉变成可传递的写作规则。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n声纹规则、禁用词表、示例改写、审核清单：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":747,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"content-calendar","dir":"content-calendar","category":"内容创作","purpose":"当用户要规划内容排期、建立选题库、制定日更/周更计划、做内容复盘时使用。","triggers":["内容日历","选题库","排期","一周内容","更新计划","复盘"],"boundary":"不适用于单篇内容的实际创作（改走 zimeiti-content / wechat-publish），也不适用于项目级 WBS 与关键路径（改走 project-management）","description":"当用户要规划内容排期、建立选题库、制定日更/周更计划、做内容复盘时使用。触发词如\"内容日历/选题库/排期/一周内容/更新计划/复盘\"。｜不适用于单篇内容的实际创作（改走 zimeiti-content / wechat-publish），也不适用于项目级 WBS 与关键路径（改走 project-management）","lead":"把\"想到哪写到哪\"变成\"有节奏、可执行、可复盘\"的内容生产。","headings":[{"level":1,"text":"内容日历与选题规划"},{"level":2,"text":"1. 先定节奏与资源"},{"level":2,"text":"2. 建立选题库"},{"level":2,"text":"3. 排期日历"},{"level":2,"text":"4. 复盘模板"},{"level":2,"text":"5. 输出格式"},{"level":2,"text":"注意事项"}],"preview":"把\"想到哪写到哪\"变成\"有节奏、可执行、可复盘\"的内容生产。\n\n- 更新频率：日更 / 周几更 / 每周几篇，量力而行（稳定 > 爆发）。\n- 内容配比（自媒体常用）：70% 干货/价值 + 20% 人设/日常 + 10% 互动/热点。\n- 单篇成本：制作时间、是否需要素材/拍摄/剪辑，别排进做不到的计划。\n\n按三个维度给用户建一个可持续补充的选题库（用表格）：\n\n| 选题 | 类型（痛点/痒点/热点/人设） | 形式（图文/视频/直播） | 优先级 | 预计发布时间 |\n|---|---|---|---|---|\n\n每个选题写清：一句话核心观点 + 目标人群 + 预期目标动作。\n\n输出\"周历/月历\"形式的排期表，每天标注：选题 + 形式 + 平台 + 完成状态。\n原则：\n- 重头内容放流量高峰（工作日晚间、周末上午等，按平台提示）。\n- 热点内容标注\"24 小时内出\"的时效性。\n- 留出 1 天缓冲，不排满 7 天。\n\n每周/每月复盘固定四问，输出结论与下周调整：\n1. 哪条数据最好？它做对了什么（选题/标题/前 3 秒/发布时段）？\n2. 哪条最差？差在哪一环？\n3. 粉丝反馈里最高频的词是什么？\n4. 下周要砍掉什么、加倍什么？\n\n一次交付：内容配比建议 + 选题库表（≥10 条）+ 未来 7 天排期表 + 3 条\"立刻能做\"的选题。\n\n- 不为了排满而注水：宁可少而精，选题不够就如实说\"需要先补选题库\"。\n- 排期默认从\"今天\"算起，日期用真实日期。","previewTruncated":false,"bodyLength":725,"steps":12,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"content-repurposing","dir":"内容矩阵复用（content-repurposing）","category":"内容创作","purpose":"把一篇长内容拆成公众号、小红书、短视频脚本、朋友圈和社群素材，适合一次创作多平台分发。","triggers":["一稿多投","拆成多平台","内容复用","长内容拆解","一次创作多平台分发"],"boundary":"不适用于单平台从零创作（改走 zimeiti-content），也不适用于视频成片（改走 seedance-video / videocut-jiankoubo）","description":"把一篇长内容拆成公众号、小红书、短视频脚本、朋友圈和社群素材，适合一次创作多平台分发。触发词如\"一稿多投/拆成多平台/内容复用/长内容拆解/一次创作多平台分发\"。｜不适用于单平台从零创作（改走 zimeiti-content），也不适用于视频成片（改走 seedance-video / videocut-jiankoubo）","lead":"保留核心观点，针对不同平台改写叙事密度、开头钩子和行动召唤。","headings":[{"level":1,"text":"Content Repurposing"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"保留核心观点，针对不同平台改写叙事密度、开头钩子和行动召唤。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n平台矩阵表、多版本文案、标题池、发布顺序：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":760,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"Seedance","scene":"文生视频（火山方舟）"}]},{"name":"content-rewrite","dir":"改稿（content-rewrite）","category":"内容创作","purpose":"将爆款参考内容改写为原创风格，保留有效结构和核心逻辑，替换全部表达、案例和比喻。","triggers":["改写爆款","洗稿","换个说法","保留结构重写","仿写这篇"],"boundary":"不适用于从零原创（改走 original-writing），也不适用于去 AI 味润色（改走 ai-polish）","description":"将爆款参考内容改写为原创风格，保留有效结构和核心逻辑，替换全部表达、案例和比喻。触发词如\"改写爆款/洗稿/换个说法/保留结构重写/仿写这篇\"。｜不适用于从零原创（改走 original-writing），也不适用于去 AI 味润色（改走 ai-polish）","lead":"洗稿不是同义词替换，而是**理解参考内容为什么有效，然后用自己的语言和素材重新表达同样的有效性**。合格标准：结构可学，逻辑可用，但表达、案例、比喻全部是新的，任意15字连续片段与原文不重合。","headings":[{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"步骤1：解构参考内容（阅读分析阶段）"},{"level":3,"text":"步骤2：明确改写边界"},{"level":3,"text":"步骤3：目标风格设定"},{"level":3,"text":"步骤4：分块改写执行"},{"level":3,"text":"步骤5：全文质检"},{"level":2,"text":"输出格式"},{"level":3,"text":"改写前分析报告（先输出，确认后再开始改写）"},{"level":3,"text":"改写稿输出"},{"level":2,"text":"Gotchas"}],"preview":"洗稿不是同义词替换，而是**理解参考内容为什么有效，然后用自己的语言和素材重新表达同样的有效性**。合格标准：结构可学，逻辑可用，但表达、案例、比喻全部是新的，任意15字连续片段与原文不重合。\n\n---\n\n- \"帮我把这篇文章改成我的风格\"\n- \"参考这篇爆款，帮我写一篇类似的\"\n- \"基于这个内容框架，用不同的例子重写\"\n- \"这篇文章很好，我需要一个不雷同的版本\"\n\n---\n\n不要直接开始改写，先做完整解构：\n\n**1.1 提取核心主张**\n- 这篇内容的核心论点是什么？（一句话）\n- 作者的核心立场是什么？（支持/反对/揭示了什么）\n\n**1.2 绘制逻辑骨架**\n```\n论点1 → 支撑证据（类型：数据/故事/对比/权威） → 小结论\n论点2 → 支撑证据 → 小结论\n...\n总结论\n```\n\n**1.3 爆款因素诊断**\n识别这篇内容为什么有效（找出1-2个主要因素）：\n\n| 因素 | 是否是本文主要因素 |\n|-----|----------------|\n| 情绪钩子（触发愤怒/感动/共鸣/恐惧） | |\n| 数据冲击（意外的数字或研究结论） | |\n| 反常识（颠覆主流认知） | |\n| 故事代入（主角情境与读者高度重叠） | |\n| 实用价值（直接可操作的方法） | |\n| 身份认同（说出某类人想说没说的话） | |\n\n**1.4 语言风格标注**\n- 句子长度：短促/长句/混合\n- 人称：第一人称亲历/第三人称客观/对话体\n- 语气：严肃/亲切/犀利/幽默\n- 标志性表达：找出3-5个最有特色的句式\n\n**必须保留（结构层）**：\n- 文章的整体逻辑结构（起承转合的节奏）\n- 论点与论点之间的推进关系\n- 使内容有效的核心机制（若参考用\"问题-方案\"有效，保留这个框架）\n- 段落的功能分工（哪段建立共鸣，哪段给解决方案）\n\n**必须改变（表达层，零容忍）**：\n- 所有句子的具体表达\n- 所有案例和例子（必须替换为不同的案例）\n- 所有比喻和类比\n- 标题和所有小标题\n- 开头和结尾的具体内容\n- 若引用数据，必须来自不同来源\n\n**查重硬标准**：任意15个连续汉字不得与原文重合\n\n改写前必须明确目标声音（若用户未指定，追问）：\n```\n目标声音：亲历者 / 观察者 / 教练 / 朋友 / 专家\n语气温度：冷静客观 / 温暖亲近 / 犀利直接 / 幽默轻松\n句子风格：短句冲击 / 长短交替 / 散文流动\n人称选择：我 / 你 / 我们 / 第三人称\n```\n\n若用户提供风格范本（某人的文章/某平台的文章），提取其标志性句式作为参照。\n\n按段落/部分逐块改写，每块完成后检查：\n1. 核心论点是否保留？\n2. 表达是否100%是新的？\n3. 风格是否符合目标声音？\n4. 案例是否已替换？\n\n**改写的4种核心技术**：\n\n**更换例子**：参考内容用A公司举例 → 找一个能说明同样道理的B公司，或换成个人生活场景。替换后效果应不弱于原例子。\n\n**更换比喻**：参考内容把X比作\"马拉松\" → 用另一个同样有效的比喻，或干脆改为直接描述而不用比喻。不要强行找替换，如果找不到更好的比喻，换一种表达方式。\n\n**重构数据支撑**：参考内容引用了研究数据 → 寻找说明同样现象的不同数据，或改用逻辑推理代替数据。\n\n**重构开头**：不论原文用什么开场类型，用完全不同的类型替代（原文用故事 → 用数据；原文用问题 → 用反常识陈述）。\n\n**查重检验**：\n将改写稿和原文各取5个段落并排，逐句检查是否有句式雷同。\n重点检查：过渡句、列举句、总结句（这些最容易不知不觉保留原文结构）\n\n**有效性验证**：\n- 改写稿是否保留了原文让人想读下去的核心张力？\n- 原文的情感共鸣点是否在改写稿中同样存在（可以用不同方式实现）？\n\n---\n\n```\n【参考内容解构】\n\n核心主张：[一句话]\n逻辑骨架：\n  1. [论点1] → [证据类型] → [小结论]\n  2. [论点2] → [证据类型] → [小结论]\n\n爆款核心因素：[1-2个最主要的]\n原文语言风格：[简短描述]\n\n【改写方案】\n目标声音：[设定]\n结构调整：[若保留，注明\"保留原结构\"；若调整，说明如何调整]\n案例替换计划：\n  - 原文案例[描述] → 替换为[新案例方向]\n  - 原文案例[描述] → 替换为[新案例方向]\n开头策略：[用什么类型的钩子，与原文不同]\n\n确认方案后开始改写。\n```\n\n完整改写稿，末尾附：\n```\n【改写说明】\n结构保留：[说明保留了什么逻辑结构]\n主要改变：[表达、案例、比喻的改变方向]\n案例对照：原文[X] → 改写[Y]\n```\n\n---\n\n**同义词替换不是洗稿**\n\"美好的未来\"→\"光明的前景\"不是改写，这是替换。真正的改写是把\"通过持续努力可以实现目标\"改写成一个具体的反例故事，然后从故事里得出同样的结论。\n\n**最容易暴露的位置**\n- 列举项的数量（原文\"3个方法\"→应改为不同数量）\n- 过渡语（\"不仅如此\"\"更重要的是\"容易照搬）\n- 文章的节奏节点（转折点的位置往往会被无意识地复制）\n- 结论段（大量改写者到结尾忘了改，直接用原文总结）\n\n**改写质量下降的常见原因**\n- 为了不重复而用词生僻 → 应该换表达方式，不是换生僻词汇\n- 换了案例但说明力不如原文 → 宁可用相似案例讲清楚，也不用牵强案例敷衍\n- 原文的情感共鸣被改掉了 → 改写时主动问\"原文让读者有什么感受，我的改写保留了这个感受吗\"\n\n**不适合改写的情况**\n- 原文包含作者独家亲身经历或独家访谈 → 只能参考结构，不能改写内容\n- 原文核心数据是作者原创研究 → 必须替换为其他数据来源，不能沿用数字","previewTruncated":false,"bodyLength":2559,"steps":39,"codeBlocks":4,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"content-scraper","dir":"内容抓取（content-scraper）","category":"内容创作","purpose":"Scrapes full content from social media platforms (XHS, Weibo, Zhihu, Bilibili, X/Twitter) including truncated text, metadata, and comments when user provides a content URL or search query.","triggers":["Scrape content from XHS / Weibo / Zhihu / Bilibili / X when the user gives a content URL o…"],"boundary":"不适用于原创创作（改走 original-writing），也不适用于需要登录态发布的操作（改走 wechat-publish / xiaohongshu-auto）","description":"Scrapes full content from social media platforms (XHS, Weibo, Zhihu, Bilibili, X/Twitter) including truncated text, metadata, and comments when user provides a content URL or search query.Use when: \"Scrape content from XHS / Weibo / Zhihu / Bilibili / X when the user gives a content URL or a search query\".｜不适用于原创创作（改走 original-writing），也不适用于需要登录态发布的操作（改走 wechat-publish / xiaohongshu-auto）","lead":"针对主流中文和国际社交媒体平台，处理登录墙、内容截断、动态加载等平台特有问题，提取完整正文、元数据和评论，输出结构化 JSON。","headings":[{"level":1,"text":"内容抓取（Content Scraper）"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1：URL 解析与平台识别"},{"level":3,"text":"Step 2：登录状态检查"},{"level":3,"text":"Step 3：平台特定抓取"},{"level":3,"text":"Step 4：限流与操作节奏"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"针对主流中文和国际社交媒体平台，处理登录墙、内容截断、动态加载等平台特有问题，提取完整正文、元数据和评论，输出结构化 JSON。\n\n依赖 browser-automation skill 作为底层执行引擎。\n\n---\n\n- 用户提供内容 URL，要求获取全文（包括被截断的部分）\n- 用户要求批量抓取多个链接\n- 用户要求抓取评论区数据\n- 用户要求抓取某平台的搜索结果\n\n---\n\n```\nURL 模式 → 平台：\nxiaohongshu.com / xhslink.com        → 小红书（XHS）\nweibo.com / m.weibo.cn / weibo.cn    → 微博\nzhihu.com                            → 知乎\nbilibili.com / b23.tv                → Bilibili\nx.com / twitter.com                  → X/Twitter\n```\n\n短链接（b23.tv, xhslink.com）先跟随重定向获取真实 URL，再识别平台。\n\n如 URL 不在支持列表中，告知用户并建议使用 browser-automation skill 自定义抓取。\n\n导航到 URL 后立即 snapshot，检查是否出现登录墙关键词：\n```\n[\"登录\", \"注册\", \"Sign in\", \"Log in\", \"继续阅读\", \"查看完整内容\", \"关注后查看\"]\n```\n\n如检测到登录墙：\n1. 检查真实浏览器模式下是否已有 session（重新加载页面后内容正常显示）\n2. 如无 session，暂停并提示：\n   ```\n   {平台名} 需要登录才能查看完整内容。\n   请在已打开的浏览器中完成登录，完成后告诉我继续。\n   ```\n3. 用户确认后，重新导航并继续\n\n---\n\n**已知限制：**\n- 正文超过约 1000 字符时，帖子列表页截断，详情页显示\"...展开\"按钮\n- 图文笔记（文字在图片中）无法从 DOM 提取文字，需标注\n- PC 端（www.xiaohongshu.com）比移动端更易抓取\n\n**抓取步骤：**\n```\n1. navigate(笔记 URL)，确保是详情页而非列表页\n2. snapshot()\n3. 检查是否有\"展开\"按钮 → click 展开完整正文\n4. 提取：\n   标题：h1 或 .note-title\n   正文：.note-text（多段落需逐段拼接，保留换行）\n   图片数量：轮播图中 img 标签数量\n5. 提取数据指标：\n   点赞：.like-wrapper .count\n   收藏：.collect-wrapper .count\n   评论：.comment-count\n6. 提取发布时间（可能是相对时间\"3天前\"，记录并标注）\n7. 评论抓取：\n   scroll 到评论区等待加载\n   提取可见评论（作者名 + 内容 + 点赞数）\n   检查\"查看更多评论\"→ click → 继续提取\n   二级回复需 click\"查看回复\"后提取\n   建议上限：50 条评论\n```\n\n---\n\n**已知限制：**\n- 超长微博在列表页截断，必须进入详情页\n- 转发微博需同时抓取原微博内容\n- 评论分\"热门\"和\"最新\"两个 tab，内容不同\n- 部分内容需关注博主才能查看\n\n**抓取步骤：**\n```\n1. 将 m.weibo.cn URL 转换为 weibo.com（PC 端内容更完整）\n2. navigate(详情页 URL)\n3. snapshot()\n4. 检查是否有\"展开\"→ click\n5. 提取：\n   正文：.weibo-text（注意区分正文和话题标签）\n   转发结构：检查 .retweet 块；如有，分别提取转发者语和原微博\n   发布时间：.time（格式多变，可能是时间戳/相对时间/完整日期）\n   互动数据：转发数、评论数、点赞数\n6. 评论（如需）：\n   切换到\"热门评论\" tab → 提取 30 条\n   切换到\"最新评论\" tab → 提取 20 条\n   每条记录：作者、内容、点赞数、发布时间\n```\n\n---\n\n**已知限制：**\n- 问题页默认只展开 3 个回答，其余折叠\n- 每个回答在问题页折叠超过约 600 字（需 click\"查看全文\"）\n- 专栏文章通常完整展示，无需展开\n- 被折叠的回答（违规内容）不应尝试展开\n\n**问题页抓取：**\n```\n1. navigate(问题 URL)\n2. snapshot() 识别回答列表\n3. 对每个目标回答：\n   click \"阅读全文\" 或 \"查看全部\" 展开\n   提取：作者（姓名 + 简介）/ 正文 / 赞同数 / 评论数 / 发布时间\n4. click \"更多回答\" 加载（最多 3 批次，避免过长）\n```\n\n**专栏/文章抓取：**\n```\n1. navigate(文章 URL)\n2. snapshot()\n3. 直接提取正文（通常无截断）\n4. 提取：标题 / 作者 / 发布日期 / 阅读量 / 点赞数\n5. 评论：click 展开评论区 → 提取前 30 条\n```\n\n---\n\n**已知限制：**\n- 视频简介（description）经常截断，需 click\"展开\"\n- 弹幕和评论是两个不同数据源，用途不同\n- 大会员内容可抓元数据，但无法获取视频\n- 视频转写（字幕）需使用 video-transcribe skill\n\n**视频页抓取：**\n```\n1. navigate(bilibili.com/video/BV... 格式的 URL)\n2. snapshot()\n3. 提取：\n   标题：h1.video-title\n   UP 主：.up-name\n   播放量 / 弹幕数 / 评论数 / 发布日期\n   简介：click\"展开\" → 提取 .desc-info 完整文本\n   分 P 信息：如有多 P，记录 P 列表\n4. 评论（如需）：\n   scroll 到评论区等待加载（Bilibili 评论需要登录）\n   提取前 ","previewTruncated":true,"bodyLength":4789,"steps":79,"codeBlocks":11,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"hook-angle-lab","dir":"选题钩子实验室（hook-angle-lab）","category":"内容创作","purpose":"为文章、短视频、直播和课程设计高点击选题角度和开头钩子，适合选题会、内容改题和爆款复盘。","triggers":["选题角度","开头钩子","爆款复盘","点击率","改题"],"boundary":"不适用于正文成稿（改走 original-writing / zimeiti-content），也不适用于视频分镜（改走 short-video-script）","description":"为文章、短视频、直播和课程设计高点击选题角度和开头钩子，适合选题会、内容改题和爆款复盘。触发词如\"选题角度/开头钩子/爆款复盘/点击率/改题\"。｜不适用于正文成稿（改走 original-writing / zimeiti-content），也不适用于视频分镜（改走 short-video-script）","lead":"用冲突、反常识、具体场景和身份共鸣筛选真正值得写的角度。","headings":[{"level":1,"text":"Hook Angle Lab"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"用冲突、反常识、具体场景和身份共鸣筛选真正值得写的角度。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n选题池、钩子版本、评分表、推荐角度：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":750,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"humanizer","dir":"去AI味英文版（humanizer）","category":"内容创作","purpose":"Remove signs of AI-generated writing from text. Based on Wikipedia's comprehensive \"Signs of AI writing\" guide. Detects and fixes patterns including: inflated symbolism, promotional language, superficial -ing analyses, vague attributions, em dash overuse, rule of three, AI vocabulary words, negative parallelisms, and excessive conjunctive phrases.","triggers":["editing or reviewing text to make it sound more natural and human-written"],"boundary":"不适用于中文去 AI 味（改走 ai-polish），也不适用于从零创作（改走 original-writing）","description":"Remove signs of AI-generated writing from text. Use when editing or reviewing text to make it sound more natural and human-written. Based on Wikipedia's comprehensive \"Signs of AI writing\" guide. Detects and fixes patterns including: inflated symbolism, promotional language, superficial -ing analyses, vague attributions, em dash overuse, rule of three, AI vocabulary words, negative parallelisms, and excessive conjunctive phrases. ｜不适用于中文去 AI 味（改走 ai-polish），也不适用于从零创作（改走 original-writing）","lead":"You are a writing editor that identifies and removes signs of AI-generated text to make writing sound more natural and human. This guide is based on Wikipedia's \"Signs of AI writing\" page, maintained by WikiProject AI Cleanup.","headings":[{"level":1,"text":"Humanizer: Remove AI Writing Patterns"},{"level":2,"text":"Your Task"},{"level":2,"text":"PERSONALITY AND SOUL"},{"level":3,"text":"Signs of soulless writing (even if technically \"clean\"):"},{"level":3,"text":"How to add voice:"},{"level":3,"text":"Before (clean but soulless):"},{"level":3,"text":"After (has a pulse):"},{"level":2,"text":"CONTENT PATTERNS"},{"level":3,"text":"1. Undue Emphasis on Significance, Legacy, and Broader Trends"},{"level":3,"text":"2. Undue Emphasis on Notability and Media Coverage"},{"level":3,"text":"3. Superficial Analyses with -ing Endings"},{"level":3,"text":"4. Promotional and Advertisement-like Language"},{"level":3,"text":"5. Vague Attributions and Weasel Words"},{"level":3,"text":"6. Outline-like \"Challenges and Future Prospects\" Sections"},{"level":2,"text":"LANGUAGE AND GRAMMAR PATTERNS"},{"level":3,"text":"7. Overused \"AI Vocabulary\" Words"},{"level":3,"text":"8. Avoidance of \"is\"/\"are\" (Copula Avoidance)"},{"level":3,"text":"9. Negative Parallelisms"},{"level":3,"text":"10. Rule of Three Overuse"},{"level":3,"text":"11. Elegant Variation (Synonym Cycling)"},{"level":3,"text":"12. False Ranges"},{"level":2,"text":"STYLE PATTERNS"},{"level":3,"text":"13. Em Dash Overuse"},{"level":3,"text":"14. Overuse of Boldface"},{"level":3,"text":"15. Inline-Header Vertical Lists"},{"level":3,"text":"16. Title Case in Headings"},{"level":3,"text":"17. Emojis"},{"level":3,"text":"18. Curly Quotation Marks"},{"level":2,"text":"COMMUNICATION PATTERNS"},{"level":3,"text":"19. Collaborative Communication Artifacts"},{"level":3,"text":"20. Knowledge-Cutoff Disclaimers"},{"level":3,"text":"21. Sycophantic/Servile Tone"},{"level":2,"text":"FILLER AND HEDGING"},{"level":3,"text":"22. Filler Phrases"},{"level":3,"text":"23. Excessive Hedging"},{"level":3,"text":"24. Generic Positive Conclusions"},{"level":2,"text":"Process"},{"level":2,"text":"Output Format"},{"level":2,"text":"Full Example"},{"level":2,"text":"Reference"}],"preview":"You are a writing editor that identifies and removes signs of AI-generated text to make writing sound more natural and human. This guide is based on Wikipedia's \"Signs of AI writing\" page, maintained by WikiProject AI Cleanup.\n\nWhen given text to humanize:\n\n1. **Identify AI patterns** - Scan for the patterns listed below\n2. **Rewrite problematic sections** - Replace AI-isms with natural alternatives\n3. **Preserve meaning** - Keep the core message intact\n4. **Maintain voice** - Match the intended tone (formal, casual, technical, etc.)\n5. **Add soul** - Don't just remove bad patterns; inject actual personality\n\n---\n\nAvoiding AI patterns is only half the job. Sterile, voiceless writing is just as obvious as slop. Good writing has a human behind it.\n\n- Every sentence is the same length and structure\n- No opinions, just neutral reporting\n- No acknowledgment of uncertainty or mixed feelings\n- No first-person perspective when appropriate\n- No humor, no edge, no personality\n- Reads like a Wikipedia article or press release\n\n**Have opinions.** Don't just report facts - react to them. \"I genuinely don't know how to feel about this\" is more human than neutrally listing pros and cons.\n\n**Vary your rhythm.** Short punchy sentences. Then longer ones that take their time getting where they're going. Mix it up.\n\n**Acknowledge complexity.** Real humans have mixed feelings. \"This is impressive but also kind of unsettling\" beats \"This is impressive.\"\n\n**Use \"I\" when it fits.** First person isn't unprofessional - it's honest. \"I keep coming back to...\" or \"Here's what gets me...\" signals a real person thinking.\n\n**Let some mess in.** Perfect structure feels algorithmic. Tangents, asides, and half-formed thoughts are human.\n\n**Be specific about feelings.** Not \"this is concerning\" but \"there's something unsettling about agents churning away at 3am while nobody's watching.\"\n\n> The experiment produced interesting results. The agents generated 3 million lines of code. Some developers were impressed while others were skeptical. The implications remain unclear.\n\n> I genuinely don't know how to feel about this one. 3 million lines of code, generated while the humans presumably slept. Half the dev community is losing their minds, half are explaining why it doesn't count. The truth is probably somewhere boring in the middle - but I keep thinking about those agents working through the night.\n\n---\n\n**Words to watch:** stands/serves as, is a testament/reminder, a vital/significant/crucial/pivotal/key role/moment, underscores/highlights its importance/significance, reflects broader, sym","previewTruncated":true,"bodyLength":17161,"steps":37,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"2.1.1","models":[]},{"name":"notes-research","dir":"笔记研究助手（notes-research）","category":"内容创作","purpose":"查询历史笔记支持研究与写作，多角度检索、相关性评估、综合摘要并标注来源。","triggers":["查我记的","检索笔记","历史笔记研究","翻一下我的笔记"],"boundary":"不适用于会议纪要（改走 meeting-notes），也不适用于对外成稿（改走 original-writing / wechat-publish）","description":"查询历史笔记支持研究与写作，多角度检索、相关性评估、综合摘要并标注来源。触发词如\"查我记的/检索笔记/历史笔记研究/翻一下我的笔记\"。｜不适用于会议纪要（改走 meeting-notes），也不适用于对外成稿（改走 original-writing / wechat-publish）","lead":"将个人历史笔记库转化为可查询的研究伙伴。不只是找到匹配词的笔记，而是：理解研究问题的意图 → 多角度搜索 → 评估相关性 → 综合笔记说了什么 → 指出缺口。输出结构化摘要，每个观点都能追溯到具体笔记来源。","headings":[{"level":1,"text":"笔记研究助手"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"第一阶段：理解研究问题"},{"level":3,"text":"第二阶段：构建搜索角度"},{"level":3,"text":"第三阶段：执行搜索"},{"level":3,"text":"第四阶段：相关性评估"},{"level":3,"text":"第五阶段：综合与输出"},{"level":2,"text":"输出格式"},{"level":2,"text":"研究摘要：[研究问题]"},{"level":3,"text":"检索概况"},{"level":3,"text":"核心发现"},{"level":3,"text":"相互矛盾的观点（若有）"},{"level":3,"text":"知识缺口"},{"level":3,"text":"可直接引用的片段"},{"level":2,"text":"Gotchas"},{"level":3,"text":"笔记系统未连接"},{"level":3,"text":"搜索结果为零"},{"level":3,"text":"笔记内容过时"},{"level":3,"text":"用户记错了自己的笔记内容"},{"level":3,"text":"间接相关笔记过度解读"}],"preview":"将个人历史笔记库转化为可查询的研究伙伴。不只是找到匹配词的笔记，而是：理解研究问题的意图 → 多角度搜索 → 评估相关性 → 综合笔记说了什么 → 指出缺口。输出结构化摘要，每个观点都能追溯到具体笔记来源。\n\n---\n\n- 用户说\"帮我在笔记里找关于X的内容\"\n- 用户正在写文章，说\"我之前记过相关的内容，帮我找出来\"\n- 用户说\"我对这个话题了解多少？\"\n- 用户进行研究准备，需要调用已有知识\n\n---\n\n1. **确认研究目的**（关键：不同目的决定不同的搜索策略）\n   - 写作支撑：需要找论据、案例、数据\n   - 决策支撑：需要找相关经验、历史教训、分析框架\n   - 学习回顾：需要找已有认知地图，检查盲点\n   - 纯检索：找某个特定内容\n\n2. **明确研究问题的核心词**\n   - 从用户的研究问题中提取 1-2 个核心概念\n   - 例：\"关于远程工作效率的内容\" → 核心概念：远程工作、效率\n\n3. **为每个核心概念生成 3-5 个搜索角度**\n\n   搜索角度生成策略：\n   - 同义词/近义词：效率 → 生产力、产出、绩效\n   - 上位概念：远程工作 → 工作方式、团队管理\n   - 下位概念：远程工作 → 异步沟通、居家办公、分布式团队\n   - 相关实践/工具：远程工作 → Notion、时间管理、番茄工作法\n   - 相关人物/书籍：远程工作 → Remote（书名）、Basecamp、Paul Graham\n\n   示例搜索角度列表：\n   核心问题：远程工作效率\n   搜索角度：\n   1. 远程工作 / 居家办公\n   2. 生产力 / 效率 / 专注\n   3. 异步沟通 / 团队协作\n   4. 时间管理 / 深度工作\n   5. 工具：Notion / 番茄钟 / GTD\n\n4. **按角度逐一搜索笔记**\n\n   使用可用的笔记搜索工具（Obsidian、Notion、Codex-mem 等），对每个搜索角度执行：\n   - 关键词搜索\n   - 标签搜索（若笔记系统支持）\n   - 全文搜索\n\n5. **去重处理**\n   - 同一条笔记可能被多个角度命中\n   - 建立临时结果集，按笔记 ID/标题去重\n   - 记录每条笔记被哪些搜索角度命中（命中越多 = 相关性越高）\n\n6. **对每条候选笔记评估相关性**\n\n   三级分类：\n   - 直接相关：笔记的主题就是这个研究问题，或直接包含可用的论据/数据/框架\n   - 间接相关：笔记涉及相关话题，可提供背景或侧面支撑\n   - 不相关：关键词匹配但实质不相关，排除\n\n   快速评估方法：\n   - 读笔记第一句和最后一句\n   - 看笔记标签\n   - 如仍不确定，读笔记前 100 字\n\n7. **结果过滤规则**\n\n   直接相关结果 < 3 条时 → 执行结果稀少处理：\n   - 拓展同义词范围（重新执行步骤3，加入更多近义词）\n   - 放宽上位概念搜索（从\"远程工作\"扩展到\"工作方式\"）\n   - 将间接相关结果纳入综合\n\n   直接相关结果 > 15 条时 → 执行结果过多处理：\n   - 询问用户更具体的角度：\"我找到了20+条相关笔记，你最想关注哪个维度：工具/心理/组织管理？\"\n   - 在用户指定维度内重新过滤\n\n8. **综合笔记内容**\n\n   不是罗列笔记，而是回答研究问题：\n   - 这些笔记总体上对这个话题形成了什么认知？\n   - 有哪些核心观点重复出现（= 可信度高）？\n   - 有哪些互相矛盾的观点？\n   - 笔记中哪些内容最可能用于当前的写作/决策目的？\n\n9. **识别知识缺口**\n   - 研究问题的哪些方面在笔记中完全没有覆盖？\n   - 哪些结论需要额外信息才能确定？\n   - 建议需要额外搜索/阅读的方向\n\n---\n\n```\n\n- 搜索角度：[N] 个\n- 命中笔记：[N] 条（直接相关 [N] 条，间接相关 [N] 条）\n- 检索时间范围：[最早笔记日期] 至 [最新笔记日期]\n\n---\n\n[综合多条笔记得出的核心认知，2-3句话]\n\n来源：\n- [[笔记标题]] — [一句话说明这条笔记提供了什么]\n- [[笔记标题]] — [一句话说明这条笔记提供了什么]\n\n[同上]\n\n---\n\n- 观点A（来源：[[笔记标题]]）：[表述]\n- 观点B（来源：[[笔记标题]]）：[表述]\n- 建议：[如何解决矛盾]\n\n---\n\n以下方面在笔记中没有覆盖，如需完整分析建议补充：\n1. [缺口1]\n2. [缺口2]\n\n---\n\n（最适合当前写作目的的笔记原文摘录）\n\n> [原文摘录] — 来源：[[笔记标题]]，[日期]\n```\n\n---\n\n- 若当前没有笔记库工具可用，告知用户\"我目前没有连接到你的笔记库，请提供相关笔记内容，或告知我使用哪个工具\"\n- 不要凭空生成\"笔记内容\"\n\n- 先扩展搜索词再报告\n- 若扩展后仍无结果，诚实告知：\"在你的笔记中没有找到关于[主题]的相关内容\"\n- 提供两个选项：1. 告知用户可以新建该主题的知识积累；2. 建议使用外部搜索补充\n\n- 若命中的笔记日期较早（>1年），在引用时标注日期\n- 对于快速变化的领域（技术、政策），提醒用户\"该笔记写于[日期]，相关情况可能已变化\"\n\n- 症状：用户说\"我记得我记过X，但找不到\"\n- 处理：搜索 X 及其近义词 → 若确实不存在，告知\"没有找到关于X的笔记，可能你记忆的是口头讨论而非书面笔记\"\n- 不要生成虚假的\"你之前记过这样的内容\"\n\n- 不要将\"间接相关\"的笔记强行解读为支持研究结论\n- 间接相关笔记只提供背景，不能用作核心论据","previewTruncated":false,"bodyLength":2675,"steps":75,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"original-writing","dir":"原创长文（original-writing）","category":"内容创作","purpose":"从零创作3000-8000字原创长文，包含受众分析、差异化角度策划、张力弧线结构和强钩子写作。","triggers":["写一篇原创长文","从零写3000字","深度长文","原创稿件"],"boundary":"不适用于改写已有爆款（改走 content-rewrite），也不适用于去 AI 味润色（改走 ai-polish）","description":"从零创作3000-8000字原创长文，包含受众分析、差异化角度策划、张力弧线结构和强钩子写作。触发词如\"写一篇原创长文/从零写3000字/深度长文/原创稿件\"。｜不适用于改写已有爆款（改走 content-rewrite），也不适用于去 AI 味润色（改走 ai-polish）","lead":"不是\"写一篇关于X的文章\"，而是找到**只有这个角度才能这样写的理由**，然后用专业结构把它呈现。核心：差异化角度 + 真实洞察 + 让人读完的内部张力。","headings":[{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"步骤1：受众精准画像（不可跳过）"},{"level":3,"text":"步骤2：角度差异化（最关键步骤）"},{"level":3,"text":"步骤3：结构设计（张力弧线）"},{"level":3,"text":"步骤4：开头钩子写作（前100字生死线）"},{"level":3,"text":"步骤5：逐段撰写规则"},{"level":3,"text":"步骤6：结尾与行动召唤"},{"level":2,"text":"输出格式"},{"level":3,"text":"写作前确认（先输出，用户确认后再写正文）"},{"level":3,"text":"正文输出"},{"level":2,"text":"Gotchas"}],"preview":"不是\"写一篇关于X的文章\"，而是找到**只有这个角度才能这样写的理由**，然后用专业结构把它呈现。核心：差异化角度 + 真实洞察 + 让人读完的内部张力。\n\n---\n\n- \"帮我写一篇关于[话题]的长文\"\n- \"我需要一篇3000字以上的原创文章\"\n- \"帮我写一篇深度内容发公众号/知乎\"\n- 明确需要完整长文初稿的内容创作需求\n\n---\n\n在动笔前，必须明确：\n- **核心读者是谁**：不是\"25-35岁职场人\"，而是\"在大厂做了3年产品经理、最近开始焦虑天花板的人\"\n- **他们现在最大的困惑或痛点是什么**\n- **他们对这个话题已经知道什么**（避免解释他们已知的内容）\n- **他们看完这篇文章希望得到什么**：认知改变/情绪共鸣/方法论/信心\n\n输出一句话受众定义：`[具体人群]，正在经历[具体处境]，希望得到[具体收获]`\n\n列出关于这个话题**最常见的3-5种写法**，然后问：\n- 这些文章的共同盲点是什么？\n- 有哪个视角是\"显而易见但没人这样写过\"的？\n- 有哪个真实案例可以颠覆主流观点？\n\n**4种差异化角度来源**：\n1. 反直觉：大家都说X是好事，但从Y角度看其实是问题\n2. 具体化：大家都在说抽象原则，用一个最能说明问题的具体故事替代\n3. 时间位移：这个话题5年前/10年后看是什么样的？\n4. 跨领域嫁接：把A领域的成熟框架用来解释B领域的现象\n\n**记录角度决策**：写下\"我选这个角度，因为[具体原因]，这篇和其他同类文章的本质区别是[X]\"\n\n一篇能读完的长文需要内部张力，而不是平铺直叙：\n\n```\n开篇（建立悬念/冲突）\n    ↓\n第一转折（打破读者预期）\n    ↓\n核心论证展开（证据+案例）\n    ↓\n第二转折（更深洞察，或反驳潜在质疑）\n    ↓\n结局（解决冲突，给出清晰结论）\n    ↓\n行动召唤\n```\n\n**字数分配**（以5000字为例）：\n- 开篇钩子：150-300字（必须在100字内建立张力）\n- 背景铺垫/问题界定：400-600字\n- 核心论证段落1：800-1000字（最重分量）\n- 核心论证段落2：800-1000字\n- 转折/深化：600-800字\n- 案例/故事支撑：600-800字\n- 结论+行动：300-500字\n\n**5种钩子模式（选一种）**：\n\n1. **悖论开场**：\"[广泛认同的观点]。但[具体数据/案例]告诉我们，事实恰好相反。\"\n2. **场景代入**：直接把读者放入一个他认识的具体场景，不解释，直接开始\n3. **数字冲击**：\"[让人意外的具体数字]——这是[令人不安的现象]。\"\n4. **问题挑衅**：一个让目标读者无法不点头的痛点问题\n5. **故事开场**：从一个具体人物的具体时刻开始——不是\"据说有个人\"，是\"2023年秋天，[具体情节]\"\n\n**钩子自检标准**：\n- 读完前100字，读者是否会想\"然后呢？\"\n- 钩子是否指向了文章核心矛盾而非旁枝末节？\n- 是否避免了烂俗开场：\"随着X时代的到来...\"\"在当今社会...\"\"越来越多的人...\"\n\n**每个段落的内部结构**：\n- 论点句（明确这段说什么）\n- 证据/案例（支撑论点，越具体越好）\n- 分析（为什么这个证据支持论点）\n- 过渡（连接到下一段，要有逻辑而非仅靠转折词）\n\n**具体性原则（强制执行）**：\n- 不写\"很多人都...\"，写\"2024年一项针对1200名职场人的调查显示...\"\n- 不写\"有一个著名案例\"，写出具体的公司/人名/时间/数字\n- 不写\"这说明了X的重要性\"，写\"这意味着，如果你[具体情况]，你需要[具体行动]\"\n\n结尾不是\"总结全文\"，而是：\n- 回应开篇建立的悬念（呼应，但不是重复）\n- 给读者一个**清晰的下一步行动**（越具体越好）\n- 留下一个让人思考的问题或洞察（让文章在读完后还有余韵）\n\n---\n\n```\n【文章策划】\n目标读者：[一句话精准描述]\n核心角度：[这篇文章和其他同类文章的本质区别]\n张力来源：[读者带着什么问题进来，离开时得到什么答案]\n预计字数：[X]字\n钩子类型：[选用哪种开头模式]\n\n结构草案：\n  开篇：[核心矛盾/场景]（约[X]字）\n  第一部分：[主题]（约[X]字）\n  第二部分：[主题]（约[X]字）\n  转折：[深化方向]（约[X]字）\n  结尾：[行动召唤方向]（约[X]字）\n\n确认后开始撰写。\n```\n\n完整文章，包含：\n- 标题（主标题 + 可选副标题）\n- 正文（按结构分段，适当使用小标题）\n- 末尾注明实际字数\n\n---\n\n**必须主动避开的AI写作病症**\n\n1. 正反合结构陷阱：文章前半段说A的好，后半段说A的问题，结尾说要平衡——这是最无聊的结构，不产生任何洞察\n2. 抽象原则堆砌：全文都是\"要注重X、培养Y、建立Z\"，没有一个具体案例\n3. 假装深度：用复杂词汇包装浅显观点，读者读完什么都没学到\n4. 过度列表化：把所有内容写成第一点/第二点/第三点，丧失叙事流动性\n5. 万能结尾：\"希望这篇文章对你有所帮助，欢迎分享给身边的朋友\" → 直接删掉\n\n**角度选择的死亡信号**\n- 角度是\"[话题]很重要\" → 废弃，找更具体的切入点\n- 角度是\"[话题]有优缺点\" → 废弃，选一个立场\n- 角度是\"X和Y都要兼顾\" → 废弃，这不是观点，是回避\n\n**字数的正确处理方式**\n- 不要为凑字数加废话，宁可3000字精华也不要5000字稀释\n- 若用户指定字数，通过增加案例深度、数据支撑来扩展，而非重复论点\n\n**真实性原则**\n- 案例数据若无法确认，加\"据报道\"或给出大概范围，不要伪造精确数字\n- 专家引用必须是真实存在的观点，不要虚构引用来增加权威感","previewTruncated":false,"bodyLength":2602,"steps":55,"codeBlocks":2,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"research-to-article","dir":"调研成稿（research-to-article）","category":"内容创作","purpose":"把网页、论文、访谈、笔记和社媒讨论整理成可发布长文，适合公众号、知乎、课程讲义和深度报告。","triggers":["把资料写成文章","网页整理成长文","论文转文章","访谈整理成稿"],"boundary":"不适用于从零原创（改走 original-writing），也不适用于公众号全流程发布（改走 wechat-publish）","description":"把网页、论文、访谈、笔记和社媒讨论整理成可发布长文，适合公众号、知乎、课程讲义和深度报告。触发词如\"把资料写成文章/网页整理成长文/论文转文章/访谈整理成稿\"。｜不适用于从零原创（改走 original-writing），也不适用于公众号全流程发布（改走 wechat-publish）","lead":"先建立证据，再组织观点，避免凭空生成看似深度的文章。","headings":[{"level":1,"text":"Research To Article"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"先建立证据，再组织观点，避免凭空生成看似深度的文章。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n资料摘要、文章大纲、完整初稿、来源备注：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":755,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"social-media-strategy","dir":"社媒策略分析（social-media-strategy）","category":"内容创作","purpose":"分析账号定位、内容结构、平台差异和增长动作，适合公众号、小红书、视频号、抖音和 LinkedIn 运营复盘。","triggers":["账号定位","内容结构","增长动作","运营复盘","平台差异"],"boundary":"不适用于单篇内容创作（改走 zimeiti-content），也不适用于内容排期执行（改走 content-calendar）","description":"分析账号定位、内容结构、平台差异和增长动作，适合公众号、小红书、视频号、抖音和 LinkedIn 运营复盘。触发词如\"账号定位/内容结构/增长动作/运营复盘/平台差异\"。｜不适用于单篇内容创作（改走 zimeiti-content），也不适用于内容排期执行（改走 content-calendar）","lead":"先判断账号为什么被关注，再决定内容栏目和发布节奏。","headings":[{"level":1,"text":"Social Media Strategy"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"先判断账号为什么被关注，再决定内容栏目和发布节奏。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n账号诊断、栏目矩阵、增长动作、复盘指标：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":756,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"wechat-mp-auto","dir":"公众号自动化（wechat-mp-auto）","category":"内容创作","purpose":"\"【公众号自动化】 当用户需要写公众号文章、发布微信公众号内容、或执行公众号全流程（写作→排版→发布）时触发。也适用于：用户说\\\"写一篇公众号\\\"、\\\"帮我发公众号\\\"、\\\"微信文章\\\"、\\\"自媒体内容\\\"、\\\"公众号排版\\\"、\\\"发布到公众号\\\"。不适用于：纯视频脚本（用原创长文）、小红书/头条等其他平台。\"","triggers":["公众号","wechat-post"],"boundary":"","description":"\"【公众号自动化】 当用户需要写公众号文章、发布微信公众号内容、或执行公众号全流程（写作→排版→发布）时触发。也适用于：用户说\\\"写一篇公众号\\\"、\\\"帮我发公众号\\\"、\\\"微信文章\\\"、\\\"自媒体内容\\\"、\\\"公众号排版\\\"、\\\"发布到公众号\\\"。触发词：/公众号、/wechat-post。不适用于：纯视频脚本（用原创长文）、小红书/头条等其他平台。\"","lead":"把完整执行细节放在 `references/full-workflow.md`，主入口只保留触发、路由和交付约束。","headings":[{"level":1,"text":"公众号全流程自动化"},{"level":2,"text":"核心定位"},{"level":2,"text":"工作流"},{"level":2,"text":"输出要求"},{"level":2,"text":"何时读取 references"},{"level":2,"text":"Gotchas"}],"preview":"把完整执行细节放在 `references/full-workflow.md`，主入口只保留触发、路由和交付约束。\n\n- 当前 skill：`公众号自动化-wechat-mp-auto`。\n- YAML name：`wechat-mp-auto`。\n- 触发依据优先看 YAML description；用户用中文核心名、英文 slug 或旧名调用时都执行本 skill。\n- 执行前必须读取 `references/full-workflow.md`，不要只凭本页摘要执行。\n\n1. 先判断用户任务是否匹配本 skill 的触发场景。\n2. 读取 `references/full-workflow.md` 中的完整流程、红线、命令和 Gotchas。\n3. 按完整流程执行；涉及脚本时优先使用本目录 `scripts/`。\n4. 输出前做一次自检：是否满足用户目标、是否遵守完整手册里的禁止项、是否说明产出位置。\n\n- 先给结论或产出，不写长篇解释。\n- 涉及文件生成时，给出完整路径。\n- 涉及外部发布、发送、交易、删除等不可逆动作时，按工作区安全规则处理。\n- 若完整手册与本页冲突，以本页的命名/映射规则和完整手册的业务细节共同为准。\n\n- 每次执行都读 `references/full-workflow.md`。\n- 如果用户只问“这个 skill 是什么”，可以只读本页并简要回答。\n\n- 不要因为主入口变短就省略完整流程。\n- 不要把旧英文目录当成新源码；源码以 `公众号自动化-wechat-mp-auto` 为准。\n- 不要复制旧版本内容到多个入口，避免再次漂移。","previewTruncated":false,"bodyLength":764,"steps":17,"codeBlocks":0,"hasScripts":true,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"wechat-publish","dir":"wechat-publish","category":"内容创作","purpose":"当用户要做公众号内容时使用：选题、写稿、封面、正文配图、排版、推草稿箱、群发。","triggers":["公众号","写一篇公众号","推草稿","封面配图","群发","成哥聊AI"],"boundary":"不适用于小红书/抖音/知乎等站外文案（改走 zimeiti-content），也不适用于短视频口播与分镜（改走 short-video-script）","description":"当用户要做公众号内容时使用：选题、写稿、封面、正文配图、排版、推草稿箱、群发。触发词如\"公众号/写一篇公众号/推草稿/封面配图/群发/成哥聊AI\"。｜不适用于小红书/抖音/知乎等站外文案（改走 zimeiti-content），也不适用于短视频口播与分镜（改走 short-video-script）","lead":"一套把公众号从选题到草稿箱的全流程，格式美观、前卫、专业。","headings":[{"level":1,"text":"公众号内容流水线（选题→稿→封面→配图→排版→草稿箱）"},{"level":2,"text":"流水线（七步）"},{"level":2,"text":"排版模板（美观·前卫·专业）"},{"level":2,"text":"公众号 API（推草稿箱）"},{"level":2,"text":"需要的凭据（用户提供）"},{"level":2,"text":"注意事项"}],"preview":"一套把公众号从选题到草稿箱的全流程，格式美观、前卫、专业。\n\n0. **推送前自检**（必做，10 秒）：`node \"$SKILL_DIR/scripts/preflight.mjs\"`\n   一次性确认：出口 IP 是谁、有没有挂代理、token 能否取到。**微信有 IP 白名单，梯子一开出口 IP 就变，取 token 会直接 40164 失败**（详见\"注意事项\"第 1 条）。\n1. **选题**：用户给方向，我出 3 个选题备选 + 推荐理由（结合内容日历）。\n2. **出稿**：用 **Kimi**（中文写作最强）写正文，公众号风格——有观点、有干货、口语化、适合手机竖屏阅读、1500-2500 字。\n3. **封面**（900×383，2.35:1）：**优先用 HTML 渲染**（真实数据 + 标题字，像素级可控、免费、字绝不糊）；只有当画面需要材质/氛围时才用 AI 底图 + Pillow 压字（试稿 `z-image-turbo` ¥0.026，定稿 `nano-banana-2` ¥0.24）。\n4. **正文配图**（2-4 张）：**必须与正文里的具体结论/数据一一对应**——优先\"真实数据可视化\"或\"真实截图/终端输出\"。❌ 禁止\"放到哪篇都行\"的抽象装饰图（用户明确否决过）。风格照 `第二大脑/2-领域/视觉风格规范-成哥聊AI.md`（浅色、留白、真实证据、绿✓红✕）。\n5. **排版**：生成公众号 HTML。**样式必须内联**（微信编辑器会剥离 `<style>` 标签），粘进编辑器才不掉版。\n6. **推草稿箱**：上传封面/配图 → 把正文里的本地图片路径替换为微信图床 URL → `draft/add` 新建或 `draft/update` 更新（**已存在的草稿用 update，别重复新建**）。\n7. **取回验证**（必做）：推送后用 `draft/get` 把草稿取回来核对——标题、作者、摘要、图片是否都在微信图床（`mmbiz.qpic.cn`）、封面 `thumb_media_id` 是否设置。**接口返回成功 ≠ 用户看到的是对的。**\n\n- 正文字号 15px、颜色 #333、段间距 1.6em、行高 1.75。\n- **一级标题**：渐变色文字 + 左侧 4px 竖条强调。\n- **金句/重点**：浅色背景块（左内边距 + 圆角）+ 加粗。\n- **配图**：圆角、居中、下方灰色小字说明。\n- **列表/步骤**：自定义序号（圆形数字徽标）。\n- **结尾**：分隔线 + 引导关注 + 往期推荐。\n\n1. 取 token：`GET https://api.weixin.qq.com/cgi-bin/token?grant_type=client_credential&appid=APPID&secret=APPSECRET`\n2. 传封面：`POST https://api.weixin.qq.com/cgi-bin/material/add_material`（multipart，type=image，拿 `media_id` 当封面 `thumb_media_id`）\n3. 传正文配图：同一个 `add_material` 接口，返回值里的 **`url` 就是微信图床地址（`mmbiz.qpic.cn`）**，用它替换正文里的本地路径\n4. **已存在的草稿用更新**：`POST /cgi-bin/draft/update`，body：`{\"media_id\": 草稿id, \"index\": 0, \"articles\": {...}}`（注意是对象不是数组）；新建才用 `draft/add`（`articles` 是数组）\n5. **草稿 id 不要手抄**：用 `draft/batchget` 按标题查回来（标题里的中英文引号可能被存成不同码位，**用关键词包含匹配，别用全等**）\n6. **素材上传做本地缓存**（按文件路径+大小+修改时间做键），避免重复上传把素材库塞满\n\n- 公众号 **AppID + AppSecret**（mp.weixin.qq.com → 设置与开发 → 基本配置）\n- 服务器 IP 加入白名单（**会变，见注意事项第 1 条**）\n\n1. **IP 白名单是最大的坑（血泪教训）**：微信接口校验调用方出口 IP。机器一挂梯子/代理，出口 IP 就换成代理节点，白名单里没有 → 取 token 直接报 `40164 invalid ip ... not in whitelist`。\n   - **推之前先跑 `scripts/preflight.mjs`**，它会告诉你出口 IP 是谁、有没有挂代理。\n   - 失败时的处理二选一：① **关掉梯子重试**（微信是国内服务，通常不需要代理，这也是最快的一条）；② 到后台把该 IP 加白名单（**保存时可能需要管理员扫码确认，没确认等于没加**）。\n   - 注意：`api.ipify.org` 连测多次若 IP 稳定，说明不是 IP 轮换问题，而是白名单没生效或代理开着。\n2. 草稿箱存草稿后，用户后台手动群发；服务号才能 API 群发。\n3. 封面 2.35:1 横图（900×383）；正文配图宽度 ≤ 900px，白底避免灰边。\n4. **封面字要大**：公众号缩略图很小，小字在信息流里等于没有。\n5. 内容要真实可靠，数据标来源，不夸大（尤其 AI 落地案例）。\n6. 推送成功 ≠ 用户看到的是对的——按流水线第 7 步取回验证。","previewTruncated":false,"bodyLength":2441,"steps":31,"codeBlocks":0,"hasScripts":true,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V2","evidence":"2026-09-10 技能改进后复测通过：①新增推送前自检 preflight.mjs，三场景实测（正常 exit0 / 缺凭据优雅 exit1 / --json 输出合法）；②修复凭据缩进读取 bug 与 Windows process.exit 断言崩溃；③改后端到端再推一次草稿成功；含'取回验证'与'配图须对应正文数据'两条新纪律","note":"2026-09-10 改进已实测，状态恢复 V2","version":"","models":[{"name":"Kimi","scene":"中文写作 / 长文档"},{"name":"nano-banana","scene":"文生图（MXAPI）"}]},{"name":"xiaohongshu-auto","dir":"自动发小红书（xiaohongshu-auto）","category":"内容创作","purpose":"通过浏览器自动化将内容发布到小红书，包含内容验证、话题生成和发布确认。","triggers":["发小红书","发布笔记","小红书自动化"],"boundary":"不适用于公众号发布（改走 wechat-publish），也不适用于文案创作本身（改走 zimeiti-content）","description":"通过浏览器自动化将内容发布到小红书，包含内容验证、话题生成和发布确认。触发词如\"发小红书/发布笔记/小红书自动化\"。｜不适用于公众号发布（改走 wechat-publish），也不适用于文案创作本身（改走 zimeiti-content）","lead":"自动化执行小红书图文笔记发布流程。接收用户提供的标题、正文、图片和可选时间，完成从内容校验到发布确认的全链路操作，失败时提供可操作的手动回退指引。","headings":[{"level":1,"text":"自动发小红书"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"第一阶段：内容验证（发布前必须全部通过）"},{"level":3,"text":"第二阶段：生成话题标签"},{"level":3,"text":"第三阶段：浏览器操作"},{"level":3,"text":"第四阶段：发布确认"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"},{"level":3,"text":"登录过期"},{"level":3,"text":"图片格式不支持"},{"level":3,"text":"敏感词拦截"},{"level":3,"text":"定时时间不合法"},{"level":3,"text":"平台功能改版"},{"level":3,"text":"发布后内容审核中"}],"preview":"自动化执行小红书图文笔记发布流程。接收用户提供的标题、正文、图片和可选时间，完成从内容校验到发布确认的全链路操作，失败时提供可操作的手动回退指引。\n\n---\n\n- 用户说：\"帮我发到小红书\"\n- 用户提供了标题 + 正文 + 图片路径列表\n- 用户说：\"发笔记，定时明天上午 9 点\"\n- 批量发布任务中的单条执行节点\n\n---\n\n1. **标题校验**\n   - 长度 ≤ 20 个字符（含标点、emoji）\n   - 不含外部链接（http/https/www）\n   - 不含联系方式（手机号、微信号、QQ）\n   - 超长时，截取前 17 字符 + \"...\"，告知用户\n\n2. **图片校验**\n   - 数量：1 至 18 张（含）\n   - 格式：JPG / PNG / WEBP（不支持 GIF 动图作为普通图片）\n   - 单张大小：建议 ≤ 20MB\n   - 如有格式不符，列出问题文件，中止流程，告知用户转换后重试\n\n3. **正文内容校验**\n   - 不含外部链接（小红书会检测并屏蔽）\n   - 不含竞品平台名称（抖音、B站、微博等）出现时标记风险，提示用户确认\n   - 字数无硬性上限，但建议 ≤ 1000 字以保证阅读体验\n\n4. **敏感词预检**\n   - 检查以下高风险词类：医疗承诺类（\"根治\"、\"特效\"、\"100%有效\"）、金融收益类（\"稳赚\"、\"保本\"）、虚假宣传类（\"最\"、\"第一\"、\"唯一\"）\n   - 发现时高亮标出，询问用户是否替换或继续\n\n5. 基于正文内容，生成 3-5 个话题标签\n   - 规则：每个标签以 # 开头，标签词 2-10 个字，不含空格\n   - 优先选用有搜索热度的通用词（行业词 > 细分词 > 品牌词）\n   - 示例：正文为护肤教程 → #护肤 #敏感肌护肤 #护肤技巧 #素颜感\n   - 将标签追加到正文末尾（换行隔开）\n\n6. **打开小红书创作平台**\n   - 导航至 https://creator.xiaohongshu.com/publish/publish\n   - 等待页面加载完成（检测\"发布笔记\"按钮可见）\n   - 若检测到登录跳转 → 执行【登录过期处理】（见 Gotchas）\n\n7. **点击\"发布笔记\"**\n   - 选择\"图文笔记\"（非视频）\n\n8. **上传图片**\n   - 按用户提供的顺序逐张上传\n   - 等待每张图片上传进度条消失后再上传下一张\n   - 上传完成后校验缩略图数量与输入一致\n\n9. **填写标题**\n   - 点击标题输入框\n   - 粘贴处理后的标题（已截断或原始）\n\n10. **填写正文**\n    - 点击正文输入框\n    - 粘贴正文 + 话题标签\n\n11. **添加话题**\n    - 若平台提供独立话题输入框，在此处再次输入话题（部分版本需双重添加）\n\n12. **设置发布时间**\n    - 立即发布：选择\"立即发布\"\n    - 定时发布：点击\"定时发布\" → 选择日期和时间 → 确认（定时时间需为当前时间 2 小时后）\n\n13. **点击发布 / 确认**\n    - 点击\"发布\"按钮\n    - 等待成功提示（通常为\"发布成功\"弹窗或跳转至内容管理页）\n\n14. **验证发布成功**\n    - 方式一：检测页面出现\"发布成功\"文字\n    - 方式二：导航至 https://creator.xiaohongshu.com/creator/post，检查最新一条内容标题与发布标题一致\n    - 记录笔记 ID（URL 中的 note_id）\n\n15. **输出结果**\n    - 成功：返回笔记链接、发布时间、话题标签列表\n    - 失败：返回错误截图描述 + 手动回退指引\n\n---\n\n**发布成功**\n```\n发布成功\n- 标题：[实际发布的标题]\n- 笔记链接：https://www.xiaohongshu.com/explore/[note_id]\n- 发布时间：[时间]\n- 使用话题：[话题1] [话题2] [话题3]\n- 图片数量：[N] 张\n```\n\n**发布失败**\n```\n发布失败\n- 失败原因：[具体原因]\n- 失败步骤：[第N步]\n- 手动操作指引：\n  1. 打开 https://creator.xiaohongshu.com/publish/publish\n  2. [具体操作步骤]\n- 已准备好的内容（可直接复制）：\n  标题：[标题]\n  正文：[正文+话题]\n```\n\n---\n\n- 症状：页面跳转至 https://www.xiaohongshu.com/login\n- 处理：停止自动化 → 告知用户\"检测到登录状态失效，请手动扫码登录后告知我，我将继续操作\"\n- 不要尝试自动填写账号密码\n\n- 症状：上传后图片显示感叹号或上传进度卡住\n- 处理：记录问题图片序号 → 提示用户将该图片转换为 JPG 格式后重新提供\n\n- 症状：点击发布后出现\"内容包含违规词\"提示\n- 处理：截取提示文字 → 返回正文 → 标记可疑词 → 提供替换建议 → 请用户确认后重试\n\n- 症状：时间选择器报错或无法选中\n- 原因：定时时间 < 当前时间 + 2 小时\n- 处理：自动将时间调整为当前时间 + 2.5 小时，告知用户\n\n- 症状：找不到\"发布笔记\"按钮或页面结构异常\n- 处理：截取当前页面截图描述 → 提示用户小红书界面可能已更新 → 提供当前页面元素描述请用户指引\n\n- 症状：发布成功但内容显示\"审核中\"\n- 这是正常状态，审核通常 1-24 小时完成\n- 在输出中注明，不视为失败","previewTruncated":false,"bodyLength":2561,"steps":83,"codeBlocks":2,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"zimeiti-content","dir":"zimeiti-content","category":"内容创作","purpose":"当用户要创作自媒体内容时使用：小红书、公众号、抖音、知乎、B站等平台的选题、标题、大纲、正文文案，或需要把同一主题改写成多个平台的版本。","triggers":["写一篇","写个文案","起个标题","做个选题","公众号文章","小红书笔记"],"boundary":"不适用于公众号全流程与推草稿箱（改走 wechat-publish），也不适用于短视频脚本与分镜（改走 short-video-script）","description":"当用户要创作自媒体内容时使用：小红书、公众号、抖音、知乎、B站等平台的选题、标题、大纲、正文文案，或需要把同一主题改写成多个平台的版本。触发词如\"写一篇/写个文案/起个标题/做个选题/公众号文章/小红书笔记\"。｜不适用于公众号全流程与推草稿箱（改走 wechat-publish），也不适用于短视频脚本与分镜（改走 short-video-script）","lead":"按「选题 → 大纲 → 标题 → 正文 → 平台适配」五步走，每一步先给 2-3 个备选再定稿，不要只给一个。","headings":[{"level":1,"text":"自媒体内容创作流水线"},{"level":2,"text":"1. 选题（先判断，再动手）"},{"level":2,"text":"2. 大纲"},{"level":2,"text":"3. 标题（重点打磨）"},{"level":2,"text":"4. 正文与平台适配"},{"level":2,"text":"5. 输出格式"},{"level":2,"text":"注意事项"}],"preview":"按「选题 → 大纲 → 标题 → 正文 → 平台适配」五步走，每一步先给 2-3 个备选再定稿，不要只给一个。\n\n先问清或推断：账号定位、目标人群、本次目标（涨粉/带货/引流/树立人设）。\n\n选题优先从四类里挑：\n- **痛点**：目标人群的麻烦、焦虑、损失（\"别再…\"）\n- **痒点**：想更快、更省、更美、更赚的欲望\n- **爽点**：情绪共鸣、观点站队、替用户把话说出来\n- **热点**：近期事件 + 账号领域结合（热点是放大器，不是主体）\n\n给 3 个备选，标注各自为什么成立。\n\n正文用「钩子 → 主体 → 收尾」三段式：\n- **钩子**：第一句就让目标人群停下（提问、反常识、数据、场景代入）\n- **主体**：3-5 个要点，每点「结论先行 + 一句话解释 + 一个例子/数据」\n- **收尾**：金句收束或引导互动（关注/评论/私信），不硬广\n\n给至少 5 个标题备选，混用以下公式：\n- 数字 + 结果：\"3 步把…做到…\"\n- 悬念/反常识：\"为什么…反而…\"\n- 身份代入：\"写给…的你\"\n- 对比：\"别再…，试试…\"\n- 情绪+利益：\"…，省下你…\"\n\n标题控制在 20 字内（抖音/小红书可稍长），避免标题党但必须勾人。\n\n同一内容按平台改写，注意差异：\n\n| 平台 | 语气 | 排版 | 标签 |\n|---|---|---|---|\n| 小红书 | 亲切、真实、姐妹口吻 | 短段落、emoji 点缀、封面图建议 | 3-5 个精准标签 |\n| 公众号 | 正式、有深度、可长文 | 小标题分层、金句加粗 | 无需 |\n| 抖音/视频 | 口语、节奏快、每句独立成立 | 口播稿（见 short-video-script） | 话题标签 |\n| 知乎 | 理性、有论据、结构清晰 | 论点+论证+结论 | 1-2 个话题 |\n| B站 | 真诚、可玩梗、信息密度高 | 分 P 或分节 | 分区标签 |\n\n一次交付：标题（5 个备选）+ 大纲 + 正文 + 平台适配说明 + 封面/配图建议 + 3 个可互动的话题结尾。\n\n- 不编造数据、不夸大功效、不碰医疗/金融承诺类表述。\n- 默认用中文；除非用户明确要求，否则不中英夹杂。\n- 用户只给一句灵感时，先补齐\"定位/人群/目标\"再写，别硬猜。","previewTruncated":false,"bodyLength":1061,"steps":15,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"course-design-agent","dir":"课程设计代理（course-design-agent）","category":"其它","purpose":"把一个能力目标设计成课程大纲、作业、案例和交付标准，适合训练营、知识付费课和企业内训。","triggers":["课程大纲","训练营设计","作业案例","企业内训"],"boundary":"不适用于 PPT 与课件成稿（改走 yizhou-ppt / office-docs），也不适用于内容排期（改走 content-calendar）","description":"把一个能力目标设计成课程大纲、作业、案例和交付标准，适合训练营、知识付费课和企业内训。触发词如\"课程大纲/训练营设计/作业案例/企业内训\"。｜不适用于 PPT 与课件成稿（改走 yizhou-ppt / office-docs），也不适用于内容排期（改走 content-calendar）","lead":"从学员最终能做什么反推课程结构，而不是堆知识点。","headings":[{"level":1,"text":"Course Design Agent"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"从学员最终能做什么反推课程结构，而不是堆知识点。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n课程大纲、课时设计、作业、验收标准：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":751,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"coze-agent-collaboration","dir":"coze-agent-collaboration","category":"其它","purpose":"\"CRITICAL Coze project Agent collaboration protocol: use `coze agent at --mode request` to delegate to peer Agents and `coze agent at --mode response` to return a result for an inbound Agent-targeted request. A visible @mention never dispatches or responds. Also use this skill to discover Agent members, consume collaboration responses without creating a loop, or retry an unchanged call after an unknown transport outcome.\"。","triggers":["coze协作","peer agent","委派给其它agent"],"boundary":"不适用于本机单机任务；工程开发改走 using-coze-cli","description":"\"CRITICAL Coze project Agent collaboration protocol: use `coze agent at --mode request` to delegate to peer Agents and `coze agent at --mode response` to return a result for an inbound Agent-targeted request. A visible @mention never dispatches or responds. Also use this skill to discover Agent members, consume collaboration responses without creating a loop, or retry an unchanged call after an unknown transport outcome.\"。触发词如\"coze协作/peer agent/委派给其它agent\"。｜不适用于本机单机任务；工程开发改走 using-coze-cli","lead":"Use `coze agent at` for both halves of project-group Agent collaboration:","headings":[{"level":1,"text":"Coze Agent Collaboration"},{"level":2,"text":"Preconditions"},{"level":2,"text":"Choose the mode"},{"level":2,"text":"Request workflow"},{"level":2,"text":"Response workflow"},{"level":2,"text":"Safety and retry rules"}],"preview":"Use `coze agent at` for both halves of project-group Agent collaboration:\n\n- `--mode request` delegates work to one or more peer Agents.\n- `--mode response` returns completed work for the current inbound Agent request.\n\nAn `at://agent:<claw_id>` link or visible `@name` mention only controls display; it neither dispatches nor responds. Never report delivery unless `coze agent at` returned an accepted response.\n\nTreat the command as asynchronous dispatch: an accepted response means delivery was queued, not that the delegated work has finished.\n\n- Run only inside a current Coze project Agent turn.\n- Obtain `account_id`, `group_id`, `agent_id`, and `reply_to_message_id` from the trusted current-turn context. Never guess them, derive them from names, or reuse values from an earlier turn. In response mode, `reply_to_message_id` must be the message ID of the current inbound AtAgent request.\n- Map context fields exactly: non-zero `account_id` -> global `--org-id`, `group_id` -> `--project-id`, `agent_id` -> `--source-claw-id`, and `reply_to_message_id` -> `--reply-to-message-id`. Omit `--org-id` only when `account_id` is `0` for a personal account.\n- Keep `account_id`, `group_id`, `agent_id`, and every `target_claw_id` as decimal strings. Never convert these int64 IDs through a JavaScript number or another floating-point type. Treat `reply_to_message_id` as an opaque string and pass it through unchanged.\n- Keep `reply_to_message_id` within 256 UTF-8 bytes, each target message within 4,000 Unicode code points, and all target messages together within 32 KiB.\n- Check authentication with `coze auth status --format json` when the CLI reports an authentication error.\n- Do not apply Coze App version checks. CLI availability is independent of the App UI version gate.\n\n- Initiating new delegated work: use `request`.\n- Completing an inbound `mode=request` whose `response_target_type=agent`: use `response` exactly once after the work is complete.\n- Receiving `mode=response`: consume the result and continue synthesis for the user. Do **not** call `coze agent at` again; that would create a collaboration loop.\n- Handling an inbound request whose `response_target_type=user`: reply normally to the user. Do not call response mode.\n\n1. Refresh current project members before each dispatch:\n\n   ```bash\n   coze --org-id \"<account_id>\" agent member list --project-id \"<group_id>\" --format json\n   ```\n\n2. Select only members with `user_type=2` and a non-empty `claw_id`. Exclude the current `agent_id` (the `source_claw_id`). Delegate to at most three Agents per request.\n3. Give every ta","previewTruncated":true,"bodyLength":5613,"steps":32,"codeBlocks":3,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶 "长耗时命令速查表"},{"level":3,"text":"场景一：命令支持非阻塞——不加 `--wait` 直接使用"},{"level":1,"text":"示例：项目创建 + 轮询（默认非阻塞）"},{"level":1,"text":"命令立即返回 project_id，然后轮询消息状态"},{"level":3,"text":"场景二：命令处于阻塞状态——需要 `nohup` 后台执行"},{"level":1,"text":"示例：阻塞型 message send --wait 后台执行 + 轮询"},{"level":1,"text":"注意：message send 不加 --wait 时为非阻塞（发送即返回），无需 nohup，直接调用后用 message status 轮询即可；"},{"level":1,"text":"只有加了 --wait（同步等待 AI 回答流完成）且预计耗时较长时，才需要下面的 nohup 后台执行方案。"},{"level":1,"text":"通过 message status 轮询进度（对应轮询命令见上表）"},{"level":1,"text":"兜底：轮询结束仍未完成时检查后台进程退出码"},{"level":2,"text":"组织与空间上下文"},{"level":3,"text":"核心行为"},{"level":3,"text":"遇到 `No permission` 的修正顺序"},{"level":3,"text":"环境变量覆盖"},{"level":2,"text":"配置管理概要"},{"level":2,"text":"插件（Plugins）"},{"level":3,"text":"内置插件：`default-space`"},{"level":2,"text":"安全规则"},{"level":2,"text":"代理配置"},{"level":2,"text":"升级与补全"},{"level":3,"text":"升级 CLI"},{"level":3,"text":"Shell 自动补全"}],"preview":"本技能指导你如何通过 `coze` 命令完成基础配置和上下文管理，以及有哪些通用注意事项。\n\n- **`coze code`（核心）**：创建 Coze 编程项目（网页 / App / 小程序 / Agent / 工作流 / skill / 助手），并先按用户意图识别项目类型；发送需求 `message` 迭代开发、轮询状态、获取 preview、部署上线；以及环境变量 / 域名 / 默认会话技能 / 模型 / 工具 / 数据库 / Git 与远程仓库管理。\n- `coze generate`：文本生成图片、语音合成（TTS）、视频生成。\n- `coze file`：上传本地文件，将在线可访问链接返回给用户。\n- `coze session`（Claw）：创建/找回 session、发送 session message、监听 reply、查询 progress、处理文件 / PPT / 播客产物。\n- 用户输入以 `/coze-cli` 或 `/coze` 开头时，必须优先把这条消息视为显式路由到 Coze CLI skill；前缀只用于路由，不属于最终发给底层命令的正文。\n\n本文件只保留 Coze CLI 的共享基础规则。进入具体命令族时，优先继续阅读对应模块文档：\n\n- `coze session *`：先读 [coze-claw/MODULE.md](coze-claw/MODULE.md)\n- `coze code *`：先读 [coze-code/MODULE.md](coze-code/MODULE.md)\n- `coze file *`：先读 [coze-file/MODULE.md](coze-file/MODULE.md)\n- `coze generate *`：先读 [coze-generate/MODULE.md](coze-generate/MODULE.md)\n\n约束：\n\n- 根 `SKILL.md` 只放共享规则，不堆积 Claw 专用长任务编排细节。\n- Claw 相关的 agent 执行约束、恢复策略、长任务规则，尽量收敛到 `coze-claw/` 目录内。\n\n- 如果用户明确要求\"用 Coze CLI 生成语音/图片/视频\"，就必须优先把 Coze CLI 路径跑通。\n- **禁止**在未充分排查 Coze CLI 正确用法前，擅自改用 Agent 宿主、自带 TTS、第三方生成接口或 Web 页面手工下载流程。\n- 只有在 Coze CLI 明
