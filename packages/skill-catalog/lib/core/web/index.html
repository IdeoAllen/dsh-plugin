ame / transform); and reuse assets across projects. Also use for vague feedback that real footage looks dark, flat, boring, should feel retro/camcorder/print/ASCII, needs privacy, or needs a media reveal.","lead":"The media OS for HyperFrames: resolve · generate · operate · remember — every media type, one skill, zero context noise.","headings":[{"level":1,"text":"media-use"},{"level":2,"text":"Resolve — the one verb"},{"level":2,"text":"Treat broad visual feedback as media intent"},{"level":2,"text":"Be proactive — run a media opportunity pass"},{"level":2,"text":"Where to look — read only the file your task needs"}],"preview":"The media OS for HyperFrames: resolve · generate · operate · remember — every media type, one skill, zero context noise.\n\nFirst run: install and sign in to the `heygen` CLI (the free-usage path), then verify with `node <SKILL_DIR>/scripts/resolve.mjs --doctor`. Setup and providers: `references/setup-providers.md`.\n\n```bash\nnode <SKILL_DIR>/scripts/resolve.mjs --type <type> --intent \"<description>\" --project <dir>\n```\n\nReturns one line: `resolved <id> → <path> (<type>, <metadata>)`. All search noise stays on disk.\n\n| Type    | One-line intent                                                                     |\n| ------- | ----------------------------------------------------------------------------------- |\n| `bgm`   | background music (HeyGen catalog, 10k+ tracks)                                      |\n| `sfx`   | sound effects (bundled 19-file library + catalog)                                   |\n| `image` | photos, backgrounds (HeyGen asset search, 75k+ vectors)                             |\n| `icon`  | icons, symbols (transparent)                                                        |\n| `logo`  | official brand marks (svgl → simple-icons → GitHub avatar → favicon; never redrawn) |\n| `voice` | TTS voiceover (HeyGen free-usage path; optional local Kokoro)                       |\n| `grade` | measured correction candidate; broad polish/stylization follows Media Treatments    |\n| `lut`   | user-provided or explicitly chosen reusable validated `.cube` file                  |\n\nBefore resolving fresh, list reusable candidates with `--candidates` and judge fit yourself — reuse rules, all flags, ingest (`--from`), and adopt are in `references/resolve.md`.\n\nWhen a user explicitly asks to fix, polish, stylize, obscure, emphasize, or\nreveal photographic media, read `references/media-treatments.md` even if they\ndo not name color grading or an effect. Inspect the real `<img>`/`<video>`,\nchoose one primary intent, then use deterministic persistence and verification.\nUse a matching recipe as an optional tested seed, or inspect\n`hyperframes media-treatment --capabilities --json`, then request one relevant\nfamily/effect with `--capability <id>` and assemble a custom treatment from\ncanonical controls. Never load `--all` for ordinary authoring. A treatment may\ncompose correction, a preset, finishing, compatible shader effects, supported\nkeyframes, and optional Registry overlays. Add only source-justified bounded\ntuning and compatible parts, never effects merely to make the result look more\nsophisticated. Persist the final combined payload with\n`hyperframes media-treatm","previewTruncated":true,"bodyLength":7279,"steps":0,"codeBlocks":1,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"motion-graphics","dir":"motion-graphics","category":"视频与音频","purpose":"A short, design-led motion graphic where motion is the message — kinetic typography, stat count-up, chart/data-viz hit, logo sting / brand lockup, lower-third / callout / social overlay, animated map (highlight regions, connect places, zoom to a location), animated tweet / news-article / headline, webpage / UI animation (scroll, cursor, callouts), or fusing a real image's geometry into a chart. Usually under 10s (up to ~30s), no narration or live-action subject; renders to MP4 or transparent overlay. Longer / narrated / multi-scene → /general-video. Unclear → /hyperframes.","triggers":[],"boundary":"","description":"A short, design-led motion graphic where motion is the message — kinetic typography, stat count-up, chart/data-viz hit, logo sting / brand lockup, lower-third / callout / social overlay, animated map (highlight regions, connect places, zoom to a location), animated tweet / news-article / headline, webpage / UI animation (scroll, cursor, callouts), or fusing a real image's geometry into a chart. Usually under 10s (up to ~30s), no narration or live-action subject; renders to MP4 or transparent overlay. Longer / narrated / multi-scene → /general-video. Unclear → /hyperframes.","lead":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update motion-graphics`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.","headings":[{"level":1,"text":"motion-graphics — dispatch entry"},{"level":2,"text":"Categories — split by the search decision"},{"level":2,"text":"Prerequisites"},{"level":2,"text":"Flow"},{"level":3,"text":"Step 0 — Initialize"},{"level":3,"text":"Step 1 — Plan (subagent: Director Part 1)"},{"level":3,"text":"Step 2 — Source ◇ (Bash: media-use, conditional)"},{"level":1,"text":"illustrative — see phases/source/guide.md"},{"level":3,"text":"Step 3 — Design (subagent: Director Part 2)"},{"level":3,"text":"Step 4 — Build (subagent: Builder, reuse-first)"},{"level":3,"text":"Step 5 — Verify (Bash → repair subagent on failure)"},{"level":3,"text":"Step 6 — Approve and render (Bash)"},{"level":1,"text":"transparent overlay variant: --format webm  (or mov)"},{"level":2,"text":"Resume table"},{"level":2,"text":"Design notes (maintainers — execution does not read this)"}],"preview":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update motion-graphics`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\n> **figma source**: If the logo/asset/animation to build from comes from a figma.com URL, run `/figma` first — asset export, brand tokens, and Motion→GSAP translation if the graphic is a Figma Motion import — then build from its output. Don't drive Figma via raw MCP tools directly: that skips SVG sanitization, `.media/manifest.jsonl` provenance, and brand-token `var()` binding, so a later brand change can't propagate without a full re-import.\n\n> **The front door is `/hyperframes`.** This skill makes a **short, design-led, unnarrated motion graphic** (motion is the message; ~under 10s, no voice-over). Anything longer, narrated, or multi-scene — or any uncertainty → read `/hyperframes` first: the intent layer owns every route decision.\n\nThis workflow is **autonomous by design** — at most one clarifying question (`agents/director.md`), then build through verification without intermediate review. The intent layer (`/hyperframes` → `references/intent-interview.md`) routes here directly without run-shape questions; a storyboard and companion session add little to a piece this short. Rendering is still user-gated: after checks and proof snapshots pass, ask the canonical “preview first, or render?” question from `../hyperframes-core/references/brief-contract.md`. When a `BRIEF.md` exists, read it before the director's question.\n\nA short design-led motion graphic. **Asset-first**: decide the asset strategy and source real material _before_ designing the shot, then design the shot around what you have, then compose by reusing catalog capabilities. All artifacts go to `PROJECT_DIR = videos/<project-name>/` (created in Step 0); all paths below are relative to it.\n\n| Phase    | Execution                                                             | Primary artifact                                                 | Detailed flow                 |\n| -------- | --------------------------------------------------------------------- | ---------------------------------------------------------------- | ----------------------------- |\n| init     | Bash                                                                  | `hyperframes.json`                                               | Step 0                        |\n| plan     | subagent — **decide search?** + classify + asset strategy             | `shot-plan.json","previewTruncated":true,"bodyLength":14928,"steps":9,"codeBlocks":6,"hasScripts":false,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"music-to-video","dir":"music-to-video","category":"视频与音频","purpose":"\"Turn a music track (an audio file, a video to pull audio from, or a track generated from a mood brief) into a beat-synced video — lyric video, slideshow, or kinetic promo. The music drives all pacing; any user-supplied images/videos are cut onto the same beat grid, and a complete video needs zero assets. Narrated pieces → the input-matched workflow (see /hyperframes). Unclear → /hyperframes.\"","triggers":[],"boundary":"","description":"\"Turn a music track (an audio file, a video to pull audio from, or a track generated from a mood brief) into a beat-synced video — lyric video, slideshow, or kinetic promo. The music drives all pacing; any user-supplied images/videos are cut onto the same beat grid, and a complete video needs zero assets. Narrated pieces → the input-matched workflow (see /hyperframes). Unclear → /hyperframes.\"","lead":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update music-to-video`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.","headings":[{"level":1,"text":"music-to-video — one music-grounded, beat-synced video workflow"},{"level":2,"text":"Two ideas that shape everything"},{"level":2,"text":"Step 0: Setup, BGM, and inputs"},{"level":1,"text":"only if the user gave you images/videos:"},{"level":2,"text":"Step 1: Analyze the music"},{"level":2,"text":"Step 2: Frame skeleton (structure only)"},{"level":2,"text":"Step 3: Fill the plan (user-gated)"},{"level":2,"text":"Step 4: Build frames from the plan"},{"level":2,"text":"Step 5: Assemble"},{"level":2,"text":"Step 6: Verify and render"},{"level":2,"text":"Resume table"},{"level":2,"text":"Quick Reference"},{"level":2,"text":"Directory layout"}],"preview":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update music-to-video`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\nUse this skill to turn a **music track** into a beat-synced HyperFrames video. You analyze the track once, lay out the frames, fill in a per-frame plan, and build each frame as a composition. The input is a music track plus optional user images or videos — there is **no narration and no website capture**. Typography and templates are the floor (a complete video needs zero assets); any media the user supplies is cut in on the same beat grid.\n\nYou are the **orchestrator**. Work in `videos/<project>/`. Run the steps in order and pass each **Gate** before moving on. Two steps need the user: **Step 3** (plan approval) and **Step 6** (render approval) — both are checkpoint gates per `../hyperframes-core/references/brief-contract.md` (read it before Step 0): in autonomous mode, post the summary as a heads-up and proceed instead of waiting. Do every step yourself except **Step 4**, where you dispatch **one sub-agent per frame**. Keep design and motion rules out of this file — they live in `references/` and the `frame-worker` sub-agent.\n\n`SKILL_DIR` = this skill directory. `PROJECT_DIR` = `videos/<project-name>/`.\n\nWorkflow: Step 0 setup → `hyperframes.json` + `assets/bgm.mp3`; Step 1 analyze → `audiomap.json`; Step 2 skeleton → `STORYBOARD.md` (frames, groups `TBD`); Step 3 plan → complete `STORYBOARD.md` + `frame.md`; Step 4 build → `compositions/frames/NN-*.html`; Step 5 assemble → `index.html`; Step 6 render → `renders/video.mp4`.\n\n- **One analyzer, and you trust it.** `analyze-beatgrid.py` is the only beat analyzer — never re-measure beats with another tool or by ear. Its energy / density / rolls / onsets / silences are always reliable. Its `bpm` and `beats_sec` are reliable **only when the music is genuinely rhythmic**; on calm music the grid is a metronome the tracker imposed, so pace by phrases and energy instead and never hard-cut to it. Deciding which case you're in is each frame's `pacing` (Step 2).\n- **One frame = one file; groups live inside.** Step 2 cuts the track into **frames**, and each frame becomes one composition file `compositions/frames/NN-<frame_id>.html`, built by one frame-worker. A frame can subdivide into **groups** (each a template or a motion-primitives combo). Extra density goes _inside_ a group, so **frame count tracks distinct treatments, not beats** — a fast track does","previewTruncated":true,"bodyLength":17105,"steps":6,"codeBlocks":9,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"product-launch-video","dir":"product-launch-video","category":"视频与音频","purpose":"\"Turn a product or marketing URL, pasted script, or brief into a product launch / promo video — SaaS promos, feature reveals, product demos, app and company launches. Site tours / showcases of a website route here too — the brief carries the show-it-as-is intent. Unclear → /hyperframes.\"","triggers":["the user wants to market, launch, promote, or reveal a product; the default for any commer…"],"boundary":"","description":"\"Turn a product or marketing URL, pasted script, or brief into a product launch / promo video — SaaS promos, feature reveals, product demos, app and company launches. Use when the user wants to market, launch, promote, or reveal a product; the default for any commercial URL. Site tours / showcases of a website route here too — the brief carries the show-it-as-is intent. Unclear → /hyperframes.\"","lead":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update product-launch-video`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.","headings":[{"level":1,"text":"Product Launch to HyperFrames"},{"level":2,"text":"Step 0: Setup"},{"level":2,"text":"Step 1: Capture assets"},{"level":2,"text":"Step 2: Design System"},{"level":2,"text":"Step 3: Storyboard and Script"},{"level":2,"text":"Step 3.1: Audio"},{"level":2,"text":"Step 4: Frame Visual Design"},{"level":2,"text":"Step 5: Build Frames"},{"level":2,"text":"Step 6: Finalize"},{"level":2,"text":"Quick Reference"}],"preview":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update product-launch-video`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\n> **media-use**: Before sourcing audio/images/logos, call `/media-use` to resolve BGM/SFX/images from the HeyGen catalog and brand logos from their official sources. Run `--adopt` first to register existing assets. See `/media-use` skill.\n\n> **figma source**: If the source is a figma.com URL, run `/figma` first — asset export, brand tokens, and components/storyboard reconstruction if needed — then build this workflow from its output. Don't drive Figma via raw MCP tools directly: that skips SVG sanitization, `.media/manifest.jsonl` provenance, and brand-token `var()` binding, so a later brand change can't propagate without a full re-import.\n\nUse this skill to capture a product, understand its brand, plan a launch video, and build it frame by frame in HyperFrames.\n\n> **The front door is `/hyperframes`.** You are the orchestrator. Run each step, verify its gate, and only then continue to the next step. This skill is for a **product being marketed, launched, promoted, or revealed**, including requests such as \"promo for our site\" when the purpose is promotional. A site tour / showcase ask stays here too: `BRIEF.md` carries the show-it-as-is intent, and the captured screens become the assets the video features. Any other intent, a bare \"make a video\", or any uncertainty → read `/hyperframes` first — the intent layer owns every route decision, and a fresh creation arriving here without `BRIEF.md` goes through it anyway (Setup's opening rule).\n\nYou are the orchestrator. Work in `videos/<project>/`. Run steps in order and pass each gate before continuing. User-gated steps are Step 0, Step 3, and Step 6. Read `../hyperframes-core/references/brief-contract.md` before Step 0 — it defines the gate types and how `BRIEF.md`'s `flow`/`storyboard` derive the mode that governs the Step 3/4/6 gates. Do every step yourself except Step 5, where you dispatch one sub-agent per frame. Do not put design or motion rules here; those live in the frame-worker sub-agent, this skill's local `../hyperframes-animation/rules/` + `../hyperframes-animation/blueprints/`, and `hyperframes-creative`.\n\nWorkflow: Step 0 setup -> `hyperframes.json`; Step 1 capture -> `capture/`; Step 2 design system -> `frame.md`; Step 3 storyboard/script -> `STORYBOARD.md` and `SCRIPT.md`; Step 3.1 audio -> `audio_meta.json`; Step 4 visual des","previewTruncated":true,"bodyLength":31413,"steps":2,"codeBlocks":1,"hasScripts":true,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"seedance-video","dir":"seedance-video","category":"视频与音频","purpose":"当用户要生成 AI 视频（文生视频/图生视频）时使用。","triggers":["生成视频","文生视频","做一个视频","AI视频","宣传片","动态视频"],"boundary":"不适用于已有素材的剪辑与字幕（改走 videocut-jiankoubo / embedded-captions），也不适用于 HTML 代码渲染动效（改走 hyperframes 系列）","description":"当用户要生成 AI 视频（文生视频/图生视频）时使用。触发词如\"生成视频/文生视频/做一个视频/AI视频/宣传片/动态视频\"。｜不适用于已有素材的剪辑与字幕（改走 videocut-jiankoubo / embedded-captions），也不适用于 HTML 代码渲染动效（改走 hyperframes 系列）","lead":"用字节 Seedance 生成真 AI 动态视频（不是 ffmpeg 缩放）。","headings":[{"level":1,"text":"AI 文生视频（Seedance，火山方舟）"},{"level":2,"text":"前提（需先开通）"},{"level":2,"text":"调用（异步任务）"},{"level":2,"text":"参数"},{"level":2,"text":"工作流"},{"level":2,"text":"注意事项"}],"preview":"用字节 Seedance 生成真 AI 动态视频（不是 ffmpeg 缩放）。\n\n- 火山方舟账号需**开通 Seedance 模型**（Ark 控制台开通 doubao-seedance 系列）。\n- 未开通会报 `ModelNotOpen`。\n\n1. **创建任务**：\n   `POST https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks`\n   body：`{\"model\":\"doubao-seedance-2-5-260628\",\"content\":[{\"type\":\"text\",\"text\":\"<prompt>\"}]}`\n   → 返回 `id`（task_id）\n2. **轮询**：\n   `GET https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks/{task_id}`\n   → `status: succeeded` 时取 `content.video_url`\n3. **下载**视频到工作目录。\n\n- 模型：`doubao-seedance-2-5-260628`（最新）/ `2-0` / `1-0-pro`\n- 文生视频：`content` 里 `type: text`（prompt）\n- 图生视频：`content` 里加 `type: image_url`（首帧图）+ `type: text`\n\n1. 确认：视频内容、风格、时长（Seedance 一般 5-10 秒）。\n2. 写分镜 prompt：主体 + 动作 + 镜头运动 + 光影 + 风格。\n3. 创建任务 → 轮询（每 10 秒，最多 3 分钟）→ 下载。\n4. 需要字幕/配音，用 ffmpeg 叠加。\n\n- 生成耗时 1-2 分钟，轮询别傻等。\n- 视频链接有时效，及时下载。\n- 报 `ModelNotOpen` → 提示用户去 Ark 控制台开通 Seedance。","previewTruncated":false,"bodyLength":949,"steps":15,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"Seedance","scene":"文生视频（火山方舟）"},{"name":"doubao","scene":"火山豆包"},{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"short-video-script","dir":"short-video-script","category":"视频与音频","purpose":"当用户要写短视频脚本、口播稿、分镜、带货话术、知识类/剧情类/测评类视频文案时使用。","triggers":["口播稿","短视频脚本","分镜","带货文案","这条视频怎么说"],"boundary":"不适用于实际出片（改走 seedance-video / videocut-jiankoubo），也不适用于公众号图文（改走 wechat-publish）","description":"当用户要写短视频脚本、口播稿、分镜、带货话术、知识类/剧情类/测评类视频文案时使用。触发词如\"口播稿/短视频脚本/分镜/带货文案/这条视频怎么说\"。｜不适用于实际出片（改走 seedance-video / videocut-jiankoubo），也不适用于公众号图文（改走 wechat-publish）","lead":"口播稿是\"说出来的文字\"，每句都要能独立听懂，不能像书面语。","headings":[{"level":1,"text":"短视频口播稿与脚本"},{"level":2,"text":"1. 先定 4 件事"},{"level":2,"text":"2. 黄金结构（3 秒定生死）"},{"level":2,"text":"3. 语言规则"},{"level":2,"text":"4. 输出格式"},{"level":2,"text":"5. 带货类额外要求"}],"preview":"口播稿是\"说出来的文字\"，每句都要能独立听懂，不能像书面语。\n\n- **时长**：15s / 30s / 60s（1 分钟约 220-260 字）\n- **类型**：口播知识 / 剧情 / 测评 / 带货 / Vlog\n- **受众**：谁在看、他此刻的注意力状态\n- **目标动作**：点赞/评论/关注/下单，结尾只引导一个\n\n1. **钩子（0-3 秒）**：一句话制造\"必须看下去\"的理由。公式：\n   - 反常识：\"90% 的人都做错了…\"\n   - 结果前置：\"我用 3 天涨了 1 万粉，就靠这一句\"\n   - 场景代入：\"正在改简历的你，先停一下\"\n   - 提问：\"为什么你的视频没人看？\"\n2. **正文（3-80%）**：只讲 1 个核心点，用「观点 → 解释 → 例子」循环 2-3 轮，每轮不超过 20 秒。\n3. **钩子回收 + CTA（最后 15%）**：呼应开头，再给唯一一个行动指令。\n\n- 全用口语短句，单句 ≤ 15 字，多用\"你\"。\n- 删掉所有\"众所周知\"\"综上所述\"\"值得注意的是\"等书面语。\n- 数字具体化：\"省一半时间\"改成\"从 2 小时缩到 40 分钟\"。\n- 适当停顿、重音、反转，用标点或换行标出。\n\n交付三栏分镜表：\n\n| 时间 | 画面/字幕 | 口播台词 | 备注（BGM/音效/动作） |\n|---|---|---|---|\n| 0-3s | … | … | … |\n\n另附：开头 3 个备选钩子 + 结尾 2 个备选 CTA + 封面标题 3 个。\n\n- 先讲\"痛点场景\"，再讲\"解决方案\"，最后才是\"产品/优惠\"。\n- 卖点只说 1-2 个，每个配一句\"用户能听懂的利益\"，不堆参数。\n- 合规：不承诺疗效、不绝对化（\"最\"）、不贬低竞品。","previewTruncated":false,"bodyLength":840,"steps":18,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"Seedance","scene":"文生视频（火山方舟）"}]},{"name":"short-video-script-lab","dir":"短视频脚本工坊（short-video-script-lab）","category":"视频与音频","purpose":"把选题转成可拍摄短视频脚本、分镜和口播稿，适合知识类、观点类、课程引流类短视频。","triggers":["短视频脚本","分镜","口播稿","课程引流视频"],"boundary":"不适用于实际出片（改走 seedance-video / videocut-jiankoubo），也不适用于已定稿脚本的再打磨（改走 short-video-script）","description":"把选题转成可拍摄短视频脚本、分镜和口播稿，适合知识类、观点类、课程引流类短视频。触发词如\"短视频脚本/分镜/口播稿/课程引流视频\"。｜不适用于实际出片（改走 seedance-video / videocut-jiankoubo），也不适用于已定稿脚本的再打磨（改走 short-video-script）","lead":"从开头三秒、观点推进、镜头动作和结尾转化四个层面设计脚本。","headings":[{"level":1,"text":"Short Video Script Lab"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"从开头三秒、观点推进、镜头动作和结尾转化四个层面设计脚本。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n口播稿、分镜表、标题、拍摄备注：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":757,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"Seedance","scene":"文生视频（火山方舟）"}]},{"name":"slideshow","dir":"slideshow","category":"视频与音频","purpose":"Author a HyperFrames slideshow — a presentation, pitch deck, or interactive deck with discrete slides, fragment reveals, branching, hotspot navigation, and built-in presenter mode with speaker notes; also converts an existing page into a deck. Output is a navigable deck, not a rendered MP4. If the user didn't explicitly ask for a slideshow, confirm before authoring. Unclear → /hyperframes.","triggers":[],"boundary":"","description":"Author a HyperFrames slideshow — a presentation, pitch deck, or interactive deck with discrete slides, fragment reveals, branching, hotspot navigation, and built-in presenter mode with speaker notes; also converts an existing page into a deck. Output is a navigable deck, not a rendered MP4. If the user didn't explicitly ask for a slideshow, confirm before authoring. Unclear → /hyperframes.","lead":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update slideshow`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.","headings":[{"level":1,"text":"Slideshow authoring contract"},{"level":2,"text":"Output — a navigable deck, not a linear MP4"},{"level":2,"text":"Intent confirmation"},{"level":2,"text":"The two pieces"},{"level":3,"text":"1. Scenes — declared the normal way"},{"level":3,"text":"2. The JSON island — one script block per composition"},{"level":2,"text":"Schema"},{"level":3,"text":"`SlideshowManifest` (the top-level island object)"},{"level":3,"text":"`SlideRef`"},{"level":3,"text":"`SlideHotspot`"},{"level":3,"text":"`SlideSequence`"},{"level":2,"text":"Slide writing rules"},{"level":2,"text":"Porting source pages"},{"level":2,"text":"Fragments: reveal hold-points within a slide"},{"level":2,"text":"Branching: hotspots and slide sequences"},{"level":2,"text":"Worked example: 3-slide deck with fragments and a branch"},{"level":3,"text":"Scene HTML (skeleton)"},{"level":3,"text":"Key points in the example"},{"level":2,"text":"Wrapping component"},{"level":3,"text":"Media cleanup on slide exit"},{"level":3,"text":"Global nav mute"},{"level":2,"text":"Running a slideshow standalone (interim)"},{"level":2,"text":"Handoff"},{"level":2,"text":"Validation"}],"preview":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update slideshow`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\n> **figma source**: If the deck's content or storyboard comes from a figma.com URL, run `/figma` first — asset export, brand tokens, and storyboard reconstruction if the source is a strip of scene frames — then build from its output. Don't drive Figma via raw MCP tools directly: that skips SVG sanitization, `.media/manifest.jsonl` provenance, and brand-token `var()` binding, so a later brand change can't propagate without a full re-import.\n\nA HyperFrames slideshow is a normal HyperFrames composition — scenes, clips, GSAP timelines — with one extra ingredient: a **JSON island** that declares which scenes are slides and how they connect. The player's `SlideshowController` reads the island and turns the continuous GSAP timeline into a discrete, navigable deck.\n\n**Read `/hyperframes-core` first** for the base composition contract (clips, tracks, `data-*` attributes, determinism rules). This skill covers only what is new: the island schema, slide writing rules, fragments, branching, validation, and the wrapping component.\n\nA slideshow's output is the **running deck**: serve it with `hyperframes present <project-dir>` (or Studio present mode) — the player's `SlideshowController` reads the island and drives navigation, fragments, branching, and presenter mode. See **Presenting and handoff** below.\n\n**Do not `hyperframes render` a slideshow into a single MP4.** A deck is authored as several top-level scene compositions (one `data-composition-id` per slide) with **no master-root composition** wrapping them, so `render` resolves only the **first** composition and emits a **silently truncated** MP4 (e.g. 6s of a 40-second deck). A linear main-line export (main slides only, branch sequences excluded) is **deferred** — until it ships, the supported outputs are the live `present` deck and per-slide `snapshot` stills. If a user needs a linear MP4 today, surface this limitation rather than pointing `render` at the deck.\n\nIf the user explicitly asks for a slideshow, slide show, or HyperFrames slideshow, proceed with this skill. When the request arrived through `/hyperframes`, the intent layer's triage owns this confirmation — routed here means already confirmed, so don't re-ask; the layer's run-shape questions don't apply (the deliverable is a deck, not a rendered video). A `BRIEF.md`, when present, carries the con","previewTruncated":true,"bodyLength":32424,"steps":43,"codeBlocks":14,"hasScripts":false,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"边界声明由上游维护，本机不改写以免版本漂移（13 个之一）；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"talking-head-recut","dir":"talking-head-recut","category":"视频与音频","purpose":"Package an existing talking-head / interview / podcast video with timed, designed GRAPHIC OVERLAY cards — kinetic titles, lower-thirds, data callouts, quotes, side panels, picture-in-picture — synced to the transcript, on a 16:9 / 9:16 / 4:5 canvas of your choice; the clip plays untouched underneath. Not plain subtitles (/embedded-captions). Unclear → /hyperframes.","triggers":["graphic overlays\", \"on-screen graphics\", \"package / dress up my video"],"boundary":"","description":"Package an existing talking-head / interview / podcast video with timed, designed GRAPHIC OVERLAY cards — kinetic titles, lower-thirds, data callouts, quotes, side panels, picture-in-picture — synced to the transcript, on a 16:9 / 9:16 / 4:5 canvas of your choice; the clip plays untouched underneath. Trigger on \"graphic overlays\", \"on-screen graphics\", \"package / dress up my video\". Not plain subtitles (/embedded-captions). Unclear → /hyperframes.","lead":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update talking-head-recut`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.","headings":[{"level":1,"text":"Talking Head Recut"},{"level":2,"text":"CLI Resolution"},{"level":1,"text":"hyperframes — transcription (local Whisper) + rendering the assembled HTML to MP4"},{"level":2,"text":"Workflow"},{"level":3,"text":"1. Check Environment"},{"level":1,"text":"confirm bundled assets:"},{"level":3,"text":"2. Create a Work Directory"},{"level":3,"text":"3. Extract Audio and Metadata"},{"level":1,"text":"metadata — duration / width / height / fps"},{"level":1,"text":"audio"},{"level":3,"text":"4. Transcribe"},{"level":3,"text":"5. Correct Transcript"},{"level":3,"text":"6. Draft a Lightweight Storyboard (in chat)"},{"level":3,"text":"7. Decide Render Strategy"},{"level":3,"text":"8. Write Each Card's HTML"},{"level":3,"text":"9. Assemble the Composition HTML"},{"level":1,"text":"SKILL_DIR is injected by the host (\"Base directory for this skill: …\")"},{"level":1,"text":"stage the input video — RE-ENCODE with dense keyframes. Sources with a sparse GOP"},{"level":1,"text":"(keyframe interval > ~1s) freeze on seek in the renderer (a frozen frame under the"},{"level":1,"text":"overlays); -g / -keyint_min set to your composition fps make every frame seekable."},{"level":1,"text":"(Set both to your fps — 30 shown; use 24/25/60 to match.)"},{"level":3,"text":"10. Render to MP4"},{"level":3,"text":"11. Report Results"}],"preview":"> **First, keep this skill fresh — confirm with the user before running:** `npx hyperframes skills update talking-head-recut`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\nTalking Head Recut takes a local video that **plays in full** and layers a sequence of\ntimed, designed **graphic cards** onto it — titles, lower-thirds, data callouts,\nquotes, side panels, picture-in-picture — synced to what's being said. The agent\ndesigns the cards (timing + content) and **writes each card's HTML directly in the\nconversation**, then assembles a single composition HTML and renders it to MP4 via\n`hyperframes`. There is no fixed archetype list and no prescribed card structure —\nthe overlays emerge from what the transcript actually says.\n\n> **The front door is `/hyperframes`.** This skill packages an **existing talking-head clip** with **designed graphic cards** (titles, lower-thirds, data callouts, quotes, side panels, PiP) — not plain captions (the spoken words as text). **The clip plays untouched.** Any other intent — plain subtitles, a standalone graphic, a from-scratch video — or any uncertainty → read `/hyperframes` first: the intent layer owns every route decision.\n\n> **Graphic-packaging sibling of `embedded-captions`.** Captions add the _spoken words_\n> as a readable subtitle; this adds _designed graphics_ on top of the playing video.\n> Plain subtitles → `embedded-captions`. Build a video from scratch → the creation\n> workflows (`product-launch-video` / `faceless-explainer` / …).\n\nRouted through `/hyperframes`, the intent layer confirms only the input (which clip) and **announces** the render-strategy questions as deferred asks — aspect, layout, style group, and card count stay at Step 7, where the probed footage and transcript ground the recommendations; the layer's run-shape questions don't apply. A `BRIEF.md`, when present, carries the confirmed input and any user notes — read it first.\n\nInspectable intermediate files in the work directory:\n\n- `metadata.json` — duration / width / height / fps\n- `audio.mp3` — extracted audio\n- `transcript.json` — a flat **word array** `[{ text, start, end }, …]` (Whisper; no `segments`, no `words` wrapper)\n- `storyboard.json` — lightweight card outline (the agent's plan)\n- `public/cards/card-XX.html` — one HTML fragment per card\n- `public/index.html` — final assembled composition\n- `output.mp4` — rendered video\n\n```bash\nnpx hyperframes --help\n```\n\nThis skill runs entirely on the **hyperframes** CLI plus system `ffmpeg` / `ffprobe`.\n","previewTruncated":true,"bodyLength":64345,"steps":93,"codeBlocks":20,"hasScripts":false,"missingBins":[],"source":"hyperframes 官方仓库","license":"Apache-2.0","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"依赖已解决(2026-09-11)：hyperframes transcribe 端到端可用（whisper.cpp + ggml-small，中文实测通过）","version":"","models":[{"name":"whisper","scene":"本机语音转写"},{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"video-account-analysis","dir":"微信视频号分析（video-account-analysis）","category":"视频与音频","purpose":"分析微信视频号后台数据截图，提取关键指标、对标行业基准并给出可执行优化建议。","triggers":["视频号后台数据","数据截图分析","指标优化","视频号复盘"],"boundary":"只做数据复盘、不产出视频（要出片改走 videocut-jiankoubo / seedance-video）","description":"分析微信视频号后台数据截图，提取关键指标、对标行业基准并给出可执行优化建议。触发词如\"视频号后台数据/数据截图分析/指标优化/视频号复盘\"。｜只做数据复盘、不产出视频（要出片改走 videocut-jiankoubo / seedance-video）","lead":"读取用户提供的视频号后台数据截图，提取并计算核心指标，与行业基准对比，定位具体问题，输出针对性的内容优化建议——不是泛泛而谈，而是直接指向\"改什么、怎么改\"。","headings":[{"level":1,"text":"微信视频号数据分析"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"第一阶段：数据提取"},{"level":3,"text":"第二阶段：计算派生指标"},{"level":3,"text":"第三阶段：行业基准对比"},{"level":3,"text":"第四阶段：诊断决策树"},{"level":3,"text":"第五阶段：输出建议"},{"level":2,"text":"输出格式"},{"level":2,"text":"数据概览"},{"level":2,"text":"诊断结论"},{"level":2,"text":"优先改进项（按影响力排序）"},{"level":3,"text":"1. [问题名称]"},{"level":3,"text":"2. [问题名称]"},{"level":2,"text":"保持不变的优势"},{"level":2,"text":"本周 vs 上周（仅在提供对比数据时）"},{"level":2,"text":"Gotchas"},{"level":3,"text":"截图数字识别模糊"},{"level":3,"text":"完播率异常高（>80%）"},{"level":3,"text":"数据量太少（播放量 < 500）"},{"level":3,"text":"行业差异"},{"level":3,"text":"多张截图时间跨度不一致"}],"preview":"读取用户提供的视频号后台数据截图，提取并计算核心指标，与行业基准对比，定位具体问题，输出针对性的内容优化建议——不是泛泛而谈，而是直接指向\"改什么、怎么改\"。\n\n---\n\n- 用户上传视频号后台截图，说\"帮我分析一下数据\"\n- 用户说\"我的完播率很低，帮我找原因\"\n- 用户说\"这周的数据和上周对比一下\"\n- 用户提供多条视频数据，说\"哪条表现最好\"\n\n---\n\n1. **读取截图，识别可用数据字段**\n\n   逐一识别以下字段（标记\"无\"表示截图中未显示）：\n\n   | 字段 | 单位 | 说明 |\n   |------|------|------|\n   | 播放量 | 次 | 视频总播放次数 |\n   | 完播率 | % | 看完视频 / 开始播放 |\n   | 平均播放时长 | 秒 | 用于反推实际完播情况 |\n   | 点赞数 | 个 | |\n   | 评论数 | 条 | |\n   | 分享数 | 次 | |\n   | 收藏数 | 个 | |\n   | 涨粉数 | 人 | 该视频带来的新关注 |\n   | 主页访问量 | 次 | 从视频进入主页的次数 |\n\n2. **处理多视频对比场景**\n   - 若截图包含多条视频，逐条提取，建立表格\n   - 若截图模糊或数字无法辨认，标注该字段为\"识别失败\"，告知用户\n\n3. **计算以下派生指标**（有原始数据时必须计算）\n\n   互动率 = (点赞 + 评论 + 分享 + 收藏) / 播放量 × 100%\n\n   粉丝转化率 = 涨粉数 / 播放量 × 100%\n\n   评论率（细分互动质量）= 评论数 / 播放量 × 100%\n\n   分享率（传播力指标）= 分享数 / 播放量 × 100%\n\n   主页转化率（内容吸引力）= 主页访问量 / 播放量 × 100%\n\n4. **对每个指标标注等级**\n\n   | 指标 | 及格线 | 良好 | 优秀 |\n   |------|--------|------|------|\n   | 完播率 | >15% | >25% | >35% |\n   | 互动率 | >1% | >3% | >5% |\n   | 粉丝转化率 | >0.1% | >0.5% | >1% |\n   | 评论率 | >0.1% | >0.3% | >0.5% |\n   | 分享率 | >0.1% | >0.5% | >1% |\n   | 主页转化率 | >0.5% | >1.5% | >3% |\n\n   备注：以上基准适用于粉丝量 1 万以下账号。粉丝量越大，各指标基准值通常越低。\n\n5. **多视频场景：识别头部和尾部**\n   - 按综合得分排序（完播率 × 40% + 互动率 × 40% + 粉丝转化率 × 20%）\n   - 标记 Top 1-2 和 Bottom 1-2\n   - 对比头部和尾部的差异特征\n\n6. **按以下顺序逐项诊断，找到第一个命中的问题**\n\n   IF 完播率 < 15%\n     → 问题在\"开头钩子\"\n     → 检查：前3秒是否有悬念/冲突/利益承诺？\n     → 检查：画面第一帧是否有视觉吸引力？\n     → 建议：用问题式开头（\"你知道为什么……\"）或结果前置（先展示结果再解释）\n\n   ELIF 完播率 15%-25% 但互动率 < 1%\n     → 问题在\"内容价值感\"或\"行动号召（CTA）\"\n     → 检查：视频结尾是否有明确的点赞/评论引导？\n     → 检查：内容是否给观众留下了\"想说点什么\"的感受？\n     → 建议：结尾加\"你觉得……评论区告诉我\"；内容中加入争议性观点\n\n   ELIF 互动率 > 3% 但粉丝转化率 < 0.1%\n     → 问题在\"账号人设不清晰\"\n     → 用户喜欢这条视频但不知道关注你能获得什么\n     → 建议：视频中明确说出\"关注我，每周分享……\"；完善主页简介\n\n   ELIF 分享率 < 0.1%\n     → 内容\"自用\"属性强，传播属性弱\n     → 检查：内容是否有\"值得发给朋友\"的实用性或情绪共鸣？\n     → 建议：加入\"转发给需要的朋友\"话术；制作工具型内容（模板/清单/公式）\n\n   ELIF 播放量低（<1000）且其他指标正常\n     → 问题在\"分发阶段\"而非内容质量\n     → 可能原因：发布时间非高峰期（推荐 7-9点 / 12-13点 / 20-22点）\n     → 可能原因：封面图文字过小或主题不够吸眼\n     → 建议：调整发布时间；A/B测试封面\n\n7. 每条建议必须包含：\n   - 具体问题是什么（数据支撑）\n   - 根本原因（诊断结论）\n   - 可操作的改进动作（能立即执行的）\n\n---\n\n```\n\n| 指标 | 数值 | 行业基准 | 评级 |\n|------|------|----------|------|\n| 完播率 | 22% | >25%良好 | 待提升 |\n| 互动率 | 4.2% | >3%良好 | 良好 |\n| 粉丝转化率 | 0.3% | >0.1%及格 | 及格 |\n\n核心问题：[一句话说明最主要的问题]\n\n- 数据表现：完播率 22%，低于良好基准（25%）\n- 根本原因：[诊断]\n- 改进动作：[具体可操作的 1-2 步]\n\n- [当前表现好的指标及内容策略，告知用户继续保持]\n\n[对比表格 + 变化趋势]\n```\n\n---\n\n- 若数字无法确认（如 1K 还是 1W），明确告知用户\"X字段识别不确定，读取为[值]，请确认\"\n- 不要猜测，猜错会导致分析结论完全错误\n\n- 可能原因：视频时长极短（<15秒），完播率天然高，不代表内容质量好\n- 分析时需结合视频时长说明\n\n- 样本量不足，指标波动大，不具统计意义\n- 说明\"当前播放量偏低，数据仅供参考，建议积累 1000+ 播放后再做分析\"\n\n- 上述基准适用于泛内容账号\n- 垂直行业账号（教育、财经、医疗）互动率通常偏低（0.5-1.5% 属正常）\n- 若用户提供了账号类型，调整基准并说明\n\n- 若截图来自不同时间段，提醒用户数据横向对比可能不公平\n- 建议用同一时间窗口的数据进行比较","previewTruncated":false,"bodyLength":2911,"steps":34,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"Seedance","scene":"文生视频（火山方舟）"}]},{"name":"video-transcribe","dir":"视频转写（video-transcribe）","category":"视频与音频","purpose":"Downloads video audio using yt-dlp and transcribes to text with Whisper when user provides a video URL or local video file path and wants a text transcript.","triggers":["Transcribe a video URL or local media file to text when the user wants a transcript"],"boundary":"不适用于剪辑与口误处理（改走 videocut-jiankoubo），也不适用于纯字幕烧录（改走 embedded-captions）","description":"Downloads video audio using yt-dlp and transcribes to text with Whisper when user provides a video URL or local video file path and wants a text transcript.Use when: \"Transcribe a video URL or local media file to text when the user wants a transcript\".｜不适用于剪辑与口误处理（改走 videocut-jiankoubo），也不适用于纯字幕烧录（改走 embedded-captions）","lead":"接受视频 URL 或本地文件路径，优先使用平台内置字幕（秒出结果），无字幕时用 yt-dlp 提取音频并调用 Whisper 转写，后处理合并短句和修正中文标点，输出带时间戳的完整文本。","headings":[{"level":1,"text":"视频转写（Video Transcribe）"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"支持平台"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1：环境检查"},{"level":1,"text":"检查 yt-dlp"},{"level":1,"text":"检查 Whisper"},{"level":1,"text":"检查 ffmpeg（Whisper 必须依赖）"},{"level":3,"text":"Step 2：检查平台内置字幕"},{"level":1,"text":"获取视频信息，检查是否有字幕"},{"level":1,"text":"下载中文字幕（优先官方，其次自动）"},{"level":1,"text":"解析 .vtt 文件"},{"level":1,"text":"移除 WebVTT 头和时间戳行"},{"level":3,"text":"Step 3：提取音频"},{"level":1,"text":"仅下载音频（不下载视频，节省时间）"},{"level":1,"text":"本地视频文件 → 提取音频"},{"level":3,"text":"Step 4：Whisper 转写"},{"level":1,"text":"mlx-whisper 在 Apple Silicon 上比 CPU whisper 快 5-10 倍"},{"level":3,"text":"Step 5：后处理"},{"level":1,"text":"合并过短片段（时长 < 3 秒 且 文字 < 10 字）"},{"level":1,"text":"中文标点修正"},{"level":1,"text":"格式化为带时间戳的文本"},{"level":1,"text":"保存"},{"level":2,"text":"常见错误修复"},{"level":1,"text":"最常见修复：更新 yt-dlp"},{"level":1,"text":"或"},{"level":1,"text":"需要登录的内容（B站大会员、X 受限内容）"},{"level":1,"text":"或先用浏览器导出 cookies.txt"},{"level":1,"text":"降级模型或强制 CPU"},{"level":1,"text":"音频文件损坏，重新下载"},{"level":1,"text":"重新执行 Step 3"},{"level":1,"text":"1. 使用更大模型"},{"level":1,"text":"2. 强制指定语言（避免语言误判导致质量下降）"},{"level":1,"text":"3. 提供初始提示词（对专业内容有效）"},{"level":2,"text":"输出格式"},{"level":2,"text":"视频转写完成"},{"level":3,"text":"转写文本"},{"level":3,"text":"保存路径"},{"level":2,"text":"Gotchas"}],"preview":"接受视频 URL 或本地文件路径，优先使用平台内置字幕（秒出结果），无字幕时用 yt-dlp 提取音频并调用 Whisper 转写，后处理合并短句和修正中文标点，输出带时间戳的完整文本。\n\n---\n\n- 用户提供视频 URL，要求\"转写\"或\"提取字幕\"或\"整理成文字\"\n- content-scraper skill 需要 Bilibili/YouTube 视频内容\n- 用户有本地视频/音频文件需要转录\n- 用户要求从视频中提取会议记录或讲座内容\n\n---\n\n**yt-dlp 支持（主要）：**\n```\nYouTube / YouTube Shorts\nBilibili（公开视频；大会员内容需 cookie）\nX/Twitter（视频推文）\nInstagram（公开视频）\nTikTok\n微博视频\n本地文件路径（mp4 / mp3 / wav / m4a / mkv）\n```\n\n**不支持（DRM 加密）：**\n- Netflix / Disney+ / Apple TV+\n- 需要订阅验证的付费播客平台\n\n---\n\n```bash\nwhich yt-dlp || echo \"缺少 yt-dlp，运行：pip install yt-dlp\"\n\npython3 -c \"import whisper; print('ok')\" || echo \"缺少 whisper，运行：pip install openai-whisper\"\n\nwhich ffmpeg || echo \"缺少 ffmpeg，运行：brew install ffmpeg（macOS）或 sudo apt install ffmpeg（Linux）\"\n```\n\n检测 Apple Silicon（M 系列芯片）以决定是否使用 mlx-whisper：\n```bash\nuname -m  # 返回 arm64 表示 Apple Silicon\npython3 -c \"import mlx_whisper; print('mlx ok')\" 2>/dev/null || echo \"可选：pip install mlx-whisper\"\n```\n\n**优先使用内置字幕（比 Whisper 快且更准确）：**\n```bash\nyt-dlp --dump-json --no-playlist \"{URL}\" 2>/dev/null | python3 -c \"\nimport json, sys\ninfo = json.load(sys.stdin)\nprint(f'标题: {info.get(\\\"title\\\", \\\"未知\\\")}')\nprint(f'时长: {info.get(\\\"duration\\\", 0) // 60} 分 {info.get(\\\"duration\\\", 0) % 60} 秒')\nsubs = list(info.get('subtitles', {}).keys())\nauto = list(info.get('automatic_captions', {}).keys())\nprint(f'官方字幕: {subs}')\nprint(f'自动字幕: {auto}')\n\"\n```\n\n**如有字幕，直接下载（跳过 Step 3-4）：**\n```bash\nyt-dlp --write-subs --write-auto-subs \\\n       --sub-lang \"zh-Hans,zh-Hant,zh,en\" \\\n       --skip-download --sub-format vtt \\\n       -o \"/tmp/transcript/%(title)s.%(ext)s\" \\\n       \"{URL}\"\n\npython3 -c \"\nimport re, sys\n\nwith open('/tmp/transcript/xxx.vtt') as f:\n    content = f.read()\n\nlines = []\nfor line in content.split('\\n'):\n    if '-->' in line or line.startswith('WEBVTT') or re.match(r'^\\d+$', line.strip()):\n        continue\n    text = re.sub(r'<[^>]+>', '', line).strip()  # 移除 HTML 标签\n    if text:\n        lines.append(text)\n\nprint('\\n'.join(lines))\n\"\n```\n\n仅当无内置字幕时执行：\n\n```bash\nmkdir -p /tmp/transcript\n\nyt-dlp \\\n  --extract-audio \\\n  --audio-format mp3 \\\n  --audio-quality 0 \\\n  --no-playlist \\\n  -o \"/tmp/transcript/%(title)s.%(ext)s\" \\\n  \"{URL}\"\n\nffmpeg -i \"/绝对路径/video.mp4\" \\\n       -vn -acodec libmp3lame -q:a 2 \\\n       \"/tmp/transcript/audio.mp3\" -y\n```\n\n预计时间参考（下载）：\n| 视频时长 | 下载时间（估算） |\n|----------|-----------------|\n| < 10 分钟 | < 30 秒 |\n| 10-30 分钟 | 30-120 秒 |\n| > 30 分钟 | 提前告知用户，约需数分钟 |\n\n**模型选择（速度 vs 质量）：**\n\n| 模型 | 大小 | 速度倍率 | 质量 | 推荐场景 |\n|------|------|----------|------|----------|\n| tiny | 39MB | ~10x 实时 | 基本可用 | 快速预览 |\n| base | 74MB | ~7x 实时 | 较好 | 清晰录音 |\n| small | 244MB | ~4x 实时 | 好 | ","previewTruncated":true,"bodyLength":7092,"steps":21,"codeBlocks":16,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"依赖已解决(2026-09-11)：yt-dlp 2026.08.19 已装（下载）；转写引擎 hyperframes transcribe + whisper.cpp 已可用","version":"","models":[{"name":"whisper","scene":"本机语音转写"},{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"videocut-jiankoubo","dir":"videocut-jiankoubo","category":"视频与音频","purpose":"口播视频转录和口误识别。生成审查稿和删除任务清单。","triggers":["剪口播","处理视频","识别口误"],"boundary":"不适用于从零生成视频（改走 seedance-video 或 hyperframes 系列），也不适用于只加字幕不动画面（改走 embedded-captions）","description":"口播视频转录和口误识别。生成审查稿和删除任务清单。触发词：剪口播、处理视频、识别口误｜不适用于从零生成视频（改走 seedance-video 或 hyperframes 系列），也不适用于只加字幕不动画面（改走 embedded-captions）","lead":"<!--","headings":[{"level":1,"text":"剪口播 v2"},{"level":2,"text":"快速使用"},{"level":2,"text":"首次安装后的引导"},{"level":2,"text":"输出目录结构"},{"level":2,"text":"流程"},{"level":3,"text":"可选审核模式"},{"level":3,"text":"最终字幕硬规则"},{"level":3,"text":"最终字幕 AI 校对硬规则"},{"level":2,"text":"执行步骤"},{"level":3,"text":"步骤 0: 创建输出目录"},{"level":1,"text":"变量设置（根据实际视频调整）"},{"level":1,"text":"创建子目录"},{"level":3,"text":"步骤 1-3: 转录"},{"level":1,"text":"1. 提取音频（文件名有冒号需加 file: 前缀）"},{"level":1,"text":"2. 上传获取公网 URL"},{"level":1,"text":"返回: {\"success\":true,\"files\":[{\"url\":\"https://h.uguu.se/xxx.mp3\"}]}"},{"level":1,"text":"3. 调用火山引擎 API"},{"level":1,"text":"输出: volcengine_result.json"},{"level":3,"text":"步骤 4: 生成字幕"},{"level":1,"text":"输出: subtitles_words.json"},{"level":3,"text":"步骤 5: 分析口误（脚本+AI）"},{"level":2,"text":"句间重复 (Agent A)"},{"level":2,"text":"句内重复 (Agent B)"},{"level":2,"text":"残句 (Agent C)"},{"level":3,"text":"步骤 6-10: 全自动剪辑和最终字幕（默认）"},{"level":1,"text":"输出:"},{"level":1,"text":"1. 3_审核/草稿名_auto_cut.mp4"},{"level":1,"text":"2. 3_审核/草稿名_auto_cut_raw_final.srt（剪后音频 ASR 原稿）"},{"level":1,"text":"3. 3_审核/草稿名_auto_cut_final.srt（待 AI 校对后写回）"},{"level":1,"text":"4. 3_审核/delete_segments.json"},{"level":1,"text":"5. 4_成片字幕/草稿名_auto_cut_mp3_reasr/volcengine_result.json"},{"level":1,"text":"6. 3_审核/草稿名_auto_cut_ai_polish_prompt.md"},{"level":1,"text":"7. 3_审核/草稿名_auto_cut_字幕校对报告.md"},{"level":1,"text":"8. 字幕/3_输出/草稿名_auto_cut_raw_final.srt"},{"level":1,"text":"9. 字幕/3_输出/草稿名_auto_cut_final.srt"},{"level":3,"text":"审核模式（仅用户明确要求时）"},{"level":1,"text":"6. 生成审核网页（传入视频文件，自动创建符号链接）"},{"level":1,"text":"输出: review.html, video.mp4(符号链接)"},{"level":1,"text":"7. 启动审核服务器"},{"level":1,"text":"打开 http://localhost:8899"}],"preview":"<!--\ninput: 视频文件 (*.mp4)\noutput: subtitles_words.json、auto_selected.json、review.html、video.mp4(符号链接)、*_raw_final.srt、*_final.srt\npos: 转录+识别+审核+剪辑+剪后重转录+AI字幕校对\n\n架构守护者：一旦我被修改，请同步更新：\n1. ../README.md 的 Skill 清单\n2. /CLAUDE.md 路由表\n-->\n\n> 火山引擎转录 + AI 口误识别 + 自动剪辑 + 剪后音频重转录 + AI 字幕文字校对\n\n```\n用户: 帮我剪这个口播视频\n用户: 处理一下这个视频\n```\n\n在处理任何视频前，先检查当前 skill 是否已经完成首次配置：\n\n```bash\nbash \"$SKILL_DIR/scripts/check_setup.sh\"\n```\n\n如果用户是小白、没有配置 `.env`，或者 `VOLCENGINE_API_KEY` 为空，不要继续抽音频/上传/转录。先用简单中文引导用户：\n\n1. 打开火山引擎控制台：https://console.volcengine.com/\n2. 搜索 `语音识别` / `智能语音` / `豆包语音` / `Speech`\n3. 开通语音识别服务，创建或复制 API Key\n4. 在仓库根目录创建 `.env`：`cp .env.example .env`\n5. 把 Key 填到 `.env`：`VOLCENGINE_API_KEY=你的_key`\n6. 详细教程见：`docs/API_KEY_SETUP.md`\n\n注意：这里要的是**语音识别/ASR Key**，不是随便一个火山方舟大模型 Key。只有检查通过后，才开始处理视频。\n\n默认走**全自动模式**：不打开审核网页，直接输出剪后 MP4、基于剪后 MP4 音频重新识别的 `*_raw_final.srt`，以及经过 AI 字幕文字校对后的 `*_final.srt`。\n\n**重要：`*_final.srt` 必须是 AI 校对后的交付字幕；未经过 AI 校对的 ASR 原稿只能命名为 `*_raw_final.srt`，不能作为最终交付。**\n\n只有用户明确说“我要审核”“打开审核页”“人工确认”时，才走网页审核模式。\n\n```\noutput/\n└── YYYY-MM-DD_视频名/\n    ├── 剪口播/\n    │   ├── 1_转录/\n    │   │   ├── audio.mp3\n    │   │   ├── volcengine_result.json\n    │   │   └── subtitles_words.json\n    │   ├── 2_分析/\n    │   │   ├── readable.txt\n    │   │   ├── auto_selected.json\n    │   │   └── 口误分析.md\n    │   ├── 3_审核/\n    │   │   ├── review.html\n    │   │   ├── video.mp4 → 源视频(符号链接)\n    │   │   ├── *_cut.mp4\n    │   │   ├── *_raw_final.srt          # 剪后音频 ASR 原稿\n    │   │   ├── *_final.srt              # AI 校对后的最终字幕\n    │   │   ├── *_ai_polish_prompt.md\n    │   │   └── *_字幕校对报告.md\n    │   └── 4_成片字幕/\n    │       └── *_mp3_reasr/\n    │           ├── *_final_192k.mp3\n    │           ├── volcengine_result.json\n    │           └── upload_response.json\n    └── 字幕/\n        └── 3_输出/\n            ├── *_raw_final.srt\n            └── *_final.srt\n```\n\n**规则**：已有文件夹则复用，否则新建。\n\n```\n-1. 首次配置检查：bash \"$SKILL_DIR/scripts/check_setup.sh\"\n    ↓\n0. 创建输出目录\n    ↓\n1. 提取音频 (ffmpeg)\n    ↓\n2. 上传获取公网 URL (uguu.se)\n    ↓\n3. 火山引擎 API 转录\n    ↓\n4. 生成字级别字幕 (subtitles_words.json)\n    ↓\n5. AI 分析口误/静音，生成预选列表 (auto_selected.json)\n    ↓\n6. 全自动生成 delete_segments.json（不打开审核网页）\n    ↓\n7. 自动剪辑生成 *_auto_cut.mp4\n    ↓\n8. 从剪后 MP4 抽音频，重新转录，生成 ASR 原始字幕 (*_raw_final.srt)\n    ↓\n9. AI 字幕文字校对：只改文字，不改编号/时间戳/cue 数\n    ↓\n10. 结构校验 + 错词扫描，通过后写入最终字幕 (*_final.srt)\n    ↓\n输出：剪后 MP4 + 最终 SRT\n```\n\n审核网页不是默认路径。只有用户明确要求人工审核时，才执行：\n\n```\n生成 review.html → 启动 review_server.js → 用户确认 → 执行剪辑 → 生成最终字幕\n```\n\n**最终交付字幕必须基于“剪后成片音频”重新识别，再经过 AI 文字校对生成。**\n\n- 原始 `subtitles_words.json` / 原片字幕可以用于分析口误、生成预览和辅助定位。\n- 不要把原片字幕按删除段重排后当作最终字幕交付。\n- 剪辑、重编码、片段拼接、MP3 编码延迟和容器时长差异都会造成累计偏移，典型表现是“越往后越不","previewTruncated":true,"bodyLength":10809,"steps":69,"codeBlocks":23,"hasScripts":true,"missingBins":[],"source":"Backtthefuture/videocut-skills（本机适配 Windows）","license":"MIT","commercialUse":"allow","redistribute":"allow-with-notice","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"Seedance","scene":"文生视频（火山方舟）"},{"name":"doubao","scene":"火山豆包"},{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"image-generation","dir":"image-generation","category":"图像","purpose":"当用户要生成图片时使用：文生图、画图、配图、海报、插画、logo、封面图。","triggers":["生成一张图","画个","配图","文生图","海报","logo","封面"],"boundary":"不适用于视频生成（改走 seedance-video 或 hyperframes 系列），也不适用于页面与前端实现（改走 frontend-verify 及相应开发流程）","description":"当用户要生成图片时使用：文生图、画图、配图、海报、插画、logo、封面图。触发词如\"生成一张图/画个/配图/文生图/海报/logo/封面\"。｜不适用于视频生成（改走 seedance-video 或 hyperframes 系列），也不适用于页面与前端实现（改走 frontend-verify 及相应开发流程）","lead":"首选国内最强文生图 **Seedream（火山方舟）**，备用 CogView（智谱）。","headings":[{"level":1,"text":"文生图（Seedream 优先，程序加字）"},{"level":2,"text":"首选：Seedream 5.0 Pro（火山方舟，画质最强）"},{"level":2,"text":"备用：CogView（智谱）"},{"level":2,"text":"工作流"},{"level":2,"text":"注意事项"}],"preview":"首选国内最强文生图 **Seedream（火山方舟）**，备用 CogView（智谱）。\n\n- key：`~/.dsh/.credentials.yaml` 的 `ARK_API_KEY`\n- 端点：`POST https://ark.cn-beijing.volces.com/api/v3/images/generations`\n- 鉴权：`Authorization: Bearer <ARK_API_KEY>`\n- 请求体：`{\"model\":\"doubao-seedream-5-0-pro-260628\",\"prompt\":\"...\",\"size\":\"1024x1536\",\"response_format\":\"url\"}`\n- 响应：`data[0].url` 是图片链接\n\n- key：`ZAI_CODING_CN_API_KEY`\n- 端点：`POST https://open.bigmodel.cn/api/paas/v4/images/generations`\n- 请求体：`{\"model\":\"cogview-4\",\"prompt\":\"...\",\"size\":\"1024x1024\"}`\n\n1. 确认：画面内容、风格（写实/插画/国风/3D/扁平）、尺寸、数量。\n2. 写详细 prompt：主体 + 风格 + 光线 + 构图 + 质量词。\n3. **文字必须用程序加，不让 AI 直接写中文**（AI 中文会糊/叠）。做法：AI 生成**无字底图**，再用 Python/Pillow 用中文字体（`msyhbd.ttc`）精排标题/副标题。\n4. 读 key → 调 Seedream → 拿 url → 下载到工作目录。\n\n- key 从凭据读取，绝不写进对话/代码。\n- 海报/封面类：底图（AI）+ 文字（Pillow）两步走，保证文字清晰。\n- 人物写实要合规，不生成真实公众人物。","pr 放（无实跑证据），降为 V0","version":"","models":[]},{"name":"book-distillation","dir":"book-distillation","category":"知识与思考","purpose":"当用户要蒸馏/提炼一本书、文章、报告的精华时使用。","triggers":["蒸馏这本书","提炼这本书","读书笔记","这本书讲了什么","帮我拆解下这篇文章","总结要点"],"boundary":"不适用于把流程/经验沉淀成可复用技能（改走 skill-distillation），也不适用于把提炼结果直接写成对外发布稿件（改走 wechat-publish / zimeiti-content）","description":"当用户要蒸馏/提炼一本书、文章、报告的精华时使用。触发词如\"蒸馏这本书/提炼这本书/读书笔记/这本书讲了什么/帮我拆解下这篇文章/总结要点\"。｜不适用于把流程/经验沉淀成可复用技能（改走 skill-distillation），也不适用于把提炼结果直接写成对外发布稿件（改走 wechat-publish / zimeiti-content）","lead":"把一本书/长文蒸馏成可复用的知识，不是简单摘要。","headings":[{"level":1,"text":"蒸馏书（金字塔原理 + 渐进式总结）"},{"level":2,"text":"流程（渐进式总结 Progressive Summarization）"},{"level":2,"text":"结构（金字塔原理）"},{"level":2,"text":"输出格式"},{"level":2,"text":"注意事项"}],"preview":"把一本书/长文蒸馏成可复用的知识，不是简单摘要。\n\n1. **粗读**：提取目录、章节标题、核心结论，建立全貌。\n2. **精读**：标注核心观点、关键论据、数据、案例。\n3. **压缩**：每章/每节压成 1-3 句\"核心观点\"。\n4. **重构**：用自己的话重组，形成原子化知识卡片。\n\n- **结论先行**：一句话说清这本书想解决什么问题、结论是什么。\n- **分论点支撑**：3-7 个分论点，层层展开。\n- **MECE**：相互独立、完全穷尽，不重不漏。\n\n1. **一句话核心**（作者的问题 + 结论）\n2. **知识框架**（核心概念 + 关系，用列表/结构图）\n3. **关键观点卡片**（每条：观点 + 论据 + 怎么用）\n4. **金句 / 案例**\n5. **对我的启发**（能落到你业务/生活哪里）\n\n- 用**自己的话**（费曼原则：能讲给别人听才算真懂），不照抄原文。\n- 蒸馏产物可存进第二大脑（配合 second-brain），也可进一步蒸馏成 skill。\n- 书是 PDF/EPUB 时，先用 Python（pdfplumber / ebooklib）提取文本再蒸馏。\n- 长书分段蒸馏，每段保持\"结论先行\"。","previewTruncated":false,"bodyLength":620,"steps":16,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"insight","dir":"洞察（insight）","category":"知识与思考","purpose":"\"【洞察】 战略洞察 - 用户的“战略合伙人”对话系统。","triggers":["战略洞察","帮我判断","战略合伙人","长期判断"],"boundary":"不适用于执行类任务（改走 active-agent），也不适用于知识库沉淀（改走 second-brain）","description":"\"【洞察】 战略洞察 - 用户的“战略合伙人”对话系统。触发场景：\"。触发词如\"战略洞察/帮我判断/战略合伙人/长期判断\"。｜不适用于执行类任务（改走 active-agent），也不适用于知识库沉淀（改走 second-brain）","lead":"**不敷衍、不讨好，直接指出问题，用数据质疑假设。**","headings":[{"level":1,"text":"洞察 - 战略思考伙伴"},{"level":2,"text":"核心原则"},{"level":2,"text":"执行流程（严格按顺序执行）"},{"level":3,"text":"Phase 1: 信息准备（必须执行）"},{"level":3,"text":"Phase 2: 议题清单（核心！）"},{"level":3,"text":"Phase 3: 逐个深入讨论（关键规则）"},{"level":3,"text":"Phase 4: 结晶提炼"},{"level":2,"text":"YYYY-MM-DD 洞察"},{"level":3,"text":"核心决策"},{"level":3,"text":"待验证事项"},{"level":3,"text":"下次讨论议题"},{"level":1,"text":"YYYY-MM-DD 洞察对话"},{"level":2,"text":"对话背景"},{"level":2,"text":"关键交锋点"},{"level":2,"text":"模式变体"},{"level":3,"text":"--review 模式"},{"level":3,"text":"--focus=主题 模式"},{"level":2,"text":"上下文管理"},{"level":3,"text":"Compact提醒机制"},{"level":3,"text":"讨论进度记忆"},{"level":3,"text":"讨论进度（如未完成）"},{"level":2,"text":"执行检查清单"},{"level":2,"text":"Gotchas（踩过的坑）"},{"level":2,"text":"重要约束"},{"level":2,"text":"触发关键词"}],"preview":"**不敷衍、不讨好，直接指出问题，用数据质疑假设。**\n\n这是你作为用户的“战略合伙人”的深度战略对话。你是**挑战者**，不是**赞同者**。\n\n---\n\n**必须执行以下读取操作：**\n\n1. **读取核心认知文件**\n   - 路径：`YOUR_KNOWLEDGE_BASE_PATH/核心认知.md`\n   - 重点关注：当前优先级事项清单（P0/P1/P2）、最新战略洞察、财务数据\n\n2. **读取历史洞察记录**\n   - 路径：`YOUR_KNOWLEDGE_BASE_PATH/洞察.md`\n   - 重点关注：待验证事项、上次讨论的后续进展、讨论进度\n\n**输出格式：**\n```\n正在准备洞察对话...\n\n已读取：\n- 核心认知文件（更新于：YYYY-MM-DD）\n- 历史洞察记录（上次洞察：YYYY-MM-DD）\n\n当前状态摘要：\n- P0事项：X 项\n- P1事项：X 项\n- 待验证事项：X 项\n```\n\n---\n\n**列出5个待讨论议题，让用户选择序号：**\n\n**挑战维度清单：**\n\n| 维度 | 关注点 |\n|------|--------|\n| **财务** | ROI、现金流、税务、成本结构、资金追回 |\n| **资源** | 团队规模、精力分配、项目数量 |\n| **风险** | 合作风险、平台风险、合规风险 |\n| **决策** | 决策一致性、假设验证、时间线 |\n| **业务** | 转化率、课程产品、战略验证 |\n\n**输出格式：**\n```\n本轮洞察议题清单：\n\n1. [维度] 议题标题\n   简要说明（1-2句话）\n\n2. [维度] 议题标题\n   简要说明\n\n3. [维度] 议题标题\n   简要说明\n\n4. [维度] 议题标题\n   简要说明\n\n5. [维度] 议题标题\n   简要说明\n\n请选择序号（1-5），我们逐个深入讨论。\n```\n\n---\n\n**每次只问一个问题，等待用户回答后再追问。**\n\n**对话节奏：**\n1. 用户选择序号（如\"1\"）\n2. 你针对该议题发起**一个核心质疑**（一个问题）\n3. 等待用户回应\n4. 基于回应**追问或反驳**（继续一个问题）\n5. 推动形成明确决策或待验证假设\n6. 该议题结束后，问\"继续下一个议题？请选择序号，或输入'结束'进行总结\"\n\n---\n\n1. **直接指出问题，不绕弯**\n   - 正确：\"这个决策可能是错的，因为...\"\n   - 错误：\"这个想法很有趣，不过也许可以考虑...\"\n\n2. **用数据和逻辑质疑假设**\n   - 正确：\"你假设转化率能到12%，但历史数据显示最高只有10%，你的依据是什么？\"\n\n3. **追问到底，不轻易放过**\n   - 持续追问：\"为什么？\"\"依据是什么？\"\"如果xxx怎么办？\"\n\n4. **指出自相矛盾**\n   - \"你在核心认知里写过'聚焦原则：团队3人必须做减法'，但现在同时推进8个P0项目，这不矛盾吗？\"\n\n5. **记录具体数据和时间线**\n   - 引用核心认知中的具体数字来支撑挑战\n\n---\n\n**❌ 绝对禁止：**\n- 用户回答后不追问就直接下结论\n- 跳过问题追问直接进入下一个议题\n- 一次性问多个问题\n- 用户说\"先这样吧\"就结束深入讨论\n- 没有追问具体数字和依据就接受回答\n\n**✅ 必须做到：**\n- 每个议题至少追问2-3轮\n- 每次只问一个问题\n- 问具体数字、具体时间、具体依据\n- 挑战用户给出的理由是否充分\n\n---\n\n当用户输入\"结束\"时，执行以下操作：\n\n**追加条目到** `YOUR_KNOWLEDGE_BASE_PATH/洞察.md`\n\n格式：\n```markdown\n---\n\n1. **[决策标题]** - 简要结论\n   - 背景：xxx\n   - 决策：xxx\n   - 风险：xxx\n   - 验证标准：xxx（何时、如何验证）\n\n- [ ] xxx（预计验证时间：xx）\n\n- xxx\n```\n\n**每次洞察session结束后，必须将重要对话精简后追加到** `YOUR_KNOWLEDGE_BASE_PATH/传习录.md`\n\n**精简原则**：\n- 不记完整对话原文，只保留核心交锋点、关键决策和逻辑推导\n- 每个议题压缩为：用户观点 → Codex/Codex挑战 → 最终共识，各1-2句\n- 保留关键数字和时间线，删除过程性讨论\n- 总长度控制在原始对话的10-20%\n\n格式：\n```markdown\n---\n\n- 当前P0事项：xxx\n- 讨论议题：xxx\n\n1. [议题1]\n   - 用户观点：xxx\n   - Codex挑战：xxx\n   - 最终共识：xxx\n```\n\n---\n\n当用户执行 `/洞察 --review` 时：\n\n1. 读取 `洞察.md` 中最近一次的\"待验证事项\"\n2. 逐条检查执行情况\n3. 对未完成事项追问原因\n\n当用户执行 `/洞察 --focus=财务` 时：\n\n- 只生成与该主题相关的5个议题\n- 聚焦该维度深入讨论\n\n---\n\n当对话接近上下文限制时（约85%容量），主动提醒：\n\n```\n⚠️ 上下文提醒：当前对话已接近容量限制。\n建议执行 /compact 保存进度，然后继续讨论。\n\n当前讨论进度：\n- 已完成议题：X, X\n- 进行中议题：X（讨论到：xxx）\n- 待讨论议题：X, X\n```\n\n每次洞察对话，在 `洞察.md` 中记录讨论进度状态：\n\n```markdown\n- **状态**：进行中 / 已完成\n- **已讨论议题**：1, 2\n- **当前议题**：3（转化率验证标准）\n- **当前问题**：xxx\n- **待讨论议题**：4, 5\n```\n\n**继续上次讨论**：当用户执行 `/洞察` 时，先检查 `洞察.md` 是否有未完成的讨论进度：\n- 如有未完成进度，询问：\"上次讨论未完成，是否继续？(继续/重新开始)\"\n- 如选择继续，直接从上次中断的议题和问题继续\n\n---\n\n在流程结束前，确认以下事项：\n- [ ] Phase 1：已读取核心认知和洞察记录\n- [ ] Phase 2：已列出5个议题供用户选择\n- [ ] Phase 3：每个议题至","previewTruncated":true,"bodyLength":3580,"steps":96,"codeBlocks":6,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"knowledge-palace","dir":"知识宫殿（knowledge-palace）","category":"知识与思考","purpose":"\"【知识宫殿】 知识宫殿 - 战略认知更新系统。","triggers":["知识宫殿","战略认知","长期认知库"],"boundary":"不适用于原始会话与近期笔记的存放（那是 M-flow / second-brain 的职责），也不适用于对外成稿（改走 wechat-publish）","description":"\"【知识宫殿】 知识宫殿 - 战略认知更新系统。触发场景：\"。触发词如\"知识宫殿/战略认知/长期认知库\"。｜不适用于原始会话与近期笔记的存放（那是 M-flow / second-brain 的职责），也不适用于对外成稿（改走 wechat-publish）","lead":"知识宫殿不是默认记忆库，而是**精选后的长期认知库**。","headings":[{"level":1,"text":"知识宫殿 - 战略认知更新流程"},{"level":2,"text":"与其他记忆层的边界"},{"level":3,"text":"不该直接放进知识宫殿的内容"},{"level":3,"text":"适合提升到知识宫殿的内容"},{"level":2,"text":"执行流程"},{"level":3,"text":"Step 1: 扫描待分析文件"},{"level":3,"text":"Step 2: 深度分析文件"},{"level":3,"text":"Step 3: 高分内容呈现 + 交互式决策"},{"level":3,"text":"Step 4: 生成 Memo + 更新索引"},{"level":2,"text":"📝 本次更新 Memo（YYYY-MM-DD）"},{"level":3,"text":"核心重点"},{"level":3,"text":"新增/修改的认知条目"},{"level":3,"text":"处理的文件"},{"level":3,"text":"Step 5: 更新核心认知 + 文件归档"},{"level":3,"text":"主题名称（参与者, YYYY-MM-DD, 分数⭐级别）"},{"level":2,"text":"执行检查清单"},{"level":2,"text":"特殊指令"},{"level":2,"text":"核心原则"},{"level":2,"text":"Gotchas（踩过的坑）"},{"level":1,"text":"知识宫殿参考资料"},{"level":2,"text":"归档目录映射表"},{"level":2,"text":"打分系统"},{"level":3,"text":"分数标准"},{"level":3,"text":"打分维度"},{"level":2,"text":"核心认知条目格式"},{"level":3,"text":"主题名称（参与者, YYYY-MM-DD, 分数⭐级别）"},{"level":2,"text":"文件索引更新格式"},{"level":2,"text":"本次处理文件清单（YYYY-MM-DD）"},{"level":3,"text":"核心洞察更新（YYYY-MM-DD）"},{"level":2,"text":"常见场景判断"},{"level":3,"text":"需要决策的问题类型"},{"level":3,"text":"不纳入核心认知的情况"}],"preview":"知识宫殿不是默认记忆库，而是**精选后的长期认知库**。\n\n- **M-flow**：放原始会话重点、历史上下文、近期问题与解法\n- **OpenViking 共享记忆**：放多个 agent 之间需要共用的稳定事实\n- **知识宫殿**：只放高价值、经筛选、适合长期复用的认知\n\n- 完整 session 流水账\n- 普通问答记录\n- 一次性操作步骤\n- 还没验证过的临时想法\n\n- 已验证的重要洞察\n- 稳定可复用的工作流\n- 战略级决策与原因\n- 会反复拿来指导后续行动的经验和教训\n\n1. 读取 `C:/Users/43594/Desktop/MD文件/` 目录下所有 `.md` 文件\n2. 显示文件列表（文件名、修改时间）\n3. 如果没有新文件，告知用户并结束流程\n\n**输出格式**:\n```\n📂 发现 N 个待分析文件：\n1. [文件名] - [修改时间]\n2. ...\n```\n\n对每个文件进行分析，参照 `核心认知.md` 的现有内容：\n\n**分析维度**:\n1. **合并同类项**: 识别与现有板块重叠的内容，标记需要合并的位置\n2. **新增洞察**: 发现全新的战略思考，初步评估其价值\n3. **打分评估**: 使用打分系统评估每条洞察\n4. **冲突检测**: 识别与现有认知冲突或矛盾的观点\n\n**打分系统标准**:\n| 分数范围 | 星级 | 含义 |\n|---------|------|------|\n| 100 | ⭐⭐⭐ | 核心战略、立即重要、经验验证、可直接执行 |\n| 95-98 | ⭐⭐⭐ | 重要战略、已验证、高执行价值 |\n| 90-92 | ⭐⭐ | 重要指导、有参考价值、需要调整 |\n| 85-88 | ⭐ | 参考级、局部适用、需要结合场景 |\n| <85 | 无 | 参考信息，不纳入核心认知 |\n\n**分析方法论**:\n- **双层结构识别**: 区分战略层（面）和执行层（点）\n- **即时反馈识别**: 捕捉核心反应中的重要观点\n\n**呈现格式**（先给概览）:\n```\n📋 本次分析发现 N 个需要决策的问题：\n\n1. [主题1] - [核心主旨1句话]\n2. [主题2] - [核心主旨1句话]\n...\n\n现在开始逐一讨论：\n```\n\n**需要决策的内容类型**:\n- **观点冲突**: 新内容与现有认知冲突，需要确认保留哪个\n- **全新思考**: 全新的战略内容，需要确认是否纳入、归入哪个板块\n- **细节补充**: 重要工作细节不完整，需要用户补充或明确\n\n**交互规则**:\n- 每个问题深入讨论，直到答案清晰\n- 如果用户回答涉及重要延伸信息，主动追问\n- 确认一个问题后，再转下一个\n- 使用 AskUserQuestion 工具进行结构化提问\n\n**Memo 格式**:\n```\n---\n\n- [重点1]\n- [重点2]\n\n| 条目 | 分数 | 操作 | 归属板块 |\n|------|------|------|---------|\n| xxx | 95分⭐⭐⭐ | 新增 | xxx |\n\n- [文件名] → 归档至 [目录]\n---\n```\n\n**索引更新**:\n编辑 `文件索引.md`，添加本次处理记录\n\n**核心认知更新规则**:\n1. 按分数高低插入新洞察（100分在前）\n2. 同分数按日期排序（最新在前）\n3. 合并同类项时保留更完整的版本\n4. 更新优先级清单（P0/P1/P2）如有必要\n\n**洞察条目格式**:\n```markdown\n\n- 要点1\n- 要点2\n\n- 具体行动项\n\n---\n```\n\n**文件归档映射**:\n| 内容主题 | 归档目录 |\n|---------|---------|\n| 战略框架、认知模型 | `01-核心认知/` |\n| 商业模式、运营实践 | `02-业务实战/` |\n| 内容创作、爆款方法 | `03-内容创作/` |\n| AI工具、技术方案 | `04-技术工具/` |\n| 风险管控、合规策略 | `05-风控合规/` |\n| 对外合作、渠道策略 | `06-合作策略/` |\n| 个人复盘、认知升级 | `07-个人思考/` |\n| 数据分析、财务模型 | `08-运营数据/` |\n| 会议纪要 | `09-会议记录/` |\n| 成功案例、模板 | `10-爆款案例/` |\n\n**⚠️ 归档操作（极端重要）**:\n- **正确路径**: `D:/baiang2/柏昂2/知识宫殿/[对应子文件夹]/`\n- **错误路径**: ❌ 不要放在 `C:/Users/43594/Desktop/MD文件/已处理/` 或其他任何临时目录\n- 使用 Bash 的 `mv` 命令直接移动到知识宫殿对应的子文件夹\n- 示例: `mv \"C:/Users/43594/Desktop/MD文件/xxx.md\" \"D:/baiang2/柏昂2/知识宫殿/09-会议记录/\"`\n\n---\n\n在流程结束前，确认以下事项：\n- [ ] 所有待分析文件已读取\n- [ ] 所有决策问题已与用户确认\n- [ ] Memo 已生成并展示给用户\n- [ ] `核心认知.md` 已更新\n- [ ] `文件索引.md` 已更新\n- [ ] 所有已处理文件已归档到对应目录\n\n---\n\n- `/知识宫殿 help` - 显示使用帮助\n- `/知识宫殿 status` - 显示当前核心认知库状态和统计信息\n- 用户说\"继续整理新的md文件\"时，直接执行本流程\n\n---\n\n1. **极简执行**: 用户只需把文件放到待分析目录，说一句\"继续整理\"\n2. **交互式决策**: 重要判断需要用户确认，不擅自决定\n3. **价值优先**: 只纳打分90分以上的战略级认知\n4. **归档到位**: 处理完的文件必须移到正确的知识宫殿子目录\n\n1. **路径曾是占位符** - 已绑定：收件箱 `C:/Users/43594/Desktop/MD文件/`；宫殿 `D:/baiang2/柏昂2/知识宫殿/`；核心认知在宫殿根 `核心认知.md`（不是仓库 TOA3）\n2. **宫殿 ≠ 第二大脑全文** - Obsidian 里 `业务/` `IDEA库/` ","previewTruncated":true,"bodyLength":4549,"steps":78,"codeBlocks":6,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"","version":"","models":[]},{"name":"learning-loop","dir":"学习闭环（learning-loop）","category":"知识与思考","purpose":"把学习材料转成练习、复盘、错题和下次行动，适合读书、课程学习、技能训练和考试准备。","triggers":["学习闭环","错题","读书转练习","复盘练习","技能训练"],"boundary":"不适用于知识库检索（改走 second-brain / notes-research），也不适用于内容成稿（改走 original-writing）","description":"把学习材料转成练习、复盘、错题和下次行动，适合读书、课程学习、技能训练和考试准备。触发词如\"学习闭环/错题/读书转练习/复盘练习/技能训练\"。｜不适用于知识库检索（改走 second-brain / notes-research），也不适用于内容成稿（改走 original-writing）","lead":"让学习从“看过”变成能复述、能操作、能改错。","headings":[{"level":1,"text":"Learning Loop"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"让学习从“看过”变成能复述、能操作、能改错。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n知识卡、练习题、复盘表、下一步计划：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":743,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"memory-boost","dir":"记忆增强（memory-boost）","category":"知识与思考","purpose":"扩展 Codex 跨会话记忆：语义搜索历史、生成结构化报告、写入持久化上下文。","triggers":["跨会话记忆","语义搜索历史","写入持久上下文","翻历史"],"boundary":"只做记忆检索与写入、不写知识内容（要写作改走 second-brain / notes-research）","description":"扩展 Codex 跨会话记忆：语义搜索历史、生成结构化报告、写入持久化上下文。触发词如\"跨会话记忆/语义搜索历史/写入持久上下文/翻历史\"。｜只做记忆检索与写入、不写知识内容（要写作改走 second-brain / notes-research）","lead":"解决 Codex 每次会话都\"失忆\"的问题。通过 Codex-mem MCP 工具管理三类操作：SEARCH（查找历史决策和上下文）、REPORT（生成时间段内的活动报告）、WRITE（将当前会话的关键信息持久化）。这三个模式是独立的，按需触发。","headings":[{"level":1,"text":"记忆增强"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"SEARCH 模式"},{"level":3,"text":"REPORT 模式"},{"level":3,"text":"WRITE 模式"},{"level":2,"text":"输出格式"},{"level":3,"text":"SEARCH 输出"},{"level":2,"text":"搜索结果：[查询词]"},{"level":3,"text":"最相关结果"},{"level":3,"text":"其他相关记录（较低相关性）"},{"level":3,"text":"REPORT 输出"},{"level":2,"text":"[周/月]报告：[日期范围]"},{"level":3,"text":"摘要"},{"level":3,"text":"重要决策（[N] 条）"},{"level":3,"text":"完成的任务（[N] 条）"},{"level":3,"text":"关键洞察（[N] 条）"},{"level":3,"text":"解决的问题（[N] 条）"},{"level":3,"text":"需要延续的上下文"},{"level":3,"text":"WRITE 输出"},{"level":2,"text":"已写入记忆"},{"level":2,"text":"Memory Search 语法参考"},{"level":2,"text":"Gotchas"},{"level":3,"text":"Codex-mem 工具未连接"},{"level":3,"text":"搜索结果不相关"},{"level":3,"text":"WRITE 时内容过多"},{"level":3,"text":"REPORT 时时间范围内记录为空"},{"level":3,"text":"observation 内容不够具体"}],"preview":"解决 Codex 每次会话都\"失忆\"的问题。通过 Codex-mem MCP 工具管理三类操作：SEARCH（查找历史决策和上下文）、REPORT（生成时间段内的活动报告）、WRITE（将当前会话的关键信息持久化）。这三个模式是独立的，按需触发。\n\n---\n\n**SEARCH 模式触发**\n- 用户说\"我之前是怎么决定X的\"\n- 用户说\"上次我们讨论过这个问题，帮我回顾一下\"\n- 新会话开始时，用户说\"先了解一下上下文\"\n- 需要查找特定项目的历史决策\n\n**REPORT 模式触发**\n- 用户说\"生成本周/本月的工作报告\"\n- 用户说\"我最近做了什么，帮我总结\"\n- 用户说\"回顾一下过去 [N] 天\"\n- 周期性总结任务\n\n**WRITE 模式触发**\n- 会话结束时用户说\"帮我把这次讨论的要点存起来\"\n- 重要决策刚刚做出，用户说\"记录这个决定\"\n- 用户说\"把这个上下文保存，下次会话用\"\n- 完成重要任务后的自动归档\n\n---\n\n1. **理解查询意图**\n   - 识别用户想找的是：决策记录 / 任务结果 / 讨论上下文 / 代码实现 / 问题解决方案\n\n2. **构建搜索策略**\n\n   生成 2-3 个搜索查询，覆盖不同角度：\n   - 主查询：用户原始问题的核心词\n   - 近义查询：同义词或相关概念\n   - 上下文查询：项目名/时间/相关人物\n\n3. **执行搜索**\n\n   使用 mcp__plugin_claude-mem_mcp-search__search 工具：\n   - query: [搜索词]\n   - limit: 10-20（初次搜索）\n   - orderBy: relevance（相关性优先）\n\n4. **按相关性排序，获取详情**\n\n   - 从搜索结果中选 Top 3-5 条（按相关性分数）\n   - 使用 get_observations 获取完整内容\n   - 若结果不足，扩展搜索词重试一次\n\n5. **输出搜索结果**（见输出格式）\n\n---\n\n1. **确认报告参数**\n   - 时间范围（默认：最近 7 天）\n   - 报告类型（周报 / 月报 / 项目报告）\n   - 关注维度（全部 / 仅决策 / 仅任务 / 仅问题）\n\n2. **检索时间范围内的所有记录**\n\n   使用 mcp__plugin_claude-mem_mcp-search__search：\n   - dateStart: [N天前的日期，格式 YYYY-MM-DD]\n   - dateEnd: [今天]\n   - limit: 100\n   - orderBy: date\n\n3. **按类别分类所有 observations**\n\n   分类标准：\n   - 决策类：包含\"决定\"、\"选择\"、\"方案\"、\"确定使用\"等关键词\n   - 任务完成类：包含\"完成\"、\"实现\"、\"修复\"、\"发布\"等关键词\n   - 洞察类：包含\"发现\"、\"意识到\"、\"总结\"、\"规律\"等关键词\n   - 问题解决类：包含\"解决\"、\"修复\"、\"原因是\"、\"方法是\"等关键词\n   - 其他：不属于以上类别\n\n4. **生成报告**（见输出格式）\n\n---\n\n1. **收集待存储内容**\n\n   若用户未明确提供，从当前会话历史中提取以下内容：\n   - 重要决策（选择了什么方案及原因）\n   - 完成的任务（做了什么，结果如何）\n   - 发现的规律或洞察\n   - 遇到并解决的问题（问题描述 + 解决方案）\n   - 下次需要知道的上下文\n\n2. **格式化为 observation**\n\n   每条记忆条目格式：\n   - 类型：[决策/任务/洞察/问题解决/上下文]\n   - 项目：[项目名，若适用]\n   - 内容：[一段简洁的陈述，包含足够上下文让未来的自己理解]\n   - 关键细节：[时间、版本号、文件路径等具体信息]\n\n3. **写入 Codex-mem**\n\n   使用对应写入工具。\n\n   写入优先级：\n   - 必写：重要决策（尤其是选择了A而不是B的原因）\n   - 必写：跨会话需要的上下文\n   - 选写：任务完成记录\n   - 不写：临时信息、过程中的试错步骤\n\n4. **确认写入成功**，输出已写入条目列表\n\n---\n\n```\n\n找到 [N] 条相关记录\n\n**[时间戳] — [类型]**\n[记录内容摘要]\n[如果有具体上下文：项目/决策/链接]\n\n**[时间戳] — [类型]**\n[记录内容摘要]\n\n---\n\n- [时间] [简短描述]\n- [时间] [简短描述]\n\n---\n未找到[X]方面的记录。如需深入查找，建议尝试搜索词：[建议词]\n```\n\n```\n\n本期共记录 [N] 条活动，涵盖 [N] 个项目/领域。\n\n---\n\n1. [日期] [决策标题]\n   决定：[做了什么选择]\n   原因：[为什么这样选]\n\n---\n\n1. [日期] [任务描述] → [结果]\n\n---\n\n- [洞察内容]（来源：[日期]）\n\n---\n\n1. [问题]：[解决方案]\n\n---\n\n[下次会话可能需要知道的信息]\n```\n\n```\n\n成功存储 [N] 条记录：\n\n[类型] — [内容简述]（[时间戳]）\n[类型] — [内容简述]（[时间戳]）\n\n未存储（低优先级或临时信息）：\n- [描述]\n```\n\n---\n\n基础关键词搜索：\n  query: \"React 状态管理\"\n\n按项目过滤：\n  project: \"my-project\"\n  query: \"部署配置\"\n\n按时间范围：\n  dateStart: \"2024-01-01\"\n  dateEnd: \"2024-03-31\"\n\n按类型过滤：\n  obs_type: \"decision\"  （或 task / insight / issue）\n\n组合查询：\n  query: \"数据库\"\n  project: \"backend-api\"\n  dateStart: \"2024-10-01\"\n\n按相关性排序（默认）：\n  orderBy: \"relevance\"\n\n按时间排序（报告时用）：\n  orderBy: \"date\"\n\n---\n\n- 症状","previewTruncated":true,"bodyLength":3538,"steps":82,"codeBlocks":3,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"obsidian","dir":"Obsidian笔记（obsidian）","category":"知识与思考","purpose":"Work with Obsidian vaults (plain Markdown notes) and automate via obsidian-cli.","triggers":["Work with Obsidian vaults, notes, or obsidian-cli"],"boundary":"不适用于通用知识沉淀与检索（改走 second-brain），也不适用于非 Obsidian 的笔记体系","description":"Work with Obsidian vaults (plain Markdown notes) and automate via obsidian-cli.Use when: \"Work with Obsidian vaults, notes, or obsidian-cli\".｜不适用于通用知识沉淀与检索（改走 second-brain），也不适用于非 Obsidian 的笔记体系","lead":"Obsidian vault = a normal folder on disk.","headings":[{"level":1,"text":"Obsidian"},{"level":2,"text":"Find the active vault(s)"},{"level":2,"text":"obsidian-cli quick start"}],"preview":"Obsidian vault = a normal folder on disk.\n\nVault structure (typical)\n- Notes: `*.md` (plain text Markdown; edit with any editor)\n- Config: `.obsidian/` (workspace + plugin settings; usually don’t touch from scripts)\n- Canvases: `*.canvas` (JSON)\n- Attachments: whatever folder you chose in Obsidian settings (images/PDFs/etc.)\n\nObsidian desktop tracks vaults here (source of truth):\n- `~/Library/Application Support/obsidian/obsidian.json`\n\n`obsidian-cli` resolves vaults from that file; vault name is typically the **folder name** (path suffix).\n\nFast “what vault is active / where are the notes?”\n- If you’ve already set a default: `obsidian-cli print-default --path-only`\n- Otherwise, read `~/Library/Application Support/obsidian/obsidian.json` and use the vault entry with `\"open\": true`.\n\nNotes\n- Multiple vaults common (iCloud vs `~/Documents`, work/personal, etc.). Don’t guess; read config.\n- Avoid writing hardcoded vault paths into scripts; prefer reading the config or using `print-default`.\n\nPick a default vault (once):\n- `obsidian-cli set-default \"<vault-folder-name>\"`\n- `obsidian-cli print-default` / `obsidian-cli print-default --path-only`\n\nSearch\n- `obsidian-cli search \"query\"` (note names)\n- `obsidian-cli search-content \"query\"` (inside notes; shows snippets + lines)\n\nCreate\n- `obsidian-cli create \"Folder/New note\" --content \"...\" --open`\n- Requires Obsidian URI handler (`obsidian://…`) working (Obsidian installed).\n- Avoid creating notes under “hidden” dot-folders (e.g. `.something/...`) via URI; Obsidian may refuse.\n\nMove/rename (safe refactor)\n- `obsidian-cli move \"old/path/note\" \"new/path/note\"`\n- Updates `[[wikilinks]]` and common Markdown links across the vault (this is the main win vs `mv`).\n\nDelete\n- `obsidian-cli delete \"path/note\"`\n\nPrefer direct edits when appropriate: open the `.md` file and change it; Obsidian will pick it up.","previewTruncated":false,"bodyLength":1943,"steps":19,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"second-brain","dir":"second-brain","category":"知识与思考","purpose":"当用户要记录、整理、检索知识，或建立/使用个人知识库（第二大脑）时使用。","triggers":["记一下","存进知识库","第二大脑","检索我的笔记","查下我记的","知识卡片"],"boundary":"不适用于对外发布的正式稿件（改走 wechat-publish / zimeiti-content），也不适用于会议纪要（改走 meeting-notes）","description":"当用户要记录、整理、检索知识，或建立/使用个人知识库（第二大脑）时使用。触发词如\"记一下/存进知识库/第二大脑/检索我的笔记/查下我记的/知识卡片\"。｜不适用于对外发布的正式稿件（改走 wechat-publish / zimeiti-content），也不适用于会议纪要（改走 meeting-notes）","lead":"采用业界标准 PKM 方法论，把零散信息变成可复用的知识资产。","headings":[{"level":1,"text":"第二大脑（PARA + CODE + Zettelkasten）"},{"level":2,"text":"目录结构（PARA）"},{"level":2,"text":"CODE 流程（Capture → Organize → Distill → Express）"},{"level":2,"text":"卡片规范（Zettelkasten）"},{"level":2,"text":"我如何帮你"},{"level":2,"text":"注意事项"}],"preview":"采用业界标准 PKM 方法论，把零散信息变成可复用的知识资产。\n\n```\n第二大脑/\n  0-收件箱/     # 新想法、临时记录（待整理，每周清空）\n  1-项目/       # 有明确目标和截止日期的事（正在推进的）\n  2-领域/       # 长期负责、需持续维护的（健康/财务/自媒体/工作）\n  3-资源/       # 感兴趣的主题、参考资料（不要求行动）\n  4-归档/       # 已结束、不再活跃的\n```\n\n1. **Capture（捕捉）**：想法/素材先丢进「0-收件箱」，不打断手头事。\n2. **Organize（整理）**：定期整理，按 PARA 归到对应目录。\n3. **Distill（提炼）**：把内容压缩成核心观点，做成原子化卡片。\n4. **Express（表达）**：输出——文章、决策、项目、分享。\n\n- 一张卡片只讲**一个观点**（原子化）。\n- 用**自己的话**写，不摘抄原文。\n- 加标签 + 双向链接 `[[相关卡片]]`。\n- 卡片顶部：一句话结论，下面展开。\n\n- **记**：你说\"记一下 xxx\"→ 我整理成卡片，放进对应 PARA 目录，加标签。\n- **查**：你说\"查我的笔记关于 xxx\"→ 我检索（glob/grep）并汇总。\n- **蒸馏**：配合 book-distillation（把书蒸馏进来）、skill-distillation（把知识变技能）。\n\n- 卡片要短、可复用、可链接；不写长文（长文放\"资源\"）。\n- 定期清空收件箱是第二大脑生效的关键。\n- 知识库根目录约定为 `第二大脑/`，可用 --路径 指定。","previewTruncated":false,"bodyLength":852,"steps":14,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"yizhou-thinking","dir":"一舟思考（yizhou-thinking）","category":"知识与思考","purpose":"\"【yizhou-thinking】 一舟商业思考（yizhou thinking）— 面向内容型个人IP、小团队知识付费、直播成交、平台经营、产品迭代与AI无人公司的统一商业判断 skill。用于：诊断生意卡点、分析内容与直播转化、判断平台风险与合规、评估产品/报价/训练营设计、做战略取舍，以及把内容型个人IP的经营逻辑沉淀成可复用的判断系统。当用户提到“一舟商业思考 / yizhou thinking / 商业思考 skill / 商业思考模型 / 按这套方式判断 / 帮我诊断这个生意 / 帮我看内容
