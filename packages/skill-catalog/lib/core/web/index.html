<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能总览 · DSH</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1115'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%235b8cff' font-family='monospace'%3E%E2%97%86%3C/text%3E%3C/svg%3E">
<style>
:root{
  /* 与 dshm / cost-manager 看板共用同一套设计令牌。
     变量**名**也必须一致（--border/--text/--muted/--panel2/--radius…），
     否则三份页面之间没法互相复制样式，只能各写各的。 */
  --bg:#0f1115; --panel:#161a22; --panel2:#1c212c; --border:#2a3140;
  --text:#e6e9ef; --muted:#8b93a5;
  --accent:#5b8cff; --green:#3ecf8e; --yellow:#f5c542; --red:#f26d6d;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
/* 页头：与 dshm / cost-manager 完全同构 —— brand(含 span 副标题) + toolbar */
header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1px solid var(--border);
  background:var(--panel);position:sticky;top:0;z-index:10}
.brand{font-size:17px;font-weight:700}
.brand span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.toolbar{display:flex;align-items:center;gap:16px}
.toolbar a{color:var(--accent);text-decoration:none}
button{background:var(--accent);color:#fff;border:0;border-radius:7px;
  padding:6px 14px;cursor:pointer;font-size:13px}
button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
button:disabled{opacity:.55;cursor:default}
label.inline{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:20px 22px 60px}
/* 统计卡：与另两页同款 .cards/.card 语法 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:24px;font-weight:700;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input[type=search],select{background:var(--panel);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:6px 10px;font:inherit;font-size:13px;outline:none}
input[type=search]{min-width:260px;flex:1}
input[type=search]:focus,select:focus{border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--accent)}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
td{padding:9px 10px;vertical-align:top}
.name{color:var(--accent);font-weight:600;white-space:nowrap}
.cat{color:var(--muted);white-space:nowrap;font-size:12px}
.purpose{max-width:520px}
.trg{display:flex;flex-wrap:wrap;gap:4px;max-width:300px}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:5px;
  padding:0 5px;font-size:11px;white-space:nowrap;display:inline-block;margin-right:4px;margin-bottom:3px}
.chip.m{color:var(--accent)}
.chip.n{color:var(--yellow);border-color:#4a3f22}
.lv{font-size:11px;border-radius:4px;padding:1px 6px;white-space:nowrap}
.lv.V2{background:#122a1f;color:var(--green);border:1px solid #1f5c37}
.lv.V0{background:#2a2418;color:var(--yellow);border:1px solid #4a3f22}
.up{color:var(--muted);font-size:11px}
dialog{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:var(--radius);
  max-width:900px;width:93vw;max-height:88vh;padding:0;
  /* dialog 默认 overflow:auto（会多出一条滚动条）；只让 .db 滚 */
  overflow:hidden;display:none;flex-direction:column}
dialog[open]{display:flex}
dialog::backdrop{background:#000c}
.dh{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--panel);z-index:2}
.dh h2{margin:0 0 6px;font-size:17px;color:var(--accent);padding-right:70px}
.dh .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.db{padding:16px 20px 28px;overflow:auto;flex:1;min-height:0}
.sec{margin:0 0 18px}
.sec h3{margin:0 0 6px;font-size:12px;color:var(--accent);letter-spacing:1px}
.sec p{margin:0 0 6px}
.muted{color:var(--muted)}
.toc{margin:0;padding-left:18px;color:var(--muted)}
.toc li{margin:2px 0}
.toc li.l1{color:var(--text)}
pre.preview{margin:8px 0 0;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-size:12px;line-height:1.55;white-space:pre-wrap}
/* 弹窗打开时锁住页面滚动：否则会出现「页面 + 弹窗体 + 正文预览」三层滚动条 */
body:has(dialog[open]){overflow:hidden}
.close{position:absolute;right:12px;top:12px;background:none;border:1px solid var(--border);
  color:var(--muted);border-radius:7px;padding:3px 9px;cursor:pointer;font:inherit}
.close:hover{color:var(--red);border-color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{max-width:1180px;margin:0 auto;padding:0 22px 40px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand">技能总览<span>（非聊天）· 对话请用原生 Web GUI</span></div>
  <div class="toolbar">
    <a href="/cost" target="_blank" rel="noopener">费用与余额 ↗</a>
    <a href="/dshm" target="_blank" rel="noopener">会话管理 ↗</a>
    <a href="/" target="_blank" rel="noopener">打开 Web GUI ↗</a>
    <label class="inline"><input type="checkbox" id="autoRefresh" checked> 自动刷新</label>
    <button class="ghost" id="reload" title="重新读取技能目录">刷新</button>
  </div>
</header>
<main>
  <div class="cards" id="stats"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="搜索：名称 / 用途 / 触发词 / 分类 …">
    <select id="fcat"></select>
    <select id="fsrc"><option value="">全部来源</option><option>自建</option><option>上游</option></select>
    <select id="flev"><option value="">全部级别</option><option>V2</option><option>V0</option></select>
    <select id="sort">
      <option value="cat">按分类</option>
      <option value="name">按名称 A→Z</option>
      <option value="size">按正文长度 ↓</option>
    </select>
  </div>
  <div class="panel">
    <table>
      <thead><tr>
        <th data-s="name">技能</th><th data-s="cat">分类</th><th>干什么用</th>
        <th>触发条件</th><th>关联模型</th><th data-s="level">验证</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">没有匹配的技能</div>
  </div>
</main>
<footer id="gen"></footer>

<dialog id="dlg">
  <button class="close" onclick="document.getElementById('dlg').close()">关闭</button>
  <div class="dh"><h2 id="d-name"></h2><div class="meta" id="d-meta"></div></div>
  <div class="db" id="d-body"></div>
</dialog>

":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"deepseek-v4-pro","scene":"复杂推理 / 深度分析"},{"name":"Kimi","scene":"中文写作 / 长文档"},{"name":"GLM","scene":"纯编程 / 技术方案"},{"name":"Seedream","scene":"文生图（火山方舟）"},{"name":"Seedance","scene":"文生视频（火山方舟）"}]},{"name":"cost-manager","dir":"cost-manager","category":"办公与效率","purpose":"当需要管理 AI 花费、查平台余额、决定用哪个模型、或在生成付费内容前后报价与记账时使用。","triggers":["多少钱","成本","余额","该用哪个模型","报价","预算","这个要花多少","值不值"],"boundary":"不适用于非 AI 成本核算（人工、场地、差旅等）——那属于 business-analysis；也不适用于单纯闲聊模型优劣而不涉及成本（改走 model-routing）","description":"当需要管理 AI 花费、查平台余额、决定用哪个模型、或在生成付费内容前后报价与记账时使用。触发词如\"多少钱/成本/余额/该用哪个模型/报价/预算/这个要花多少/值不值\"。｜不适用于非 AI 成本核算（人工、场地、差旅等）——那属于 business-analysis；也不适用于单纯闲聊模型优劣而不涉及成本（改走 model-routing）","lead":"统一管理各平台**余额、状态、单价、擅长场景、质量评级**，并给每一次生成**记账**，让\"花了多少、该用谁、一个成品多少钱\"随时可查。","headings":[{"level":1,"text":"费用与能力管理（cost-manager）"},{"level":2,"text":"工具位置"},{"level":2,"text":"命令"},{"level":2,"text":"硬性纪律（必须遵守）"},{"level":2,"text":"欠费预警与模型切换"},{"level":2,"text":"防死机制（硬规则，不许把自己玩到停机）"},{"level":2,"text":"数据口径"},{"level":2,"text":"何时更新 catalog"}],"preview":"统一管理各平台**余额、状态、单价、擅长场景、质量评级**，并给每一次生成**记账**，让\"花了多少、该用谁、一个成品多少钱\"随时可查。\n\n```\n工具/cost-manager/cost.mjs      ← 主 CLI\n工具/cost-manager/catalog.json  ← 模型目录（单价/场景/质量/状态）\n工具/cost-manager/ledger.jsonl  ← 花费账本（每笔一行）\n工具/cost-manager/dashboard.html← 生成的总览页\n工具/cost-check/balances.mjs    ← 余额查询模块（被 CLI 复用，也可单独跑）\n```\n\n```bash\nnode 工具/cost-manager/cost.mjs status                      # 各平台余额与状态（实时）\nnode 工具/cost-manager/cost.mjs catalog --kind image        # 模型目录\nnode 工具/cost-manager/cost.mjs recommend --scene 封面 --budget 0.5   # 按场景+预算推荐\nnode 工具/cost-manager/cost.mjs estimate --list             # 成品预算清单\nnode 工具/cost-manager/cost.mjs estimate --recipe wechat-article-free\nnode 工具/cost-manager/cost.mjs log --platform MXAPI --model nano-banana-2 --qty 1 --cost 0.2 --item 公众号配图\nnode 工具/cost-manager/cost.mjs report --days 30            # 花费报表\nnode 工具/cost-manager/cost.mjs dashboard                   # 生成总览页\nnode 工具/cost-manager/cost.mjs serve --port 8899           # 实时监控页（30 秒自动刷新）\nnode 工具/cost-manager/cost.mjs guard --cost 12             # 预算闸门（超过上限退出码 1）\nnode 工具/cost-manager/cost.mjs config set budgetCapCny 10  # 改闸门金额\n```\n\n1. **先报价，后生成**：任何会产生 API 费用的生成（图片/视频/数字人/TTS/长文），**先跑 `estimate` 或 `catalog/recommend` 报出预估成本并等用户确认**，不得直接开跑。\n2. **预算闸门兜底**：单次生成预计金额 **超过 `budgetCapCny`（默认 ¥5）** 时，`guard --cost` 会退出码 1 提示需人工确认——即使用户此前说过\"帮我做\"，也要在超过闸门时停下来再确认一次。\n3. **生成后必须记账**：`log --platform … --model … --qty … --cost … --item …`。\n   - 成本已知（平台回传扣费）→ 填真实数字；\n   - 成本未知 → `--cost unknown`（**绝不许编造数字**），事后再补。\n4. **先看 0 成本方案**：配图/封面优先 `本机/html-render`（HTML 渲染真实数据，¥0 且文字绝不糊）；配音一律 `本机/edge-tts`；剪辑一律 `本机/ffmpeg`。\n5. **同一模型优先便宜平台**：例如 `nano-banana-2` 走 MXAPI（¥0.20）而不是 Evolink（¥0.24）；`gpt-image-2` 走 MXAPI（¥0.10）而不是 Evolink（¥0.324）。\n6. **价格来源必须标注**：`实测 > 官方价 > 估算`。**估算不能当实测用**，也不许把估算说成确定成本。\n7. **质量评级不许夸大**：`basis=objective` 的评级只依据客观指标（细节量/速度/是否崩坏/是否实测）；**审美结论必须等用户确认后**才写入 `byUser`，在此之前说\"待人工确认\"，不说\"最好\"。\n8. **余额预警（硬规则）**：余额偏低的平台**必须主动提醒用户并给出切换方案**，不得沉默。\n   - 判断依据是 `status` / 实时页的 ⚠️ 标记，不是猜。\n   - 当前备用关系（据余额）：**DeepSeek 见底 → 切 Kimi（`moonshotai-cn`，¥99）或 GLM（`zai-coding-cn` 的 glm-5.2）**；图像生成优先 MXAPI；配音用本机 edge-tts。\n   - 切换后确认新模型能用，并在账本记一笔（`item: 模型切换`）。\n9. **新平台/新模型接入**：先查余额与单价接口 → 实测一张/一次拿到真实单价 → 再写进 `catalog.json`（单价标 `measured`，附证据）。\n\n- ⚠️ 标记：`status` 命令与实时页（`http://127.0.0.1:8899/`）已自动标出低于 `lowBalanceAlert` 的平台。\n- 默认预警线：DeepSeek ¥10、Kimi ¥20、Evolink ¥60、火山 ¥50、MXAPI ¥50（`config set alert.<平台> <金额>` 调整）。\n- **DeepSeek 是当前会话默认模型、烧得最快**——一旦跌破 ¥10，就提示切默认模型到 Kimi，并说明新模型余额与能力。\n\n- **开工前自检**：任何较长的付费工作（批量出图、跑视频、长文、多步 Agent 任务）开始前，先跑 `node 工具/cost-manager/cost.mjs preflight`。\n- **硬地板**：`balanceFloor`（默认 DeepSeek ¥8","previewTruncated":true,"bodyLength":3762,"steps":29,"codeBlocks":2,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V2","evidence":"2026-09-11 复验（正文变更后重新验收）：status 实时查 6 家平台余额成功（DeepSeek ¥143.43 / Kimi ¥99.43 / Evolink 382cr≈¥37.86 / 火山 ¥261.98 / MXAPI 19431积分 / 智谱免费探测 510ms，LabNana 超时已文档化）；消耗速率计算正常（¥0.13/h，距硬地板 43.2 天）；guard 闸门放行与拦截两态；catalog 12 项；estimate 6 个成品预算；全部 exit 0","note":"费用管理插件验收版；正文在验证之后被修改，原验证结论不适用于当前内容，需重新验证","version":"","models":[{"name":"Kimi","scene":"中文写作 / 长文档"},{"name":"GLM","scene":"纯编程 / 技术方案"},{"name":"nano-banana","scene":"文生图（MXAPI）"},{"name":"gpt-image","scene":"文生图（含画面文字）"},{"name":"edge-tts","scene":"本机免费配音"},{"name":"ffmpeg","scene":"本机视频处理"}]},{"name":"dashi-ppt","dir":"dashi-ppt","category":"办公与效率","purpose":"制作 PPT、演示文稿、幻灯片、汇报材料时使用。Dashi PPT 基于预置视觉主题组合页面,生成可离线打开、可在浏览器编辑的 HTML 演示,支持导出 PPTX / PDF 文件。","triggers":["做PPT","演示文稿","幻灯片","汇报材料","HTML演示"],"boundary":"不适用于只想要大纲与讲稿（改走 ppt-outline）、Word/Excel 文件（改走 office-docs）、公众号图文排版（改走 wechat-publish）","description":"制作 PPT、演示文稿、幻灯片、汇报材料时使用。Dashi PPT 基于预置视觉主题组合页面,生成可离线打开、可在浏览器编辑的 HTML 演示,支持导出 PPTX / PDF 文件。触发词如\"做PPT/演示文稿/幻灯片/汇报材料/HTML演示\"。｜不适用于只想要大纲与讲稿（改走 ppt-outline）、Word/Excel 文件（改走 office-docs）、公众号图文排版（改走 wechat-publish）","lead":"Dashi PPT 生成静态 HTML 横向翻页 PPT。使用本 skill 时,先把用户的自然语言需求整理成 JSON 计划,再调用本地项目生成器输出 `index.html` 和 `assets/`。","headings":[{"level":1,"text":"Dashi PPT"},{"level":2,"text":"版本"},{"level":2,"text":"Skill 目录"},{"level":2,"text":"生成原则"},{"level":2,"text":"使用规则"},{"level":2,"text":"媒体工作流"},{"level":2,"text":"工作流"},{"level":2,"text":"成果验收与返工"},{"level":2,"text":"JSON 结构"},{"level":2,"text":"页面角色"},{"level":2,"text":"交付能力"},{"level":2,"text":"页面属性契约"},{"level":2,"text":"校验"}],"preview":"Dashi PPT 生成静态 HTML 横向翻页 PPT。使用本 skill 时,先把用户的自然语言需求整理成 JSON 计划,再调用本地项目生成器输出 `index.html` 和 `assets/`。\n\n当前版本: `0.4.5`\n\n每次完成用户请求、准备最终回复前,运行:\n\n```bash\nnode <skill-root>/scripts/check_latest_version.mjs\n```\n\n如果脚本有输出,把输出内容附在最终回复末尾提醒用户更新;如果脚本无输出或检查失败,保持静默,不要提版本检查。\n\n当前 `SKILL.md` 所在目录就是 Skill 根目录,下文记为 `<skill-root>`。\n\n内置生成器目录:\n\n`<skill-root>/project`\n\n渲染脚本:\n\n- macOS / Linux: `<skill-root>/scripts/render_goal_deck.sh`\n- Windows PowerShell: `<skill-root>/scripts/render_goal_deck.ps1`\n\n版本检查脚本:\n\n`<skill-root>/scripts/check_latest_version.mjs`\n\n本 Skill 是模板编排器。默认目标是快速、稳定地把用户需求套入已登记页面组件,输出可离线打开的 HTML PPT。\n\n默认模式是“锁模板填文案”:保留所选页面组件的原始视觉、结构、数量、显隐、强调、配色、图表类型和图片槽位,只替换可见文字内容。除非用户明确要求调整页面属性,不要改任何非文案 props。\n\n成果验收是默认流程。每次生成后都要判断最终产物是否达到用户目标;默认检查目标、内容、结构、明显可见问题和交付完整性,不做截图审美精修,不因普通断行反复返工。用户明确要求“视觉精修”“100% 检查”“帮我调到满意”时,再扩展为视觉 QA。\n\n- 运行生成器需要 Node.js 20+ 和 npm;首次生成时渲染脚本会在 Skill 内置 `project/` 目录安装依赖。Windows 用 `render_goal_deck.ps1`(直接 PowerShell,不经 WSL/bash);macOS / Linux 用 `render_goal_deck.sh`。\n- 风格选择提问:用户可见回复必须嵌入 `<skill-root>/assets/skill/theme-style-grid.png` 的 Markdown 图片,先展开绝对路径;这是回复展示用内置风格图,不可写入 `goal.json` 或任何 media 字段;列出当前可选风格和极简“适合/人群”,不能只在内部进度提示中提到风格图。\n- 开工前确认两件事:主题风格、是否需要图片/视频。用户未明确表达且非整体委托时,先提问等答复,不得代选;无法提问的环境(脚本/批处理)才自选,并在交付说明中列出所选与理由。\n- 委托模式:仅当用户对整体明确委托(“都你来定”“不用问,直接开干”)时,才自选主题、默认 HTML、默认不使用 image-gen,最终说明假设。用户只说内容/文案“随意”“自拟”时,仅自拟内容;风格、页数、媒体等已给的不得擅自改变,未给的按上一条先问。\n- 非交互/一次性执行(无法追问)时:未指定风格按内容主题自选已验收主题;无真实素材且不能生图时优先选无媒体页,不调 image-gen;最终说明全部假设。\n- Deck 语言跟随用户沟通语言:非中文用户在 `goal.json` 顶层加 `\"language\": \"en\"`;全部文案字段用目标语言撰写,页面自带的默认中文文案(含结尾页“感谢阅读”类装饰字段)一律覆盖,不得残留中文。编辑器界面语言自动跟随打开者的系统语言,右上角可手动切换,无需在生成时处理。\n- 交付格式:默认 HTML;“生成 PPT”“做 PPT”“做一个 PPT”“制作 ppt”表示 PPT 呈现形态。只有明确 `PPTX`、`PowerPoint`、`可编辑 PPTX`、`导出 PPTX`、`PPT 格式` 或“格式/文件类型为 PPT/PPTX”时才交付 PPTX 文件。\n- PPTX 文件:仍先生成 HTML 并启动本机预览服务,再调用本机 HTTP 导出服务;最终只给 PPTX 文件路径或下载结果。\n- 当前可选风格: `theme01` 轻拟态风、`theme02` 炫光紫绿风、`theme03` 深浅代码风、`theme04` 玻璃糖果风、`theme05` 色谱图表风、`theme06` 深色图谱风、`theme07` 冷白调研风、`theme08` 黑金实验风、`theme09` 深蓝杂志风、`theme10` 金色指数风、`theme11` 高能增长风、`theme12` 声波霓虹风。\n- 普通自动选择不选 `theme10`;只有用户明确指定,或金融/投资指数内容强相关且 inspect 确认可填时才用。\n<!-- theme-choice-hints:start -->\n  - `theme01` 轻拟态风 | 适合: 产品介绍 / 企业汇报 | 人群: 创业团队 / 产品经理\n  - `theme02` 炫光紫绿风 | 适合: 科技发布会 / AI/自动驾驶/机器人主题 | 人群: 科技公司创始人 / 技术负责人\n  - `theme03` 深浅代码风 | 适合: 技术方案 / 开发者大会 | 人群: 工程师 / 技术管理者\n  - `theme04` 玻璃糖果风 | 适合: 年轻化品牌 / 消费产品 | 人群: 品牌团队 / 设计师\n  - `theme05` 色谱图表风 | 适合: 数据报告 / 市场分析 | 人群: 数据分析师 / 咨询顾问\n  - `theme06` 深色图谱风 | 适合: 高密度数据展示 / 战略分析 | 人群: 战略团队 / 投资人\n  - `theme07` 冷白调研风 | 适合: 调研报告 / 白皮书 | 人群: 研究机构 / 咨询团队\n  - `theme08` 黑金实验风 | 适合: 高端发布 / 品牌提案 | 人群: 高端品牌 / 创意总监\n  - `theme09` 深蓝杂志风","previewTruncated":true,"bodyLength":11649,"steps":87,"codeBlocks":5,"hasScripts":true,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"docx-report-builder","dir":"报告文档生成（docx-report-builder）","category":"办公与效率","purpose":"生成可交付的 DOCX 报告结构、正文、表格和审阅清单，适合咨询报告、调研报告、课程讲义和项目复盘。","triggers":["生成DOCX","Word报告","调研报告","咨询报告"],"boundary":"不适用于公文与商务文书（改走 business-writing），也不适用于 PPT（改走 yizhou-ppt / office-docs）","description":"生成可交付的 DOCX 报告结构、正文、表格和审阅清单，适合咨询报告、调研报告、课程讲义和项目复盘。触发词如\"生成DOCX/Word报告/调研报告/咨询报告\"。｜不适用于公文与商务文书（改走 business-writing），也不适用于 PPT（改走 yizhou-ppt / office-docs）","lead":"把内容做成能发给别人看的正式文档，而不是聊天式回答。","headings":[{"level":1,"text":"Docx Report Builder"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把内容做成能发给别人看的正式文档，而不是聊天式回答。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n报告目录、正文草稿、表格清单、审阅项：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出 ":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"file-organization","dir":"file-organization","category":"办公与效率","purpose":"当用户要整理文件、归类、批量重命名、去重、清理杂乱目录时使用。","triggers":["整理文件","归类","重命名","清理","文件太乱","去重","归档"],"boundary":"不适用于发票专项整理（改走 invoice-processing）；内容创作类需求不属于它","description":"当用户要整理文件、归类、批量重命名、去重、清理杂乱目录时使用。触发词如\"整理文件/归类/重命名/清理/文件太乱/去重/归档\"。｜不适用于发票专项整理（改走 invoice-processing）；内容创作类需求不属于它","lead":"把乱目录理成有规律、可维护的结构。","headings":[{"level":1,"text":"文件整理与归类"},{"level":2,"text":"工作流"},{"level":2,"text":"重命名规则（示例）"},{"level":2,"text":"安全（重要）"},{"level":2,"text":"注意事项"}],"preview":"把乱目录理成有规律、可维护的结构。\n\n1. **扫描**：先列目录结构和文件类型分布（用 glob / Get-ChildItem），别急着动手。\n2. **定规则**：和用户确认归类维度——按类型 / 按项目 / 按日期 / 按用途。\n3. **执行**：建文件夹 → 移动文件 → 重命名（规则要清晰一致）。\n4. **报告**：整理后输出「移动了哪些 + 新目录树」。\n\n- 通用：`日期_主题_版本.扩展名`，如 `2026-09-04_方案_v2.docx`\n- 发票：`金额_日期_抬头`（配合 invoice-processing skill）\n- 避免：中文乱码、空格、`()`、特殊字符\n\n- 移动/重命名前，先列「即将执行的操作清单」，**用户确认后再动**。\n- 记录原路径清单（可回滚）。\n- **不删文件**；用户明确要删时，删除前二次确认。\n- 不碰系统文件、隐藏文件、正在被占用的文件。\n- 大批量操作分批做，每批可中断。\n\n- 扫描结果先让用户看到全貌，再提归类建议。\n- 拿不准归类的文件放「待归类」目录，别硬塞。","previewTruncated":false,"bodyLength":527,"steps":14,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"invoice-processing","dir":"invoice-processing","category":"办公与效率","purpose":"当用户要整理发票、按金额重命名发票文件、把发票信息汇总成 Excel 时使用。","triggers":["整理发票","发票汇总","按金额重命名发票","发票Excel","替票","报销发票"],"boundary":"不适用于一般文件归类（改走 file-organization），也不适用于财务分析（改走 business-analysis）","description":"当用户要整理发票、按金额重命名发票文件、把发票信息汇总成 Excel 时使用。触发词如\"整理发票/发票汇总/按金额重命名发票/发票Excel/替票/报销发票\"。｜不适用于一般文件归类（改走 file-organization），也不适用于财务分析（改走 business-analysis）","lead":"把一堆发票文件（PDF、图片）识别成结构化信息，按金额重命名文件，并生成一份 Excel 汇总表。","headings":[{"level":1,"text":"发票整理、按金额重命名与 Excel 汇总"},{"level":2,"text":"1. 先确认范围"},{"level":2,"text":"2. 提取发票信息（每张都要拿到）"},{"level":2,"text":"3. 按金额重命名"},{"level":2,"text":"4. 生成 Excel 汇总（openpyxl）"},{"level":2,"text":"5. 输出"},{"level":2,"text":"注意事项"}],"preview":"把一堆发票文件（PDF、图片）识别成结构化信息，按金额重命名文件，并生成一份 Excel 汇总表。\n\n- 确认发票所在目录（用户说的工作目录或指定目录）。若目录为空，先询问用户文件在哪，不要臆测去别的月份/项目目录里找。\n- 确认输出：重命名规则、Excel 需要哪些列、是否按金额排序。\n- 用 `glob` / `Get-ChildItem -Recurse` 列出目录下所有 `*.pdf *.jpg *.jpeg *.png *.ofd`。\n\n| 字段 | 说明 |\n|---|---|\n| 发票号码 | 电子发票右上角 20 位数字 |\n| 开票日期 | 如 2026年7月20日 |\n| 项目名称 | 如「*生产生活服务*代订机票」「代订住宿费」 |\n| 销售方名称 / 税号 | 销方 |\n| 购买方名称 / 税号 | 购方（报销主体） |\n| 价税合计 | **用于重命名的金额**，以「(小写)¥」为准 |\n| 不含税金额 / 税额 / 税率 | 明细，用于 Excel 合计 |\n| 备注 | 携程订单号、运单号等 |\n\n**提取手段**：\n\n- **PDF**：优先用 `pymupdf` 直接抽文本层。若抽出来是乱序/空，再转图片走 OCR。\n  ```python\n  import pymupdf  # 旧版是 import fitz\n  d = pymupdf.open(path); print(d[0].get_text())\n  ```\n- **图片（jpg/png）**：用 Windows 内置 OCR（无需联网、支持中文）。脚本见 `references/ocr-windows.md`，`powershell.exe -NoProfile -ExecutionPolicy Bypass -File ocr.ps1 -Path <图片>`。\n  - 模型本身若不能读图（read_image 报 \"does not declare image input\"），不要反复重试，直接走 OCR。\n  - OCR 首选 `zh-Hans-CN`；数字/日期用「小写金额」和「大写金额」互相校验。\n- 若 tesseract 没有中文包、又无法联网下载，用 Windows OCR（`[Windows.Media.Ocr.OcrEngine]`）兜底，这是最稳的无网方案。\n\n**金额校验**：价税合计「小写 ¥」必须与「大写（…圆…角…分）」一致；税率 6% 时，税额 ≈ 不含税金额 × 0.06，价税合计 = 不含税金额 + 税额。对不上的标注存疑，别硬凑。\n\n命名规范（沿用 `序号_发票_金额元_说明.扩展名`）：\n\n```\n01_发票_800.00元_代订机票.jpg\n05_发票_1605.50元_代订住宿费.pdf\n```\n\n- 金额取「价税合计」，保留两位小数，如 `800.00`、`1584.92`。\n- 说明用简短项目名：代订机票 / 代订住宿费 / 快递费 等。\n- **金额相同的多张**：用 `01/02/03` 序号区分，序号按金额升序、金额相同再按发票号码升序。\n- 保留原扩展名；先 `os.rename` 再生成 Excel（Excel 里要记录「原文件名 → 新文件名」对应关系）。\n- 命名后重跑一次目录列表，确认没有漏改、没有同名覆盖。\n\n列（参考模板 `references/rename-and-excel.md`）：\n\n```\n序号 | 原文件名 | 新文件名 | 发票号码 | 开票日期 | 项目名称 |\n销售方名称 | 销售方税号 | 购买方名称 | 购买方税号 |\n价税合计(元) | 不含税金额(元) | 税率 | 税额(元) | 备注\n```\n\n- 表头加粗白字蓝底、冻结首行、金额列 `number_format=\"0.00\"`。\n- 底部加**合计行**：价税合计、不含税金额、税额三项求和。\n- 文件名用 `xxx发票汇总.xlsx`，存到发票同目录。\n\n- 重命名后的文件清单（旧名 → 新名）。\n- Excel 路径 + 汇总数字（发票张数、价税合计、不含税合计、税额合计）。\n- 对 OCR 拿不准的字段（订单号、人名、税号）单独列一行「需你核对」，不要静默猜。\n\n- 不虚构发票号码、金额、日期；OCR 结果要人工读一遍，明显的形近字（工/1、O/0、S/5）要结合上下文修正。\n- 金额是重命名的依据，务必以「价税合计」为准，不是「不含税金额」。\n- 用完的临时脚本（_ocr.ps1、_process.py）删掉，只留发票文件 + Excel，保持目录干净。","previewTruncated":false,"bodyLength":2058,"steps":22,"codeBlocks":3,"hasScripts":false,"missingBins":["tesseract"],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"依赖澄清(2026-09-11核查)：tesseract 为可选项——技能自带无网兜底 Windows.Media.Ocr(zh-Hans-CN)，不装也能用。判定为不阻断，且非当前内容工作流","version":"","models":[]},{"name":"meeting-notes","dir":"meeting-notes","category":"办公与效率","purpose":"当用户要整理会议纪要、会议记录、会后待办，或把零散的会议笔记/录音文字整理成结构化纪要时使用。","triggers":["会议纪要","整理会议","会后待办","纪要格式"],"boundary":"不适用于会议安排与日程（改走 scheduling），也不适用于会后正式汇报（改走 work-report）","description":"当用户要整理会议纪要、会议记录、会后待办，或把零散的会议笔记/录音文字整理成结构化纪要时使用。触发词如\"会议纪要/整理会议/会后待办/纪要格式\"。｜不适用于会议安排与日程（改走 scheduling），也不适用于会后正式汇报（改走 work-report）","lead":"把\"流水账\"整理成\"谁在什么时候决定了什么、谁去做什么\"。","headings":[{"level":1,"text":"会议纪要"},{"level":2,"text":"1. 纪要固定结构"},{"level":2,"text":"2. 整理原则"},{"level":2,"text":"3. 待办表格格式"},{"level":2,"text":"4. 输出格式"},{"level":2,"text":"注意事项"}],"preview":"把\"流水账\"整理成\"谁在什么时候决定了什么、谁去做什么\"。\n\n按以下六块输出，缺的信息标注【待补充】：\n\n1. **基本信息**：会议名称、时间、地点、主持人、参会人、缺席人。\n2. **会议主题/背景**：一句话说明本次要解决什么。\n3. **讨论要点**：按议题分条，每条「结论 + 关键分歧 + 谁的观点」，不记流水账。\n4. **决议事项**：明确\"定下来什么\"，编号列出，这是纪要的核心。\n5. **待办事项（Action Items）**：表格——任务 / 负责人 / 截止时间 / 交付物。\n6. **下次安排**：时间、议题预告（如有）。\n\n- 只保留\"决定、分歧、行动\"，删掉寒暄和重复。\n- 观点要标注归属（\"张三提出…\"），避免写成无主结论。\n- 待办必须有「负责人 + 截止时间」，缺了就标【待定】而不是编造。\n- 有争议未决的事项单列\"待决议\"，不要混进\"决议事项\"。\n\n| 序号 | 任务 | 负责人 | 截止时间 | 交付物/验收标准 |\n|---|---|---|---|---|\n| 1 | … | … | … | … |\n\n先输出结构化纪要全文（Markdown），再附一行\"需要你确认的信息\"清单（人名、时间、数字等拿不准的地方）。\n\n- 不替参会人做未在会上的决定；拿不准的结论标\"会上倾向/待确认\"。\n- 涉及金额、日期、人名务必如实，宁缺毋编。","previewTruncated":false,"bodyLength":663,"steps":12,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"meeting-notes-actions","dir":"会议纪要行动项（meeting-notes-actions）","category":"办公与效率","purpose":"从会议、访谈、语音转写中提取结论、争议、行动项和负责人，适合团队会议和客户访谈整理。","triggers":["行动项提取","待办负责人","访谈整理","结论争议"],"boundary":"不适用于会议纪要成稿（改走 meeting-notes），也不适用于任务排期（改走 project-management）","description":"从会议、访谈、语音转写中提取结论、争议、行动项和负责人，适合团队会议和客户访谈整理。触发词如\"行动项提取/待办负责人/访谈整理/结论争议\"。｜不适用于会议纪要成稿（改走 meeting-notes），也不适用于任务排期（改走 project-management）","lead":"把讨论变成可执行任务，而不是只做漂亮摘要。","headings":[{"level":1,"text":"Meeting Notes Actions"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把讨论变成可执行任务，而不是只做漂亮摘要。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n会议摘要、行动项表、风险点、追踪问题：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":751,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"model-routing","dir":"model-routing","category":"办公与效率","purpose":"当用户纠结\"用哪个模型\"、要按任务类型推荐最合适的模型、或提到模型切换/选型时使用。","triggers":["用哪个模型","kimi还是deepseek","模型怎么选","切模型","选不到kimi"],"boundary":"不适用于成本报价（改走 cost-control）；内容创作类需求不属于它","description":"当用户纠结\"用哪个模型\"、要按任务类型推荐最合适的模型、或提到模型切换/选型时使用。触发词如\"用哪个模型/kimi还是deepseek/模型怎么选/切模型/选不到kimi\"。｜不适用于成本报价（改走 cost-control）；内容创作类需求不属于它","lead":"帮用户按任务类型选定最合适的模型，省得每次纠结。","headings":[{"level":1,"text":"模型路由（按任务选模型）"},{"level":2,"text":"当前可用模型（已配置）"},{"level":2,"text":"路由规则（固定映射，不纠结）"},{"level":2,"text":"成本分层（pro vs flash，价差约 18 倍）"},{"level":2,"text":"怎么切模型"},{"level":2,"text":"重要说明"},{"level":2,"text":"输出格式"}],"preview":"帮用户按任务类型选定最合适的模型，省得每次纠结。\n\n| 模型 | 提供方 | 用途 | 实测成本 |\n|---|---|---|---|\n| deepseek-v4-pro | deepseek-official | 复杂推理 / coding / 深度分析 | **¥27.6/1M**（余额差法实测） |\n| deepseek-v4-flash | deepseek-official | 日常 / 批量 / 写稿 / 简单代码 | **¥1.5/1M**（官方价） |\n| deepseek-v4-flash-vision-exp | deepseek-official | 读图 / 图文理解 / 图片核验 | ¥2.0/1M（估算） |\n| Kimi | moonshotai-cn | 中文写作 / 长文档 / 文案 | 按 token（余额 ¥99） |\n| GLM Coding | zai-coding-cn | 纯编程 / 技术方案 | 订阅套餐（不按 token） |\n| Seedream | 火山方舟 | 文生图（海报/封面/配图，工具类） | ¥0.30/张 |\n| Seedance | 火山方舟 | 文生视频（工具类） | ¥1/秒（走 Evolink 中转 ¥0.087/秒） |\n\n- **自媒体文案 / 公众号 / 小红书 / 口播稿 / 公文 / 长总结** → 推荐 **Kimi**（moonshotai-cn），中文更地道。\n- **写代码 / 技术方案 / 工程** → 推荐 **deepseek-v4-pro**（默认即可）或 **GLM Coding**。\n- **其他综合 / 办公日常** → **deepseek-v4-pro**（默认）。\n- **生图** → Seedream；**视频** → Seedance（这两类走工具，不占主模型）。\n- **读图 / 核验图片内容** → **deepseek-v4-flash-vision-exp**（或免费的 glm-4v-flash 做客观核验）。\n\n**核心结论：pro ¥27.6/1M vs flash ¥1.5/1M，差约 18 倍。选错模型比选错工具贵得多。**\n\n切 **flash（省钱档）**：\n- 写稿、改写、摘要、批量处理、信息提取\n- 读图核验、图文理解\n- 简单代码、格式化、文件整理、日常问答\n- 长会话的自动轮/持续任务（用户不在时尤其要切）\n\n切 **pro（质量档）**：\n- 多步推理、架构设计、复杂代码重构\n- 商业分析、深度研究、需要长链推理的判断题\n- 关键交付物（对外发布稿的终审、重要方案）\n\n**判断口诀**：任务能不能\"照着做\"就完成？能 → flash；需要\"想清楚才能做\" → pro。\n\n**注意**：模型由用户在 UI 切换，agent 不能程序化切自己。agent 的职责是**主动提示**——尤其在消耗速率高时（用 `cost-manager` 的 `status` 看 ¥/小时），提醒用户降档。\n\n在 Web GUI 顶部/模型选择器里切换到对应提供方，切换后新对话用新模型。\n\n- 我（agent）**不能程序化切换自己正在用的模型**；模型由用户在 UI 选择。\n- 我的职责：做任务时**主动提示**该用哪个模型，并给一句话理由。\n- 用户纠结时，直接给结论 + 理由，不啰嗦。\n\n做任务前，若涉及模型选择，附一句：\n「建议模型：Kimi（文案更地道）——切换后我继续」","previewTruncated":false,"bodyLength":1589,"steps":15,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"deepseek-v4-pro","scene":"复杂推理 / 深度分析"},{"name":"deepseek-v4-flash","scene":"日常 / 批量 / 省钱档"},{"name":"v4-flash-vision","scene":"读图 / 图文理解"},{"name":"Kimi","scene":"中文写作 / 长文档"},{"name":"GLM","scene":"纯编程 / 技术方案"},{"name":"Seedream","scene":"文生图（火山方舟）"},{"name":"Seedance","scene":"文生视频（火山方舟）"}]},{"name":"office-docs","dir":"office-docs","category":"办公与效率","purpose":"当用户要生成 Word/Excel/PPT 真实文件（.docx/.xlsx/.pptx）时使用。","triggers":["生成一个 Word","Excel","PPT","文档","表格","幻灯片文件","导出成"],"boundary":"不适用于演示主题设计与版式（改走 dashi-ppt），也不适用于只要大纲（改走 ppt-outline）","description":"当用户要生成 Word/Excel/PPT 真实文件（.docx/.xlsx/.pptx）时使用。触发词如\"生成一个 Word/Excel/PPT/文档/表格/幻灯片文件/导出成\"。｜不适用于演示主题设计与版式（改走 dashi-ppt），也不适用于只要大纲（改走 ppt-outline）","lead":"用 Python 生成真实 .docx / .xlsx / .pptx 文件。本机已装好所需库。","headings":[{"level":1,"text":"Office 文档生成（Word / Excel / PPT）"},{"level":2,"text":"环境（已就绪）"},{"level":2,"text":"工作流"},{"level":2,"text":"各类型要点"},{"level":2,"text":"注意事项"}],"preview":"用 Python 生成真实 .docx / .xlsx / .pptx 文件。本机已装好所需库。\n\n- Python 3.11\n- `python-docx`（Word）、`openpyxl`（Excel）、`python-pptx`（PPT）均已安装\n\n1. **确认**：文件类型、内容大纲、用途、给谁看。\n2. **内容先行**：先产出文字内容（结合 business-writing / work-report / ppt-outline 等 skill）。\n3. **写脚本生成**：写 Python 脚本，生成文件到工作目录。\n4. **校验**：重新打开读取，确认文件正常、内容无误，再告知完整路径。\n\n- **Word**：标题层级清晰、正文宋体/小四、标题黑体；需要时加表格、页眉页脚。\n- **Excel**：表头加粗、列宽自适应、日期/金额格式正确、可加简单公式和汇总行。\n- **PPT**：一页一观点、字数精炼、用版式而非满屏文字。\n\n- 生成脚本放临时目录，别污染项目；交付物才是文件本身。\n- 数据要准确，拿不准的标【待确认】，不编数字。\n- 生成后务必校验能正常打开。","previewTruncated":false,"bodyLength":574,"steps":12,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V2","evidence":"2026-09-10 B1实测：生成《Skill验证协议SOP》.docx（38407B），python-docx 重开校验通过（4个一级标题/1个4列表格/531字符/zip完好）——验收标准=文件可打开且结构完整，判定PASS；脚本存档 tests/office-docs/","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修","version":"","models":[]},{"name":"ppt-outline","dir":"ppt-outline","category":"办公与效率","purpose":"当用户要做 PPT、演示文稿、汇报幻灯片、路演、培训课件，需要大纲、每页内容结构、讲稿时使用。","triggers":["做个PPT","演示文稿","课件","路演","汇报幻灯片","大纲"],"boundary":"不适用于直接产出可交付文件（改走 dashi-ppt 或 office-docs）","description":"当用户要做 PPT、演示文稿、汇报幻灯片、路演、培训课件，需要大纲、每页内容结构、讲稿时使用。触发词如\"做个PPT/演示文稿/课件/路演/汇报幻灯片/大纲\"。｜不适用于直接产出可交付文件（改走 dashi-ppt 或 office-docs）","lead":"先定\"讲给谁、要什么结果\"，再搭骨架，最后填每页内容；不直接堆文字。","headings":[{"level":1,"text":"PPT 大纲与演示结构"},{"level":2,"text":"1. 先定 3 件事"},{"level":2,"text":"2. 万能骨架"},{"level":2,"text":"3. 每页规范"},{"level":2,"text":"4. 讲稿"},{"level":2,"text":"5. 输出格式"},{"level":2,"text":"注意事项"}],"preview":"先定\"讲给谁、要什么结果\"，再搭骨架，最后填每页内容；不直接堆文字。\n\n- **受众**：老板 / 客户 / 同事 / 公众，决定深度与措辞。\n- **目标**：汇报 / 说服（要预算/要决策）/ 培训 / 路演。\n- **时长**：5 分钟 / 15 分钟 / 30 分钟（决定页数与信息密度）。\n\n1. **封面**：标题 + 副标题（一句话价值主张） + 汇报人/日期。\n2. **议程/开场**：30 秒讲清\"今天讲什么、为什么值得听\"。\n3. **背景与问题**：现状 + 痛点，让受众认同\"这个问题必须解决\"。\n4. **方案/核心内容**：主体，2-4 个分论点，每点一页。\n5. **证据/数据**：每个论点配数据、案例或对比，增强可信度。\n6. **风险与应对**（说服类必加）：预判质疑并提前回应。\n7. **结论与行动**：明确\"要做什么、需要谁、何时\"。\n8. **结尾页**：一句金句 + 谢谢 + 联系方式/二维码。\n\n- **一页一个观点**：页标题就是结论（如\"渠道 A 的获客成本下降 40%\"），不写\"关于 XX 的介绍\"。\n- **内容用\"要点 + 支撑\"**：每页 3-5 个要点，每点一句话 + 一个数字/例子。\n- **少字原则**：正文每页 ≤ 60 字，细节进备注/讲稿，不放满屏。\n- **图表优先**：能用图表就不用文字（趋势用折线、对比用柱状、占比用饼图）。\n\n按页输出逐页讲稿（口语），标注每页讲多长时间、哪里停顿、哪里翻页。\n\n一次交付：\n1. 一页纸大纲（页码 + 页标题 + 每页 1 句话要点）\n2. 每页正文要点\n3. 逐页讲稿（可选，按需）\n4. 视觉建议（配色/图表类型/配图方向）\n\n- 不为了页数注水；内容不足就如实建议\"这部分需要补数据\"。\n- 正式汇报用简洁商务风，路演/培训可适当活泼，但都保持一页一观点。","previewTruncated":false,"bodyLength":878,"steps":21,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"professional-email","dir":"professional-email","category":"办公与效率","purpose":"当用户要写或改写邮件时使用：商务邮件、工作沟通、催办、回复客户、请假申请、英文邮件等。","triggers":["写封邮件","回邮件","催一下","英文邮件","正式邮件"],"boundary":"不适用于公文/通知/请示（改走 business-writing），也不适用于工作汇报（改走 work-report）","description":"当用户要写或改写邮件时使用：商务邮件、工作沟通、催办、回复客户、请假申请、英文邮件等。触发词如\"写封邮件/回邮件/催一下/英文邮件/正式邮件\"。｜不适用于公文/通知/请示（改走 business-writing），也不适用于工作汇报（改走 work-report）","lead":"一封邮件只讲一件事；让对方 10 秒看懂\"要我看什么、要我做什么、什么时候要\"。","headings":[{"level":1,"text":"专业邮件写作"},{"level":2,"text":"1. 结构（按顺序）"},{"level":2,"text":"2. 常见场景模板要点"},{"level":2,"text":"3. 语气与格式"},{"level":2,"text":"4. 英文邮件额外规则"},{"level":2,"text":"5. 输出格式"},{"level":2,"text":"注意事项"}],"preview":"一封邮件只讲一件事；让对方 10 秒看懂\"要我看什么、要我做什么、什么时候要\"。\n\n1. **主题行**：一句话点明事由 + 需要动作（如\"【请审批】XX 项目预算申请（周五前）\"）。\n2. **称呼**：按关系用\"XX 总/老师/同学/您好\"，不知姓名用\"您好\"。\n3. **开场**：一句说明来意，必要时一句背景。\n4. **主体**：结论先行，细节分条；需要对方行动的用\"请…（时间前）\"明确。\n5. **结尾**：礼貌收束 + 联系人/下一步。\n6. **落款**：姓名 + 单位/职位 + 联系方式（首次通信）。\n\n- **催办**：先感谢/确认对方处境 → 明确\"请在本周 X 前回复/处理\" → 说明不处理的后果（客观）。\n- **请求/申请**：说明需求 → 理由（1-2 条，讲利益不讲感情） → 明确期望回复时间。\n- **回复客户**：先回应对方关切 → 给出方案/结论 → 明确下一步时间点。\n- **道歉/说明**：先认问题 → 说明原因（不甩锅） → 补救措施 → 时间承诺。\n\n- 商务默认：礼貌、克制、无情绪词，避免\"必须/立刻\"（用\"请\"\"建议\"）。\n- 一段不超过 4 行，重点信息用列表，不用大段文字。\n- 附件在正文末尾列明：附件 1、附件 2 …并说明内容。\n\n- 主题用名词短语 + 动词：\"Request for Approval: Project X Budget\"。\n- 开头常用：\"I hope this email finds you well.\"（可省）、\"I'm writing to…\"。\n- 结尾：\"Please let me know if you have any questions.\" / \"Looking forward to your reply.\"\n- 避免中式英语（如 \"revert back\" → \"reply\"），保持简洁直接。\n\n直接输出可发送的完整邮件（含主题行 + 正文 + 落款），英文邮件附一句简短中文说明要点。\n\n- 不替用户做未确认的承诺、不虚构事实或数据。\n- 收件人/时间/金额等关键信息留空时用【】占位并提示填写。","previewTruncated":false,"bodyLength":1000,"steps":19,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"scheduling","dir":"scheduling","category":"办公与效率","purpose":"当用户要管理日程、排期、日历、待办、提醒、周计划、会议安排时使用。","triggers":["日程","排期","日历","安排一下","这周计划","待办","提醒","行程"],"boundary":"不适用于项目级计划与关键路径（改走 project-management），也不适用于知识沉淀（改走 second-brain）","description":"当用户要管理日程、排期、日历、待办、提醒、周计划、会议安排时使用。触发词如\"日程/排期/日历/安排一下/这周计划/待办/提醒/行程\"。｜不适用于项目级计划与关键路径（改走 project-management），也不适用于知识沉淀（改走 second-brain）","lead":"把零散的任务、会议、截止日期，理成一份可执行的日程。","headings":[{"level":1,"text":"日程管理与日历规划"},{"level":2,"text":"工作流"},{"level":2,"text":"输出格式"},{"level":2,"text":"日历文件（可选）"},{"level":2,"text":"注意事项"}],"preview":"把零散的任务、会议、截止日期，理成一份可执行的日程。\n\n1. **收集**：问清本周/近期要做的事——任务、会议、截止日期、纪念日、固定习惯。\n2. **归类**：按四象限分——重要紧急 / 重要不紧急 / 紧急不重要 / 不重要不紧急。\n3. **排期**：按真实日期落到每天的具体时段，标注时长。\n4. **冲突检查**：同一天别排太满，留缓冲；发现冲突就提醒并给替代时段。\n\n- **本周日程表**：周一~周日，每天「时间段 + 事项 + 时长」。\n- **待办清单**：按优先级排序。\n- **今天必做 3 件**：最该先完成的。\n\n用户要可导入日历（Google/Outlook/苹果）时，用 python 生成 ICS 文件，关键字段：\n`SUMMARY`（事项）、`DTSTART`/`DTEND`（起止，带时区）、`DESCRIPTION`（备注）、`LOCATION`（地点）。\n\n- 日期、星期必须用**真实**值，不编造。\n- 时间冲突要明确指出并给替代方案。\n- 排太满时如实说\"这天已满，建议挪到 X\"。","previewTruncated":false,"bodyLength":517,"steps":10,"codeBlocks":0,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"sonoscli","dir":"办公协同（sonoscli）","category":"办公与效率","purpose":"CLI-driven office workflow management that routes tasks, calendar, meeting notes, and status tracking to the right tools with natural language input.","triggers":["Route office workflow tasks (calendar, meeting notes, status) through the CLI"],"boundary":"不适用于内容创作（改走 zimeiti-content / wechat-publish），也不适用于项目级排期（改走 project-management）","description":"CLI-driven office workflow management that routes tasks, calendar, meeting notes, and status tracking to the right tools with natural language input. Use when: \"Route office workflow tasks (calendar, meeting notes, status) through the CLI\".｜不适用于内容创作（改走 zimeiti-content / wechat-publish），也不适用于项目级排期（改走 project-management）","lead":"将知识工作者的自然语言需求转化为具体的 CLI 操作或工具调用，串联任务管理、日历、会议纪要和工作状态汇报，减少在不同工具间切换的摩擦。核心价值是：一句话输入，结构化输出，并给出下一步建议。","headings":[{"level":1,"text":"核心定位"},{"level":1,"text":"触发场景"},{"level":1,"text":"支持的集成"},{"level":1,"text":"工作流"},{"level":2,"text":"Step 1: 意图识别"},{"level":2,"text":"Step 2: 参数提取"},{"level":2,"text":"Step 3: 自然语言到操作映射"},{"level":2,"text":"Step 4: 会议纪要行动项提取"},{"level":2,"text":"Step 5: 生成日报/周报/站会汇报"},{"level":2,"text":"Step 6: 确认并执行"},{"level":2,"text":"Step 7: 后续建议"},{"level":1,"text":"输出格式"},{"level":1,"text":"Gotchas"}],"preview":"将知识工作者的自然语言需求转化为具体的 CLI 操作或工具调用，串联任务管理、日历、会议纪要和工作状态汇报，减少在不同工具间切换的摩擦。核心价值是：一句话输入，结构化输出，并给出下一步建议。\n\n---\n\n- 用户说\"帮我从这次会议记录里提取行动项\"\n- 用户说\"生成今天的日报/周报/站会汇报\"\n- 用户说\"把这个任务加到我的看板\"\n- 用户说\"检查我今天有什么待办\"\n- 用户提供一段会议录音文字稿或文字笔记，需要整理\n\n---\n\n| 集成类别 | 工具示例 | 主要操作 |\n|---------|---------|---------|\n| 任务管理 | Notion、Linear、Jira、Trello、飞书多维表 | 创建/更新/查询任务 |\n| 日历 | Google Calendar、飞书日历、Outlook | 查看/创建/修改日程 |\n| 即时通讯 | Slack、飞书、钉钉 | 发送消息、获取频道历史 |\n| 文档 | Notion、Google Docs、飞书文档 | 创建/更新文档 |\n| 代码托管 | GitHub、GitLab | 查询 PR、Issue 状态 |\n| 邮件 | Gmail、Outlook | 发送/搜索邮件 |\n\n若用户未指定工具，默认询问：\"你用哪个工具管理任务/日历？\"\n\n---\n\n分析用户输入，确定操作类型：\n\n```\n意图类型:\n  A. 任务操作     → 创建/更新/查询/完成任务\n  B. 日历操作     → 查看/创建/修改日程\n  C. 会议纪要处理 → 提取行动项 / 整理要点 / 分配负责人\n  D. 状态汇报     → 生成日报/周报/站会摘要\n  E. 信息聚合     → 跨工具汇总当前待办、阻塞项\n```\n\n若输入模糊（如\"帮我整理一下\"），询问：\n> \"你是想整理任务列表、生成汇报，还是处理会议记录？\"\n\n根据意图类型，提取所需参数：\n\n**任务创建参数：**\n```\n- 标题（必填）\n- 负责人（可选，未提及则留空或询问）\n- 截止日期（可选，\"下周五\"→解析为具体日期）\n- 优先级（可选，默认 Medium）\n- 所属项目/标签（可选）\n- 描述（可选，从上下文生成）\n```\n\n**会议纪要参数：**\n```\n- 会议主题\n- 参会人列表\n- 会议时间\n- 原始文字内容\n```\n\n**汇报参数：**\n```\n- 汇报类型（日报/周报/站会）\n- 时间范围\n- 数据来源（哪个看板/项目）\n```\n\n**示例映射表：**\n\n| 用户输入 | 识别意图 | 执行操作 |\n|---------|---------|---------|\n| \"把'优化登录流程'加到本周待办，交给小李\" | 任务创建 | 创建任务，负责人=小李，截止=本周日 |\n| \"今天下午有什么会议\" | 日历查询 | 查询今天 12:00-23:59 的日程 |\n| \"帮我看看 Linear 上有哪些阻塞的任务\" | 任务查询 | 查询 status=blocked 的所有任务 |\n| \"生成今天的站会汇报\" | 状态汇报 | 按模板聚合昨日完成/今日计划/阻塞 |\n| \"把这段会议记录整理一下\" | 会议纪要 | 提取行动项+决策+下次跟进 |\n\n**自然语言时间解析规则：**\n```\n\"今天\"     → 当日日期\n\"明天\"     → +1 天\n\"下周X\"    → 下周对应星期，时间默认 EOD 18:00\n\"这周内\"   → 本周五 EOD\n\"月底前\"   → 当月最后一个工作日\n\"ASAP\"     → 今日 EOD，优先级 High\n\"尽快\"     → 同 ASAP\n```\n\n当用户提供会议文字内容时，执行以下结构化提取：\n\n**提取框架：**\n```\n1. 扫描决策（寻找\"我们决定\"、\"确认\"、\"同意\"等关键词）\n2. 扫描行动项（寻找\"负责\"、\"会\"、\"要\"、\"去做\"、\"跟进\"等动词）\n3. 扫描问题/阻塞（寻找\"但是\"、\"问题是\"、\"卡在\"、\"不确定\"等）\n4. 扫描下次会议安排\n```\n\n**行动项判断标准（必须满足其中 2 条）：**\n- 有明确动词（做/完成/确认/输出/发送）\n- 有隐含或明确的负责人\n- 有时间压力或截止日期\n- 与会议目标直接相关\n\n**行动项输出格式：**\n```\n[ ] [负责人] [动作描述] — 截止：[日期] — 优先级：[H/M/L]\n```\n\n若负责人不明确，标注 `[待分配]`，询问用户。\n\n**站会（Daily Standup）模板：**\n```\n昨日完成：\n  · [任务名] — [项目]\n  · ...\n\n今日计划：\n  · [任务名] — 预计耗时：Xh\n  · ...\n\n阻塞/风险：\n  · [问题描述] — 需要：[什么支持]\n  （无阻塞则写：无）\n```\n\n**周报模板：**\n```\n本周完成（[日期范围]）：\n  [主要成果1]\n  [主要成果2]\n\n关键数据：\n  · [指标1]：[数值] (vs 上周：+X%)\n  · [指标2]：[数值]\n\n下周计划：\n  · [任务/目标1]\n  · [任务/目标2]\n\n风险与需要支持：\n  · [如有]\n```\n\n在执行任何写操作（创建任务、发送消息、修改日历）前，输出操作预览：\n\n```\n即将执行以下操作，确认？(y/n)\n\n> 创建任务：优化登录流程\n  负责人：小李\n  截止日期：2026-04-05（周日）\n  项目：用户体验优化\n  优先级：Medium\n```\n\n用户确认后执行，并输出结果链接（如有）。\n\n每次操作完成后，给出 1-2 条相关建议：\n\n```\n完成！已创建任务 #1234。\n\n建议后续操作：\n→ 是否需要为这个任务设置检查提醒？（建议截止前 1 天）\n→ 是否需要在 Slack 通知小李这个任务已分配？\n```\n\n---\n\n**任务创建确认：**\n```\n[已创建任务]\n标题：[任务名]\n负责人：[姓名]  截止：[日期]  优先级：[级别]\n链接：[url（如有）]\n```\n\n**会议行动项提取：**\n```\n会议：[主题] | [日期] | 参会：[人员]\n\n行动项（X条）\n[ ] [负责人] [行动]","previewTruncated":true,"bodyLength":3496,"steps":40,"codeBlocks":13,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"yizhou-ppt","dir":"一舟PPT（yizhou-ppt）","category":"办公与效率","purpose":"将主题、文章、课程或汇报材料转成高审美中文 PPT 方案；支持有图增强版和无图稳态版，适合课程、发布、研究报告、商业汇报和个人演讲。","triggers":["高审美中文PPT","课程PPT","发布PPT","无图稳态版"],"boundary":"不适用于只要大纲与讲稿（改走 ppt-outline），也不适用于可交付 .pptx 文件（改走 office-docs / editable-pptx-builder）","description":"将主题、文章、课程或汇报材料转成高审美中文 PPT 方案；支持有图增强版和无图稳态版，适合课程、发布、研究报告、商业汇报和个人演讲。触发词如\"高审美中文PPT/课程PPT/发布PPT/无图稳态版\"。｜不适用于只要大纲与讲稿（改走 ppt-outline），也不适用于可交付 .pptx 文件（改走 office-docs / editable-pptx-builder）","lead":"> 用途：把一个主题、文章、课程、汇报材料，转成一套更像“正式发布 / 高级课程 / 高级内容手册”的 PPT 方案。","headings":[{"level":1,"text":"一舟PPT迭代版（学员版）"},{"level":2,"text":"一、你要让 AI 扮演的角色"},{"level":2,"text":"二、先问 6 个问题，不要直接开始做"},{"level":2,"text":"三、三大风格族"},{"level":3,"text":"1. 未来太空"},{"level":3,"text":"2. 彩色龙虾"},{"level":3,"text":"3. 一舟杂志风"},{"level":2,"text":"四、如果没有画图 API 或配图工具，用无配图兼容版"},{"level":3,"text":"A 版：有图增强版"},{"level":3,"text":"B 版：无图稳态版（推荐给大多数同学）"},{"level":2,"text":"五、无配图时优先使用的 8 个一舟模板"},{"level":3,"text":"模板 1：开场定调页"},{"level":3,"text":"模板 2：观点落锤页"},{"level":3,"text":"模板 3：三格拆解页"},{"level":3,"text":"模板 4：数字证据页"},{"level":3,"text":"模板 5：新旧分界页"},{"level":3,"text":"模板 6：行动路径页"},{"level":3,"text":"模板 7：摘录定调页"},{"level":3,"text":"模板 8：全局导航页"},{"level":2,"text":"六、页面节奏规则"},{"level":2,"text":"七、内容密度规则"},{"level":2,"text":"八、输出流程"},{"level":3,"text":"Step 1：信息确认"},{"level":3,"text":"Step 2：推荐风格"},{"level":3,"text":"Step 3：先出结构，不直接写满"},{"level":3,"text":"Step 4：做 3 页试样"},{"level":3,"text":"Step 5：确认后生成完整版"},{"level":2,"text":"九、可直接复制使用的总提示词"},{"level":2,"text":"十、无配图版示例输出格式"},{"level":2,"text":"十一、最终自检清单"},{"level":2,"text":"十二、给同学的使用建议"}],"preview":"> 用途：把一个主题、文章、课程、汇报材料，转成一套更像“正式发布 / 高级课程 / 高级内容手册”的 PPT 方案。  \n> 适用工具：ChatGPT、Codex、Gemini、通义、Kimi、豆包、Coze、Dify 等文本模型都可使用。  \n> 重要原则：这份版本不依赖任何个人账号、API、私有工具或本地路径。没有画图工具也可以做出好看的无配图版本。\n\n---\n\n你是一名中文高审美 PPT 策划与页面设计师，擅长把复杂内容转化为：\n\n- 结构清晰的演示叙事\n- 每页一个核心观点的页面规划\n- 适合中文阅读的标题和短句\n- 高级、克制、有节奏的视觉方案\n- 可直接交给 PPT / Keynote / Canva / Gamma / WPS / 飞书妙记等工具制作的页面说明\n\n你的目标不是把内容简单分页，而是做出一套“看起来有设计系统”的 PPT。\n\n---\n\n如果我没有一次性给全信息，你必须先问下面 6 个问题：\n\n1. 这套 PPT 的受众是谁？使用场景是什么？\n2. 演讲或展示时长多久？\n3. 我有没有提供原始素材、文章、课程大纲或数据？\n4. 有没有现成图片、截图、图表素材？如果没有，也要能做无配图版。\n5. 想选哪套风格？从下面 3 个风格族中推荐一个。\n6. 有没有硬约束？例如页数、必须出现的内容、不能出现的内容、品牌色、交付格式等。\n\n如果信息不完整，不要立刻生成整套 PPT；先根据已有信息做合理假设，并标注“假设”。\n\n---\n\n适合：AI 趋势、科技演讲、未来叙事、行业判断、发布会开场。\n\n气质：\n\n- 黑色背景\n- 大标题\n- 金色 / 蓝色强调\n- 强冲击、压迫感、未来感\n- 适合用大图，但无图时可用抽象星空、线框、坐标、粒子背景替代\n\n推荐页面：\n\n- 封面大标题页\n- 趋势判断页\n- 关键转折页\n- 终局判断页\n- 数字证据页\n\n适合：课程、训练营、方法论、步骤拆解、知识付费产品、社群分享。\n\n气质：\n\n- 深海藏蓝背景\n- 珊瑚红、青绿色、琥珀橙三色分工\n- 卡片、徽章、步骤条、模块化结构\n- 信息密度可以略高，但必须保持清楚\n\n推荐页面：\n\n- 课程总览页\n- 三步法 / 五步法\n- 工具清单页\n- 案例拆解页\n- 行动任务页\n\n适合：商业发布、研究报告、品牌方案、深度内容、个人演讲和审美型课程。\n\n气质：\n\n- 像一本可翻页的高级内容手册\n- 大留白、强标题、少装饰\n- 用分栏、细线、卡片和编号组织信息\n- 不靠堆图片取胜，靠页面比例、文字节奏和观点密度显高级\n\n一舟杂志风建议使用 5 个方向：\n\n| 方向 | 适合场景 | 气质 |\n|---|---|---|\n| 黑白编辑 | 商业发布、通用汇报 | 黑白主调 + 暖色纸感，最稳 |\n| 蓝瓷研究 | AI、科技、研究发布 | 深蓝 + 冷白，理性、干净、有深度 |\n| 森系长文 | 人文、长期主义、组织文化 | 深绿 + 米白，沉稳、有呼吸感 |\n| 暖纸叙事 | 故事、复盘、个人表达 | 棕色 + 暖米色，温暖、有阅读感 |\n| 沙岩品牌 | 艺术、设计、品牌、创意 | 炭灰 + 沙色，克制、高级、中性 |\n\n选择规则：\n\n- 不知道选什么，默认用“黑白编辑”。\n- AI / 科技 / 研究，优先“蓝瓷研究”。\n- 课程 / 方法论，如果想更活泼，用“彩色龙虾”；如果想更高级，用“黑白编辑”。\n- 一整套 PPT 只选一个视觉方向，不要中途换色。\n\n---\n\n很多同学没有配置画图 API、图片生成工具或素材库，所以默认要提供两个方案：\n\n- A 版：有图增强版\n- B 版：无图稳态版\n\n适合已经有图片、截图、产品图、案例图，或可以使用 AI 绘图工具的情况。\n\n要求：\n\n- 每张图必须服务观点，不做装饰图。\n- 一页最多 1-2 张图。\n- 封面图要和主题强相关。\n- 图片上有文字时，必须加遮罩或留白，保证可读。\n- 不要为了有图而塞图。\n\n如果没有图片，直接使用一舟杂志风的无配图模板。重点靠：\n\n- 大标题\n- 引言\n- 数字\n- 分栏\n- 卡片\n- 时间线\n- 流程图\n- 对照表\n- 引用页\n- 留白\n- 章节分隔\n\n无图版不是低配版，而是更稳定、更容易出高级感的版本。\n\n---\n\n用途：封面、章节开场、关键转折。\n\n结构：\n\n```text\n左上：小标签 / 期刊编号 / 日期\n中间：超大主标题，最多两行\n下方：一句副标题\n右下：作者 / 场景 / 版本号\n背景：纯色、纸感、细线、弱纹理，不放图片也可以\n```\n\n适合方向：黑白编辑、蓝瓷研究、暖纸叙事、沙岩品牌。\n\n用途：开场钩子、核心判断、结尾金句。\n\n结构：\n\n```text\n页面中心：一句强结论\n下方：一句解释\n角落：章节编号或关键词\n```\n\n规则：\n\n- 主结论不超过 18 个中文字符。\n- 解释不超过 30 个中文字符。\n- 不要塞列表。\n\n用途：三原因、三趋势、三模块、三阶段。\n\n结构：\n\n```text\n顶部：页面标题\n主体：三张等宽卡片\n每张卡片：编号 + 小标题 + 2 行说明\n底部：一句总结\n```\n\n适合课程和方法论内容。\n\n用途：数据、成果、趋势、变化幅度。\n\n结构：\n\n```text\n左侧：一个巨大数字\n右侧：数字代表什么 + 两条解释\n底部：数据口径 / 注释\n```\n\n规则：\n\n- 数字必须有上下文。\n- 百分比必须说明基数。\n- 不要只放“增长很快”这种空话。\n\n用途：过去 vs 现在、旧方法 vs 新方法、误区 vs 正解。\n\n结构：\n\n```text\n左栏：旧世界 / 问题 / 误区\n右栏：新世界 / 解法 / 正解\n中间：箭头或分割线\n底部：一句判断\n```\n\n这是无图版最容易做出高级感的模板之一。\n\n用途：方法步骤、执行路径、课程路线。\n\n结构：\n\n```text\n顶部：方法名称\n主体：4-6 个步骤，横向排列或阶梯上升\n每步：动词 + 短说明\n底部：最终结果\n```\n\n规则：\n\n- 每一步用动词开头。\n- 不要超过 6 步。\n- 如果超过 6 步，拆成两页。\n\n用途：金句、用户反馈、关键洞察、文章摘录。\n\n结构：\n\n```text\n左侧：引号或编号\n中间：引用内容\n下方：出处 / 场景 / 解释\n```\n\n规则：","previewTruncated":true,"bodyLength":5896,"steps":114,"codeBlocks":20,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[{"name":"Kimi","scene":"中文写作 / 长文档"},{"name":"doubao","scene":"火山豆包"}]},{"name":"active-agent","dir":"主动执行代理（active-agent）","category":"代理与工程","purpose":"用户说\"直接帮我做\"时，自主拆解任务、循环执行、处理障碍并汇报结果，无需反复确认。","triggers":["直接帮我做","你来搞定","不用问我","自动完成","按你的判断处理"],"boundary":"不适用于需要用户决策的高风险不可逆操作（必须人工确认），也不适用于纯咨询问答","description":"用户说\"直接帮我做\"时，自主拆解任务、循环执行、处理障碍并汇报结果，无需反复确认。触发词如\"直接帮我做/你来搞定/不用问我/自动完成/按你的判断处理\"。｜不适用于需要用户决策的高风险不可逆操作（必须人工确认），也不适用于纯咨询问答","lead":"将 AI 从被动问答转为自主执行代理。用户给出目标，代理独立规划执行路径、处理中间障碍、完成任务并汇报结果。核心原则：**能推断的不问，能执行的不等，能解决的不报**。","headings":[{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"阶段一：任务解析（30秒内完成）"},{"level":3,"text":"阶段二：任务分解"},{"level":3,"text":"阶段三：执行循环"},{"level":3,"text":"阶段四：结果报告"},{"level":2,"text":"输出格式"},{"level":3,"text":"执行前（有必要追问时）"},{"level":3,"text":"执行中（长任务，每完成一个阶段汇报进度）"},{"level":3,"text":"执行完成报告"},{"level":2,"text":"任务结果"},{"level":2,"text":"执行说明"},{"level":2,"text":"建议后续动作"},{"level":3,"text":"阻断性障碍报告"},{"level":2,"text":"Gotchas"}],"preview":"将 AI 从被动问答转为自主执行代理。用户给出目标，代理独立规划执行路径、处理中间障碍、完成任务并汇报结果。核心原则：**能推断的不问，能执行的不等，能解决的不报**。\n\n---\n\n- \"帮我直接做，不用问我\"\n- \"自动完成这个任务\"\n- \"你来决定怎么做，告诉我结果\"\n- \"按你的判断处理，有问题再说\"\n- 任何明确要求减少交互的执行类请求\n\n---\n\n1. **提取核心目标**：用一句话复述用户真正想要的结果（非过程）\n2. **识别已知条件**：列出用户已提供的信息\n3. **识别必要前置信息**：区分\"必须知道才能开始\"和\"可以默认推断\"两类缺口\n   - 必须知道：缺少此信息任务无法启动（如目标用户是谁）\n   - 可以推断：有合理默认值的参数（如文章长度、语气风格）\n4. **一次性追问**：若存在必须知道的缺口，合并成一个问题列表，只问一次\n5. **声明默认假设**：列出所有推断值，格式：\"我假设X=Y，如有不同请告知\"\n\n6. **拆解为原子步骤**：每步骤应满足：\n   - 有明确的完成标准\n   - 可独立执行\n   - 步骤间依赖关系清晰\n7. **识别关键路径**：找出哪些步骤的失败会阻断整个任务\n8. **预判障碍点**：对每个关键步骤预设\"如果失败，执行Plan B\"\n\n任务分解输出示例：\n```\n目标：为某产品写3篇小红书测评\n步骤1：提炼产品核心卖点（来自用户描述）→ 产出：卖点清单\n步骤2：确定三篇的差异化角度 → 产出：角度矩阵\n步骤3：逐篇起草 → 产出：3篇草稿\n步骤4：统一格式与标签 → 产出：最终文稿\n障碍预案：若产品信息不足，步骤1改为\"提问+补全\"模式\n```\n\n9. **执行单步**：完成一个原子步骤\n10. **自我验证**：对照完成标准检查输出质量\n    - 通过 → 继续下一步\n    - 不通过 → 自行修正，最多重试2次\n11. **障碍处理决策树**：\n    ```\n    遇到障碍\n    ├── 障碍是否可绕过？（有替代方案）\n    │   ├── 是 → 执行替代方案，在最终报告中注明\n    │   └── 否 → 是否是阻断性障碍？\n    │       ├── 是（任务无法继续）→ 立即暂停并上报\n    │       └── 否（影响质量但可完成）→ 继续，标记为\"待优化\"\n    ```\n12. **循环直到所有步骤完成或遇到阻断性障碍**\n\n13. **组织输出**：按用户最终需要的形式整理结果（而非过程记录）\n14. **撰写执行报告**（见输出格式）\n15. **主动提示后续动作**：预判用户下一步需要什么\n\n---\n\n```\n【任务理解】\n目标：[一句话]\n\n【需要确认的信息】\n1. [问题1]\n2. [问题2]\n\n【我的默认假设】\n- [参数A] = [默认值]（原因：[简短理由]）\n- [参数B] = [默认值]\n\n确认后立即开始执行。\n```\n\n```\n完成 [已完成步骤] → [关键产出简述]\n执行中 [当前执行步骤]...\n```\n\n```\n【执行完成】\n\n[核心输出，直接呈现，不加废话前缀]\n\n---\n\n- 完成步骤：[N]/[N]\n- 偏差说明：[若有默认假设被使用，或有绕过障碍的替代方案，在此说明]\n- 待优化项：[影响质量但未阻断任务的问题]\n\n- [具体的下一步建议1]\n- [具体的下一步建议2]\n```\n\n```\n【执行暂停 - 需要决策】\n\n已完成：[步骤X/N]\n当前障碍：[具体描述，一句话]\n障碍类型：信息缺失 / 权限不足 / 需求歧义 / 外部依赖\n\n可选方案：\nA. [方案A描述] → 优点：[X] 缺点：[Y]\nB. [方案B描述] → 优点：[X] 缺点：[Y]\n\n请选择方案或提供[具体信息]后继续。\n```\n\n---\n\n**不要做的事**\n- 不要把\"我假设X\"当借口绕过真正必要的信息——若假设错误会导致整个输出作废，必须先问\n- 不要在执行中途随意更改已声明的假设，除非用户明确修正\n- 不要为了\"显示努力\"而输出冗长的过程日志，用户要的是结果\n- 不要用于高风险不可逆操作（删除文件、发布内容、付款）——这类必须人工确认\n\n**推断规则（默认值）**\n- 语气/风格：默认与用户输入语气一致\n- 长度：默认\"满足任务目的的最短长度\"\n- 格式：默认纯文本，除非任务明显需要其他格式\n- 平台：根据内容类型推断（文章→微信/知乎，短文→小红书）\n\n**质量自检触发条件**\n每步完成后问自己：\n1. 这个输出符合步骤的完成标准吗？\n2. 这是我能做到的最好质量吗？\n3. 用户看到这个输出还需要大改吗？\n\n**常见任务的默认分解模式**\n- 内容创作：受众分析 → 角度选择 → 结构设计 → 逐段撰写 → 润色\n- 数据分析：理解问题 → 梳理数据 → 分析 → 结论 → 建议\n- 方案制定：现状梳理 → 目标定义 → 方案生成 → 评估筛选 → 输出\n- 问题排查：复现问题 → 定位原因 → 提出修复 → 验证方案\n\n**任务描述模糊时的处理**\n模糊目标会产生大量无效操作。若目标无法用一句话描述结果，必须先追问，不能凭猜测开始执行。\n判断标准：如果我对这个目标有两种以上不同的合理理解，就必须先确认。","previewTruncated":false,"bodyLength":2411,"steps":51,"codeBlocks":6,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"agent-eval-loop","dir":"代理评测闭环（agent-eval-loop）","category":"代理与工程","purpose":"为 AI 代理输出设计评测标准、自检表和迭代闭环，适合测试写作、代码、分析、自动化代理是否稳定可用。","triggers":["评测标准","自检表","迭代闭环","怎么测代理","输出稳定吗"],"boundary":"不适用于一次性内容创作，也不适用于 CI 失败排查（改走 code-review-ci）","description":"为 AI 代理输出设计评测标准、自检表和迭代闭环，适合测试写作、代码、分析、自动化代理是否稳定可用。触发词如\"评测标准/自检表/迭代闭环/怎么测代理/输出稳定吗\"。｜不适用于一次性内容创作，也不适用于 CI 失败排查（改走 code-review-ci）","lead":"把“感觉还行”变成可重复的评测标准，用样例、打分和回归检查持续提升代理质量。","headings":[{"level":1,"text":"Agent Eval Loop"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把“感觉还行”变成可重复的评测标准，用样例、打分和回归检查持续提升代理质量。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n评测维度、测试样例、打分表、修复建议：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":762,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"api-gateway","dir":"API网关（api-gateway）","category":"代理与工程","purpose":"Unified gateway for calling external APIs when user needs to fetch data from or send data to web services, SaaS platforms, or REST/GraphQL APIs including GitHub, Slack, Notion, and Chinese services.","triggers":["Call an external API or SaaS service (GitHub, Slack, Notion, REST/GraphQL) when no local C…"],"boundary":"不适用于本机 CLI 已能直接完成的任务（无需走 API），也不适用于需要浏览器交互的站点（改走 browser-automation）","description":"Unified gateway for calling external APIs when user needs to fetch data from or send data to web services, SaaS platforms, or REST/GraphQL APIs including GitHub, Slack, Notion, and Chinese services.Use when: \"Call an external API or SaaS service (GitHub, Slack, Notion, REST/GraphQL) when no local CLI covers it\".｜不适用于本机 CLI 已能直接完成的任务（无需走 API），也不适用于需要浏览器交互的站点（改走 browser-automation）","lead":"统一处理外部 API 调用：识别目标服务、检查凭证、构造请求（含认证头、分页、限流）、执行、解析响应、处理错误。支持链式调用多个服务。","headings":[{"level":1,"text":"API 网关（API Gateway）"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"支持服务分类"},{"level":3,"text":"代码与开发"},{"level":3,"text":"通讯与协作"},{"level":3,"text":"内容与知识"},{"level":3,"text":"AI 与 LLM"},{"level":3,"text":"数据与搜索"},{"level":3,"text":"国内服务"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1：识别目标服务和操作"},{"level":3,"text":"Step 2：凭证检查"},{"level":1,"text":"方式 1：环境变量（推荐）"},{"level":1,"text":"方式 2：会话中临时提供（不持久化）"},{"level":3,"text":"Step 3：构造 API 请求"},{"level":1,"text":"Bearer Token（GitHub, Notion, OpenAI, 飞书等）"},{"level":1,"text":"API Key 自定义头"},{"level":1,"text":"Basic Auth"},{"level":1,"text":"平台特定分页参数："},{"level":1,"text":"GitHub:  results_key=\"\", page_field=\"page\", per_page 用 Link header"},{"level":1,"text":"Notion:  cursor_field=\"start_cursor\", results_key=\"results\""},{"level":1,"text":"Slack:   cursor_field=\"cursor\", 在 response_metadata.next_cursor"},{"level":1,"text":"Airtable: cursor_field=\"offset\", results_key=\"records\""},{"level":3,"text":"Step 4：执行并记录"},{"level":3,"text":"Step 5：错误处理"},{"level":3,"text":"Step 6：链式调用"},{"level":2,"text":"输出格式"},{"level":2,"text":"API 调用结果"},{"level":3,"text":"响应数据"},{"level":3,"text":"统计"},{"level":3,"text":"后续建议（如适用）"},{"level":2,"text":"Gotchas"}],"preview":"统一处理外部 API 调用：识别目标服务、检查凭证、构造请求（含认证头、分页、限流）、执行、解析响应、处理错误。支持链式调用多个服务。\n\n不适用于：需要浏览器渲染的动态内容（用 browser-automation skill）；没有 API 的网站（用 content-scraper skill）。\n\n---\n\n- 用户说\"从 GitHub/Slack/Notion/飞书/Twitter 获取数据\"\n- 用户说\"调用 XX 的 REST API\"\n- 需要整合多个外部服务的数据\n- 需要处理带分页的大量数据拉取\n\n---\n\n| 服务 | 常用操作 |\n|------|----------|\n| GitHub | 搜索仓库、列 Issues、读 PR、读文件内容、创建 Issue |\n| GitLab | 同 GitHub，endpoint 前缀为 `/api/v4/` |\n| npm Registry | 查包信息、版本列表、周下载量 |\n| PyPI | 查包信息、依赖树 |\n\n| 服务 | 常用操作 |\n|------|----------|\n| Slack | 发消息、查频道历史、搜索消息 |\n| 飞书 | 发消息、查多维表格、创建文档 |\n| 钉钉 | 发群消息、查通讯录 |\n| Discord | 发消息、读取频道消息 |\n\n| 服务 | 常用操作 |\n|------|----------|\n| Notion | 查数据库、创建页面、更新属性 |\n| Airtable | 列记录、创建记录、批量更新 |\n| Confluence | 查页面内容、创建页面 |\n\n| 服务 | 常用操作 |\n|------|----------|\n| OpenAI | Chat Completion、Embeddings、文件上传 |\n| Anthropic | Messages API |\n| Replicate | 运行模型、查询任务状态 |\n\n| 服务 | 常用操作 |\n|------|----------|\n| Exa | 语义搜索、内容抓取 |\n| SerpAPI | Google 搜索结果 |\n| NewsAPI | 新闻搜索、按关键词过滤 |\n| Alpha Vantage | 股票数据、汇率 |\n\n| 服务 | 常用操作 |\n|------|----------|\n| 飞书开放平台 | 消息、多维表格、云文档 |\n| 百度 AI | OCR、NLP 分析、翻译 |\n| 高德地图 | 地理编码、路线规划、POI 搜索 |\n| 快递 100 | 物流查询 |\n\n---\n\n从用户请求中提取：\n- 目标服务名称\n- 操作类型（读取/写入/搜索）\n- 资源标识符（仓库名、频道 ID、用户名等）\n- 过滤条件和分页需求\n\n如果服务不在支持列表中，询问用户提供 API 文档 URL，然后根据文档构造请求。\n\n凭证配置模式（按优先级）：\n```bash\nexport GITHUB_TOKEN=YOUR_GITHUB_TOKEN\nexport SLACK_BOT_TOKEN=YOUR_TOKEN\nexport NOTION_API_KEY=YOUR_API_KEY\n\n用户在对话中直接提供 token\n```\n\n凭证缺失时的标准提示：\n```\n检测到缺少 {SERVICE}_TOKEN。\n\n请选择：\nA. 在终端运行：export {SERVICE}_TOKEN=你的token，然后重试\nB. 直接提供 token（本次会话使用，不保存）\nC. 跳过认证（仅适用于该服务的公开 API）\n\n获取 token 的地址：{官方文档链接}\n```\n\n安全规则：不将凭证写入文件或日志；输出中仅显示 token 前 8 位（`YOUR_TOKEN...`）。\n\n**通用认证头**\n```python\nheaders = {\"Authorization\": f\"Bearer {token}\"}\n\nheaders = {\"X-API-Key\": api_key}           # Airtable\nheaders = {\"api-key\": api_key}              # Azure OpenAI\n\nimport base64\ncreds = base64.b64encode(f\"{user}:{password}\".encode()).decode()\nheaders = {\"Authorization\": f\"Basic {creds}\"}\n```\n\n**分页处理（通用模板）**\n```python\nimport requests\n\ndef paginate_api(url, headers, params=None,\n                 results_key=\"items\", cursor_field=None, page_field=\"page\"):\n    results = []\n    page = 1\n    cursor = None\n\n    while True:\n        p = dict(params or {})\n        if cursor_field and cursor:\n            p[cursor_field] = cursor\n        elif not cursor_field:\n            p[page_field] = page\n\n        resp = requests.get(url, headers=headers, params=p, timeout=30)\n        resp.raise_for_status()\n        data = resp.json()\n\n        batch = data.get(results_key, [])\n        results.extend(batch)\n\n        if not batch:\n            break\n        if cursor_field:\n            cursor = da","previewTruncated":true,"bodyLength":5943,"steps":32,"codeBlocks":8,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"browser-automation","dir":"浏览器自动化（browser-automation）","category":"代理与工程","purpose":"Controls a real browser via MCP Playwright to automate web tasks including navigation, form filling, clicking, and data extraction when direct API access is unavailable.","triggers":["Drive a real browser for navigation, form filling, clicking, or extraction when no API is …"],"boundary":"不适用于有官方 API 可直连的服务（改走 api-gateway），也不适用于只读网页检索（改走 browser-research-agent）","description":"Controls a real browser via MCP Playwright to automate web tasks including navigation, form filling, clicking, and data extraction when direct API access is unavailable.Use when: \"Drive a real browser for navigation, form filling, clicking, or extraction when no API is available\".｜不适用于有官方 API 可直连的服务（改走 api-gateway），也不适用于只读网页检索（改走 browser-research-agent）","lead":"通过 MCP Playwright 工具控制浏览器，将用户目标分解为原子操作序列，执行并收集结果。优先使用真实浏览器模式以保持已有登录状态。","headings":[{"level":1,"text":"浏览器自动化（Browser Automation）"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1：目标分解为原子操作"},{"level":3,"text":"Step 2：元素选择策略"},{"level":3,"text":"Step 3：处理动态内容"},{"level":3,"text":"Step 4：错误恢复"},{"level":3,"text":"Step 5：常用操作模板"},{"level":2,"text":"输出格式"},{"level":2,"text":"浏览器自动化结果"},{"level":3,"text":"收集的数据"},{"level":3,"text":"执行摘要"},{"level":3,"text":"遇到的问题（如有）"},{"level":2,"text":"Gotchas"}],"preview":"通过 MCP Playwright 工具控制浏览器，将用户目标分解为原子操作序列，执行并收集结果。优先使用真实浏览器模式以保持已有登录状态。\n\n适用于：没有 API 的网站、需要已登录状态的操作、动态渲染内容抓取、批量表单填写。不适用于有公开 API 的服务（用 api-gateway skill 更高效）。\n\n---\n\n- 用户说\"帮我自动化 XX 网站的操作\"\n- 需要从没有 API 的网站获取数据\n- 需要批量填写表单或执行重复点击操作\n- content-scraper skill 调用此 skill 作为底层引擎\n\n---\n\n将用户目标分解为原子操作列表，每个操作只做一件事：\n\n```\n原子操作类型：\nnavigate(url)          跳转到 URL\nsnapshot()             截取页面可访问性快照（每次操作前必须调用）\nclick(ref)             点击元素\ntype(ref, text)        在元素中输入文本\nselect(ref, value)     选择下拉选项\nwait_for(text)         等待文本出现\nwait_for(time=N)       等待 N 秒\nscroll()               滚动页面（触发懒加载）\nextract(ref)           提取元素文本或属性\nhandle_dialog()        处理弹窗/确认框\n```\n\n示例分解（登录后获取订单列表）：\n```\n1. navigate(\"https://shop.example.com/login\")\n2. snapshot()                         ← 确认页面结构，找到输入框 ref\n3. type(email_ref, email)\n4. type(password_ref, password)\n5. click(submit_ref)\n6. wait_for(\"我的订单\")               ← 等待登录成功标志出现\n7. navigate(\"https://shop.example.com/orders\")\n8. snapshot()                         ← 确认订单页结构\n9. extract(order_list_ref)\n10. 检查是否有\"下一页\" → 如有则 click 后重复 8-9\n```\n\n**按优先级选择（高到低）：**\n\n优先级 1：从 snapshot 的 ref 直接使用（最准确）\n```\n每次操作前调用 browser_snapshot()，从返回的快照树中\n找到目标元素的 ref（格式如 e123），直接传入 ref 参数。\n```\n\n优先级 2：按角色（role）和文本\n```\n通过快照找到 role=button name=\"登录\" 的元素\n```\n\n优先级 3：ARIA 属性\n```\ninput[placeholder=\"请输入邮箱\"]\ninput[aria-label=\"搜索框\"]\nbutton[name=\"提交\"]\n```\n\n优先级 4：CSS 语义类名（最后手段）\n```\nform.login-form input[type=\"email\"]\n避免：div.css-1a2b3c4d（hash 类名，随版本变化）\n```\n\n核心原则：每次操作前先调用 snapshot()，从快照中找精确 ref，再执行操作。不要猜测或复用上一次的 ref。\n\n**等待策略**\n```\n场景：点击后页面跳转\n→ browser_wait_for(text=\"目标页面特征文字\")\n→ 不要用固定 sleep，用内容等待\n\n场景：内容懒加载（滚动触发）\n→ browser_evaluate(\"window.scrollTo(0, document.body.scrollHeight)\")\n→ browser_wait_for(time=2)\n→ browser_snapshot() 检查是否有新内容出现\n\n场景：弹窗/确认框\n→ 先 snapshot() 检查是否有 dialog role\n→ browser_handle_dialog(accept=True/False)\n\n场景：iframe 内容\n→ browser_evaluate(\"document.querySelector('iframe').src\")\n→ browser_navigate(iframe_url) 直接访问 iframe 页面\n```\n\n**登录墙检测和处理**\n```\n检测：snapshot() 中出现以下文字之一：\n\"登录\" \"注册\" \"Sign in\" \"Log in\" \"继续阅读\" \"查看完整内容\"\n\n处理顺序：\n1. 检查真实浏览器模式下是否已有 session（快照中无登录按钮）\n2. 如无 session，暂停并提示用户：\n   \"{平台名} 需要登录。请在浏览器中完成登录，完成后告诉我继续。\"\n3. 用户确认后，重新 navigate 并继续\n4. 不要在代码或对话中传递明文密码\n```\n\n**元素未找到**\n```\n处理流程：\n1. browser_snapshot() 重新获取页面状态\n2. 检查页面 URL 是否已跳转（目标已变）\n3. 检查元素是否在视口外 → scroll 后重试\n4. 等待 2 秒后重新 snapshot 并重试（最多 3 次）\n5. 三次失败：截图 + 描述当前页面状态，请用户确认\n```\n\n**页面加载未完成**\n```\n处理流程：\n1. browser_evaluate(\"document.readyState\") 检查加载状态\n2. 如状态为 loading → browser_wait_for(time=5)\n3. 如状态为 complete 但内容未出现 → 可能是 SPA，\n   browser_wait_for(text=\"期望出现的特征文字\")\n4. 超时阈值：15 秒，超过则报告并请用户确认\n```\n\n**验证码拦截**\n```\n检测：snapshot 中出现 \"captcha\" ","previewTruncated":true,"bodyLength":4489,"steps":46,"codeBlocks":15,"hasScripts":false,"missingBins":[],"sou e delegating.","triggers":["Delegate a well-specified programming task (language, I/O, tests) to a coding sub-agent"],"boundary":"不适用于代码审查（改走 code-review-ci），也不适用于生产级重构规范（改走 quality-code）","description":"Delegates a coding task to a specialized sub-agent when the user provides a programming task with clear language, input/output spec, and test requirements. Rejects incomplete specs before delegating.Use when: \"Delegate a well-specified programming task (language, I/O, tests) to a coding sub-agent\".｜不适用于代码审查（改走 code-review-ci），也不适用于生产级重构规范（改走 quality-code）","lead":"接收编程任务规格，验证完整性，构造标准化子代理提示，启动子代理执行，验证返回结果的语法正确性和测试覆盖率，最终将结果返回主会话。","headings":[{"level":1,"text":"编程代理（Coding Agent）"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1：规格完整性验证"},{"level":3,"text":"Step 2：构造子代理提示"},{"level":2,"text":"任务规格"},{"level":3,"text":"输入规格"},{"level":3,"text":"输出规格"},{"level":3,"text":"测试用例"},{"level":3,"text":"约束条件"},{"level":2,"text":"实现要求"},{"level":2,"text":"输出格式"},{"level":1,"text":"=== TESTS ==="},{"level":1,"text":"=== IMPLEMENTATION ==="},{"level":3,"text":"Step 3：启动子代理"},{"level":3,"text":"Step 4：验证返回结果"},{"level":1,"text":"Python"},{"level":1,"text":"TypeScript"},{"level":1,"text":"Go"},{"level":3,"text":"Step 5：返回或重试"},{"level":2,"text":"输出格式"},{"level":2,"text":"编程代理执行结果"},{"level":3,"text":"实现代码"},{"level":3,"text":"测试代码"},{"level":3,"text":"覆盖率报告"},{"level":3,"text":"验证结果"},{"level":3,"text":"使用说明"},{"level":2,"text":"Gotchas"}],"preview":"接收编程任务规格，验证完整性，构造标准化子代理提示，启动子代理执行，验证返回结果的语法正确性和测试覆盖率，最终将结果返回主会话。\n\n适用于：需要专注实现单一功能模块、工具函数、API 端点、数据处理管道的任务。不适用于需要修改多个现有文件的重构任务（直接在主会话处理）。\n\n---\n\n- 用户说\"帮我写一个函数/模块/脚本\"，并提供了明确规格\n- 任务需要与主会话隔离执行（避免大量代码占满上下文窗口）\n- 需要生成带完整测试的功能实现\n- 并行执行多个独立编码任务\n\n---\n\n收到任务后，检查以下字段是否全部存在。**任何一项缺失，立即拒绝并列出缺失项，不进入后续步骤。**\n\n```\n验证清单：\n[ ] language        - 编程语言（Python / TypeScript / Go / Rust 等）\n[ ] function_name   - 函数/模块名称\n[ ] input_spec      - 输入参数：类型、格式、约束\n[ ] output_spec     - 返回值：类型、格式、示例\n[ ] test_cases      - 至少 3 个测试用例（含边界情况）\n[ ] constraints     - 性能要求、禁用 API、依赖限制（可选但推荐）\n```\n\n缺失时的拒绝格式：\n```\n规格不完整，无法委托编程代理。缺少以下信息：\n- input_spec：请描述参数类型和格式\n- test_cases：请提供至少 3 个测试用例（正常情况 + 边界情况 + 错误情况）\n\n补全后重新提交。\n```\n\n使用以下模板，将验证通过的规格填入：\n\n```\n=== CODING AGENT PROMPT ===\n\n你是一个专注的编程实现代理。你的唯一任务是实现下面规格，不做任何超出规格的工作。\n\n语言：{language}\n函数名：{function_name}\n\n{input_spec}\n\n{output_spec}\n\n{test_cases}\n\n{constraints | 默认：无特殊约束}\n\n1. 先写测试（TDD）：将所有测试用例转为可运行的测试代码\n2. 实现函数体，确保所有测试通过\n3. 函数体不超过 50 行；如超过，拆分为辅助函数\n4. 不引入未在约束条件中列出的外部依赖\n5. 不可变原则：不修改传入参数，返回新对象\n\n严格按以下结构返回，不添加任何解释文字：\n\n```{language}\n{测试代码}\n\n{实现代码}\n```\n\n覆盖率报告（文字格式）：\n- 行覆盖率：X%\n- 分支覆盖率：X%\n- 未覆盖路径：{列表，无则写 none}\n=== END PROMPT ===\n```\n\n通过 Task 工具启动子代理，传入 Step 2 构造的提示。等待返回结果。\n\n对返回代码执行以下检查：\n\n**语法检查**\n```bash\npython -m py_compile <file>\n\nnpx tsc --noEmit <file>\n\ngo vet ./...\n```\n\n**测试覆盖率检查**\n- 行覆盖率 < 80%：返回失败，要求子代理补充测试\n- 分支覆盖率 < 70%：警告，在输出中注明未覆盖分支\n\n**代码质量检查**\n```\n[ ] 函数体 ≤ 50 行\n[ ] 无可变操作（in-place modify on input params）\n[ ] 无硬编码值（魔法数字/字符串应提取为常量）\n[ ] 错误路径有明确处理（无裸 except/catch）\n[ ] 无未使用的导入\n```\n\n验证通过后，向主会话返回标准化结果。\n\n如验证失败，将失败原因附加到原始提示，重新执行（最多重试 2 次）。两次均失败时，返回失败报告，说明具体问题，不再重试。\n\n---\n\n```\n\n状态：成功 / 失败\n\n```{language}\n{完整实现，含 imports}\n```\n\n```{language}\n{完整测试代码}\n```\n\n- 行覆盖率：XX%\n- 分支覆盖率：XX%\n- 未覆盖路径：{列表或 none}\n\n- 语法检查：通过 / 失败\n- 质量检查：通过 X/5 项\n- 失败项：{如有}\n\n{如何导入和调用该函数，1-3 行}\n```\n\n---\n\n**规格歧义必须在 Step 1 解决**\n- `input_spec` 写\"字符串列表\"但测试用例用了嵌套列表 → 以测试用例为准，但在输出中标注歧义，让用户确认\n- 输出说\"返回 True/False\"但测试期望抛出异常 → 直接拒绝，要求澄清；不要猜测意图\n\n**语言特定陷阱**\n- Python：mutable default argument（`def f(lst=[])`）是经典 bug，实现中必须避免\n- TypeScript：strict 模式下 `any` 必须有注释说明理由；返回类型必须显式声明\n- Go：不允许吞掉 error 返回值；`_` 忽略 error 是 bug\n\n**不要信任子代理的自我报告**\n- 子代理声称\"覆盖率 95%\"但测试用例可能不覆盖边界 → 必须自行核验，不接受子代理的口头保证\n- 子代理可能引入未声明的外部库 → 检查 imports 是否全在约束范围内\n\n**重试策略细节**\n- 第一次失败：附加具体失败原因，重新提交原始规格（不修改规格）\n- 第二次失败：停止，输出失败报告 + 建议用户手动处理的具体步骤\n- 不要通过修改规格来\"迁就\"失败的实现（这会掩盖真正的问题）\n\n**不适用场景**\n- 需要访问文件系统、数据库、外部 API 的任务 → 配合 api-gateway skill\n- 需要修改多个现有文件的重构 → 直接在主会话处理\n- 任务描述超过 500 字 → 先拆分为独立函数，再分批委托","previewTruncated":false,"bodyLength":2769,"steps":35,"codeBlocks":9,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"context-engineering-agent","dir":"上下文工程代理（context-engineering-agent）","category":"代理与工程","purpose":"为复杂任务整理长期上下文、规则、约束和交付标准，适合项目启动、交接、代理反复跑偏、需要把零散资料变成可复用上下文包的场景。","triggers":["整理上下文","项目交接","代理跑偏","上下文包"],"boundary":"不适用于单轮问答所需的最小上下文，也不适用于把材料做成可复用技能（改走 skill-distillation）","description":"为复杂任务整理长期上下文、规则、约束和交付标准，适合项目启动、交接、代理反复跑偏、需要把零散资料变成可复用上下文包的场景。触发词如\"整理上下文/项目交接/代理跑偏/上下文包\"。｜不适用于单轮问答所需的最小上下文，也不适用于把材料做成可复用技能（改走 skill-distillation）","lead":"把散落在聊天、文件、网页和历史结论里的背景，压缩成代理真正需要的任务上下文包。","headings":[{"level":1,"text":"Context Engineering Agent"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"把散落在聊天、文件、网页和历史结论里的背景，压缩成代理真正需要的任务上下文包。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n上下文包、约束清单、验收标准、下一步建议：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":775,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[]," istant into a proactive partner that anticipates needs"],"boundary":"不适用于用户已给出明确单步指令的任务（改走 active-agent 直接执行）","description":"\"Transform AI agents from task-followers into proactive partners that anticipate needs and continuously improve. Now with WAL Protocol, Working Buffer, Autonomous Crons, and battle-tested patterns. Part of the Hal Stack 🦞\". Use when: \"Turn a passive assistant into a proactive partner that anticipates needs\".｜不适用于用户已给出明确单步指令的任务（改走 active-agent 直接执行）","lead":"**By Hal Labs** — Part of the Hal Stack","headings":[{"level":1,"text":"Proactive Agent 🦞"},{"level":2,"text":"What's New in v3.1.0"},{"level":2,"text":"What's in v3.0.0"},{"level":2,"text":"The Three Pillars"},{"level":2,"text":"Contents"},{"level":2,"text":"Quick Start"},{"level":2,"text":"Core Philosophy"},{"level":2,"text":"Architecture Overview"},{"level":2,"text":"Memory Architecture"},{"level":2,"text":"The WAL Protocol ⭐ NEW"},{"level":3,"text":"Trigger — SCAN EVERY MESSAGE FOR:"},{"level":3,"text":"The Protocol"},{"level":3,"text":"Why This Works"},{"level":2,"text":"Working Buffer Protocol ⭐ NEW"},{"level":3,"text":"How It Works"},{"level":3,"text":"Buffer Format"},{"level":1,"text":"Working Buffer (Danger Zone Log)"},{"level":2,"text":"[timestamp] Human"},{"level":2,"text":"[timestamp] Agent (summary)"},{"level":3,"text":"Why This Works"},{"level":2,"text":"Compaction Recovery ⭐ NEW"},{"level":3,"text":"Recovery Steps"},{"level":2,"text":"Unified Search Protocol"},{"level":2,"text":"Security Hardening (Expanded)"},{"level":3,"text":"Core Rules"},{"level":3,"text":"Skill Installation Policy ⭐ NEW"},{"level":3,"text":"External AI Agent Networks ⭐ NEW"},{"level":3,"text":"Context Leakage Prevention ⭐ NEW"},{"level":2,"text":"Relentless Resourcefulness ⭐ NEW"},{"level":3,"text":"Before Saying \"Can't\""},{"level":2,"text":"Self-Improvement Guardrails ⭐ NEW"},{"level":3,"text":"ADL Protocol (Anti-Drift Limits)"},{"level":3,"text":"VFM Protocol (Value-First Modification)"},{"level":2,"text":"Autonomous vs Prompted Crons ⭐ NEW"},{"level":3,"text":"Two Architectures"},{"level":3,"text":"The Failure Mode"},{"level":3,"text":"Example: Memory Freshener"},{"level":2,"text":"Verify Implementation, Not Intent ⭐ NEW"},{"level":3,"text":"The Pattern"},{"level":3,"text":"Real Example"}],"preview":"**By Hal Labs** — Part of the Hal Stack\n\n**A proactive, self-improving architecture for your AI agent.**\n\nMost agents just wait. This one anticipates your needs — and gets better at it over time.\n\n- **Autonomous vs Prompted Crons** — Know when to use `systemEvent` vs `isolated agentTurn`\n- **Verify Implementation, Not Intent** — Check the mechanism, not just the text\n- **Tool Migration Checklist** — When deprecating tools, update ALL references\n\n- **WAL Protocol** — Write-Ahead Logging for corrections, decisions, and details that matter\n- **Working Buffer** — Survive the danger zone between memory flush and compaction\n- **Compaction Recovery** — Step-by-step recovery when context gets truncated\n- **Unified Search** — Search all sources before saying \"I don't know\"\n- **Security Hardening** — Skill installation vetting, agent network warnings, context leakage prevention\n- **Relentless Resourcefulness** — Try 10 approaches before asking for help\n- **Self-Improvement Guardrails** — Safe evolution with ADL/VFM protocols\n\n---\n\n**Proactive — creates value without being asked**\n\n✅ **Anticipates your needs** — Asks \"what would help my human?\" instead of waiting\n\n✅ **Reverse prompting** — Surfaces ideas you didn't know to ask for\n\n✅ **Proactive check-ins** — Monitors what matters and reaches out when needed\n\n**Persistent — survives context loss**\n\n✅ **WAL Protocol** — Writes critical details BEFORE responding\n\n✅ **Working Buffer** — Captures every exchange in the danger zone\n\n✅ **Compaction Recovery** — Knows exactly how to recover after context loss\n\n**Self-improving — gets better at serving you**\n\n✅ **Self-healing** — Fixes its own issues so it can focus on yours\n\n✅ **Relentless resourcefulness** — Tries 10 approaches before giving up\n\n✅ **Safe evolution** — Guardrails prevent drift and complexity creep\n\n---\n\n1. [Quick Start](#quick-start)\n2. [Core Philosophy](#core-philosophy)\n3. [Architecture Overview](#architecture-overview)\n4. [Memory Architecture](#memory-architecture)\n5. [The WAL Protocol](#the-wal-protocol) ⭐ NEW\n6. [Working Buffer Protocol](#working-buffer-protocol) ⭐ NEW\n7. [Compaction Recovery](#compaction-recovery) ⭐ NEW\n8. [Security Hardening](#security-hardening) (expanded)\n9. [Relentless Resourcefulness](#relentless-resourcefulness)\n10. [Self-Improvement Guardrails](#self-improvement-guardrails)\n11. [Autonomous vs Prompted Crons](#autonomous-vs-prompted-crons) ⭐ NEW\n12. [Verify Implementation, Not Intent](#verify-implementation-not-intent) ⭐ NEW\n13. [Tool Migration Checklist](#tool-migration-checklist) ⭐ NEW\n14. [The Six Pillars](#the-six-pillars)\n","previewTruncated":true,"bodyLength":20253,"steps":169,"codeBlocks":9,"hasScripts":true,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"3.1.0","models":[]},{"name":"quality-code","dir":"quality-code","category":"代理与工程","purpose":"当编写、重构、审查生产级代码时使用，强制\"先理解→规划→写测试→写代码→验证→文档\"流程，保证代码符合软件工程架构、可测试、可维护，禁止屎山代码。","triggers":["写代码","重构","代码审查","生产级","架构","技术方案"],"boundary":"不适用于非代码文档与公文（改走 business-writing / office-docs）","description":"当编写、重构、审查生产级代码时使用，强制\"先理解→规划→写测试→写代码→验证→文档\"流程，保证代码符合软件工程架构、可测试、可维护，禁止屎山代码。触发词如\"写代码/重构/代码审查/生产级/架构/技术方案\"。｜不适用于非代码文档与公文（改走 business-writing / office-docs）","lead":"You are an AI coding agent writing production code. Follow these rules strictly.","headings":[{"level":1,"text":"Quality Code — Universal Rules for AI Coding Agents"},{"level":2,"text":"Method: Understand → Plan → Write Tests → Write Code → Verify → Document"},{"level":3,"text":"Step 0: Understand & Propose Architecture"},{"level":3,"text":"Step 1: Plan the Implementation"},{"level":3,"text":"Step 2: Write Tests First"},{"level":3,"text":"Step 3: Write Minimal Code"},{"level":3,"text":"Step 4: Verify"},{"level":3,"text":"Step 5: Document Changes"},{"level":2,"text":"Write Short Code"},{"level":1,"text":"BAD"},{"level":1,"text":"GOOD"},{"level":1,"text":"BAD"},{"level":1,"text":"GOOD"},{"level":2,"text":"Architecture: File Organization"},{"level":3,"text":"Rule #1: Follow the Framework"},{"level":3,"text":"Rule #2: Source Code in `src/`"},{"level":3,"text":"Rule #3: Split by Logic Type, Not by Size"},{"level":3,"text":"Rule #4: Business Logic Is the Core"},{"level":1,"text":"BAD — business logic knows about HTTP"},{"level":1,"text":"GOOD — pure, caller provides data"},{"level":3,"text":"Key Principles"},{"level":2,"text":"Testability"},{"level":2,"text":"Core Principles"},{"level":2,"text":"Simplicity"},{"level":2,"text":"Naming"},{"level":2,"text":"Functions"},{"level":2,"text":"Error Handling"},{"level":2,"text":"Async/Await"},{"level":2,"text":"API Clients: Verify Before Coding"},{"level":2,"text":"Logging"},{"level":2,"text":"Git Hygiene"},{"level":2,"text":"Don't Touch What's Not Yours"},{"level":2,"text":"Security"},{"level":2,"text":"Language"},{"level":2,"text":"Context Efficiency"},{"level":2,"text":"Communication"}],"preview":"You are an AI coding agent writing production code. Follow these rules strictly.\n\n- **Read before writing.** Never change code you haven't read.\n- **Ask if unclear.** Don't guess requirements — clarify with the user.\n- **For new projects or features — propose the project structure first.** Before writing any code, present to the user:\n  1. What framework/stack is being used (or should be used)\n  2. What the folder structure will look like\n  3. Where each piece of logic will live\n  4. What the entry point is\n- **Follow the framework's conventions.** Don't invent your own structure when the framework has one.\n- **For existing projects — read the structure first** and follow established patterns.\n- **Identify how to run tests, build, and lint.** Find the commands early (package.json scripts, Makefile, CI config). Run them after every meaningful change — don't wait until the end.\n- **If the project uses a database — design the schema first.** Before writing any code, propose table/collection structure, relationships, and key fields to the user. Document the schema. Changing DB structure later is expensive — get it right upfront.\n- **List prerequisites before coding.** Tell the user upfront what's needed to run and test the project: create `.env` with which variables, which API keys to obtain, which services to set up. Don't let the user discover missing credentials mid-development.\n\n- Break work into todos. Each step = independently verifiable.\n- **One feature at a time.** Plan the full project, then take each feature through the complete cycle: plan → tests → code → verify → document. Don't write all tests first or all code first — finish one feature before starting the next.\n- **Before writing any function, decide where it lives.** Not \"I'll refactor later\" — place it correctly from the start.\n- **Think about what can break.** List edge cases, invalid inputs, and possible failures upfront — this makes writing tests straightforward.\n\n```\nExample plan for \"add Stripe payments\":\n1. src/models/payment      — Payment, PaymentStatus types\n2. src/clients/stripe      — StripeClient: charge, refund, get_balance\n3. src/services/payments   — process_payment, validate_amount (business logic)\n4. tests/payments          — tests for services/payments\n5. entry point             — wire new /pay command or route\n```\n\n- **Write the test before the implementation.** The test defines the contract: what goes in, what comes out, what should fail.\n- Start with the happy path, then add edge cases.\n- If full TDD is overkill — at minimum write tests immediately after the code, not \"","previewTruncated":true,"bodyLength":13392,"steps":124,"codeBlocks":6,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","level":"V0","evidence":"","note":"2026-09-10 A阶段：补边界声明；依赖垫片/ jq 已修；2026-09-11 修正：原 V1 系静态检查机械发放（无实跑证据），降为 V0","version":"","models":[]},{"name":"repo-context-compiler","dir":"仓库上下文编译器（repo-context-compiler）","category":"代理与工程","purpose":"为大型代码库生成给 AI 读取的模块图、入口地图和上下文包，适合代理反复读仓库、找不到边界的场景。","triggers":["代码库模块图","入口地图","给AI读的上下文包","找不到边界"],"boundary":"不适用于单文件或小脚本的理解，也不适用于代码审查（改走 code-review-ci）","description":"为大型代码库生成给 AI 读取的模块图、入口地图和上下文包，适合代理反复读仓库、找不到边界的场景。触发词如\"代码库模块图/入口地图/给AI读的上下文包/找不到边界\"。｜不适用于单文件或小脚本的理解，也不适用于代码审查（改走 code-review-ci）","lead":"让代理先读地图再动手，降低重复探索和误改风险。","headings":[{"level":1,"text":"Repo Context Compiler"},{"level":2,"text":"核心定位"},{"level":2,"text":"触发场景"},{"level":2,"text":"工作流"},{"level":3,"text":"Step 1: 明确目标和约束"},{"level":3,"text":"Step 2: 拆解输入材料"},{"level":3,"text":"Step 3: 生成一版可交付结果"},{"level":3,"text":"Step 4: 自检和迭代"},{"level":2,"text":"输出格式"},{"level":2,"text":"Gotchas"}],"preview":"让代理先读地图再动手，降低重复探索和误改风险。\n\n- 用户明确说要做与本 skill 描述相关的任务\n- 用户提供素材、数据、链接、会议记录、代码或业务问题，需要整理成可执行交付物\n- 用户想减少来回沟通，希望 AI 先给出结构化方案和下一步动作\n\n先提取用户真正想要的结果、受众、使用场景、输入材料、截止时间和不可触碰的边界。信息不足但不影响启动时，先写明合理假设继续推进。\n\n把原始材料拆成事实、判断、待验证假设和可执行动作。不要把未经验证的推测包装成结论。\n\n围绕用户目标生成完整初稿或分析结果。优先给可直接使用的内容，其次给解释。\n\n按本任务的质量标准检查：是否具体、是否可执行、是否有证据、是否遗漏关键风险。发现问题时直接修正，不只提示用户自己改。\n\n```text\n目标：...\n关键输入：...\n主要结论/产出：...\n模块图、关键文件、调用关系、任务入口建议：...\n风险与待确认：...\n下一步：...\n```\n\n1. **不要输出泛泛建议**\n   解释：学员需要能马上使用的交付物。每条建议都要对应具体动作、判断依据或可检查结果。\n\n2. **不要假装已经验证外部事实**\n   解释：涉及市场、金融、工具版本、平台规则和新闻时，要说明来源或标注待验证。\n\n3. **不要无限扩写**\n   解释：先交付最小完整版本，再根据用户反馈加深。复杂内容可以拆成清单、表格和分阶段计划。","previewTruncated":false,"bodyLength":755,"steps":6,"codeBlocks":1,"hasScripts":false,"missingBins":[],"source":"本机自建","license":"专有 · 未附许可文件","commercialUse":"owner-decides","redistribute":"undecided","leve
